<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando... | Reproductor</title>
  <style>
    :root {
      --bg-color: #0f0c1b;
      --card-bg: #1a162b;
      --accent-purple: #8b5cf6;
      --text-color: #ffffff;
      --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .container { width: 100%; max-width: 1000px; }
    .btn-back {
      display: inline-block;
      margin-bottom: 15px;
      color: var(--accent-purple);
      text-decoration: none;
      font-weight: 600;
    }
    .btn-back:hover { text-decoration: underline; }
    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25);
      border: 1px solid rgba(139, 92, 246, 0.3);
      position: relative;
    }
    iframe { width: 100%; height: 100%; border: none; }
    .movie-info {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .poster {
      width: 120px; height: 180px;
      object-fit: cover; border-radius: 8px;
      background-color: #2a243d; flex-shrink: 0;
    }
    .details { display: flex; flex-direction: column; gap: 8px; }
    .badge {
      display: inline-block; background: var(--accent-purple);
      color: #fff; padding: 4px 10px; font-size: 0.8rem;
      border-radius: 20px; width: fit-content; text-transform: uppercase; font-weight: bold;
    }
    .description { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; }
    .status-msg {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="btn-back">← Volver al catálogo</a>

    <!-- Pantalla del Reproductor -->
    <div class="player-box" id="playerContainer">
      <div class="status-msg" id="statusMsg">Cargando película...</div>
    </div>

    <!-- Ficha de Información -->
    <div class="movie-info" id="movieInfo" style="display: none;">
      <img id="moviePoster" class="poster" src="" alt="Póster">
      <div class="details">
        <span id="movieCategory" class="badge">Película</span>
        <h1 id="movieTitle">Título</h1>
        <p id="movieDescription" class="description"></p>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REEMPLAZA CON TU USUARIO REAL DE GITHUB
    const BASE_URL_JSON = "https://raw.githubusercontent.com/jeissonxp182/peliculas/main/";

    // 📁 ARCHIVOS PRINCIPALES CORRESPONDIENTES A TUS SECCIONES
    const ARCHIVOS_SECCIONES = [
      "sagas.json",
      "peliculas.json",
      "series.json",
      "anime.json",
      "videos.json"
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const peliculaBuscada = urlParams.get('id');

    const playerContainer = document.getElementById('playerContainer');
    const statusMsg = document.getElementById('statusMsg');
    const movieInfo = document.getElementById('movieInfo');

    function procesarUrlVideo(url) {
      if (!url) return '';
      if (url.includes('drive.google.com')) {
        return url.replace(/\/view(\?.*)?$/, '/preview');
      }
      return url;
    }

    async function cargarPelicula() {
      if (!peliculaBuscada) {
        statusMsg.textContent = "⚠️ No se especificó ninguna película (falta ?id= en la URL).";
        return;
      }

      try {
        let peliculaEncontrada = null;
        let categoriaDetectada = "Película";

        // Busca a través de tus archivos de sección
        for (const archivo of ARCHIVOS_SECCIONES) {
          try {
            const respuesta = await fetch(`${BASE_URL_JSON}${archivo}`);
            if (!respuesta.ok) continue;

            const data = await respuesta.json();

            for (const item of data) {
              // CASO 1: Es un JSON con sagas/grupos (ej. sagas.json)
              if (item.peliculas && Array.isArray(item.peliculas)) {
                const coincide = item.peliculas.find(p => p.url === peliculaBuscada || p.url.includes(peliculaBuscada));
                if (coincide) {
                  peliculaEncontrada = coincide;
                  categoriaDetectada = item.saga || "Saga";
                  break;
                }
              }
              // CASO 2: Es un JSON plano de películas sueltas (ej. peliculas.json)
              else if (item.url) {
                if (item.url === peliculaBuscada || item.url.includes(peliculaBuscada)) {
                  peliculaEncontrada = item;
                  categoriaDetectada = archivo.replace('.json', '');
                  break;
                }
              }
            }
          } catch (e) {
            console.warn(`No se pudo leer ${archivo}:`, e);
          }

          if (peliculaEncontrada) break;
        }

        if (!peliculaEncontrada) {
          throw new Error("No se encontró la película en tus JSON de secciones.");
        }

        document.title = `${peliculaEncontrada.titulo} | Reproductor`;

        const linkVideo = procesarUrlVideo(peliculaEncontrada.url_video || peliculaEncontrada.link || peliculaEncontrada.iframe || peliculaEncontrada.url);

        playerContainer.innerHTML = `
          <iframe 
            src="${linkVideo}" 
            allow="autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;

        document.getElementById('movieTitle').textContent = peliculaEncontrada.titulo || 'Sin título';
        document.getElementById('movieCategory').textContent = categoriaDetectada.toUpperCase();
        document.getElementById('movieDescription').textContent = peliculaEncontrada.sinopsis || 'Sin descripción disponible.';
        
        if (peliculaEncontrada.portada) {
          document.getElementById('moviePoster').src = peliculaEncontrada.portada;
        } else {
          document.getElementById('moviePoster').style.display = 'none';
        }

        movieInfo.style.display = 'flex';

      } catch (error) {
        console.error(error);
        statusMsg.textContent = "❌ No se encontró la película. Revisa que el ID esté bien escrito en la URL.";
      }
    }

    cargarPelicula();
  </script>
</body>
</html>
