<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Series</title>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .serie-box {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .serie-img { width: 180px; border-radius: 6px; height: 260px; object-fit: cover; }
    .serie-content { flex: 1; min-width: 250px; }
    .ep-list {
      list-style: none;
      padding: 0;
      margin-top: 15px;
    }
    .ep-item {
      background: #2a2a2a;
      margin: 6px 0;
      padding: 10px 15px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ep-item a { color: #4da6ff; text-decoration: none; font-weight: bold; }
    .ep-item a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>📺 Catálogo de Series</h1>
  <div id="seriesContainer"></div>

  <script>
    // Apunta directamente al nuevo JSON de series
    const SERIES_URL = 'https://jeissonxp182.github.io/peliculas/series.json';

    fetch(SERIES_URL)
      .then(res => res.json())
      .then(series => {
        const container = document.getElementById('seriesContainer');
        
        series.forEach(s => {
          let tempHTML = '';
          
          s.temporadas.forEach(t => {
            let epHTML = '';
            t.episodios.forEach(e => {
              epHTML += `
                <li class="ep-item">
                  <span>Cap. ${e.numero}: ${e.titulo} (${e.duracion})</span>
                  <a href="${e.url}">▶ Ver Cap.</a>
                </li>
              `;
            });

            tempHTML += `
              <h4>Temporada ${t.numero}</h4>
              <ul class="ep-list">${epHTML}</ul>
            `;
          });

          container.innerHTML += `
            <div class="serie-box">
              <img class="serie-img" src="${s.portada}" alt="${s.titulo}">
              <div class="serie-content">
                <h2>${s.titulo}</h2>
                <p>${s.sinopsis}</p>
                ${tempHTML}
              </div>
            </div>
          `;
        });
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
