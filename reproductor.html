<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#140326">
<title>Reproductor JeissoNxP182</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

<style>
:root{
  --purple:#a855f7;
  --purple-dark:#3b0764;
  --bg:#10021f;
  --panel:#1b0633;
  --text:#fff;
  --muted:#aaa;
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

.header{
  height:58px;
  padding:8px 12px;
  background:#140326;
}

.brand{
  font-weight:bold;
  color:#e9d5ff;
}

.title{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player{
  position:relative;
  width:100%;
  height:48vh;
  min-height:210px;
  background:#000;
  overflow:hidden;
}

video,
iframe{
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

video{
  object-fit:contain;
}

iframe{display:none}

.plyr{
  --plyr-color-main:var(--purple);
}

.plyr__controls{
  background:linear-gradient(transparent,rgba(0,0,0,.9))!important;
}

/* TUERCA */

.settings-button{
  position:absolute;
  right:12px;
  top:12px;
  z-index:50;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
}

.settings-button:active{
  transform:scale(.94);
}

/* MENÚ */

.settings-menu{
  position:absolute;
  z-index:45;
  top:0;
  left:50%;
  right:0;
  bottom:0;
  background:rgba(12,1,24,.97);
  transform:translateX(100%);
  transition:transform .22s ease;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.settings-menu.open{
  transform:translateX(0);
}

.settings-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid rgba(255,255,255,.1);
  font-weight:bold;
}

.settings-back{
  border:0;
  background:none;
  color:white;
  font-size:24px;
  margin-right:12px;
  cursor:pointer;
}

.settings-content{
  overflow-y:auto;
  flex:1;
}

.setting-item{
  min-height:52px;
  width:100%;
  padding:0 15px;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:transparent;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  cursor:pointer;
  font-size:14px;
}

.setting-item:active{
  background:rgba(168,85,247,.18);
}

.setting-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.setting-icon{
  width:25px;
  text-align:center;
  font-size:18px;
}

.setting-value{
  color:#aaa;
  font-size:12px;
}

.submenu{
  display:none;
  flex-direction:column;
  height:100%;
}

.submenu.active{
  display:flex;
}

.option{
  width:100%;
  min-height:48px;
  border:0;
  border-bottom:1px solid rgba(255,255,255,.06);
  background:none;
  color:white;
  padding:0 18px;
  text-align:left;
  cursor:pointer;
}

.option.active{
  color:var(--purple);
  font-weight:bold;
}

.option:active{
  background:rgba(168,85,247,.15);
}

/* BLOQUEO */

.lock-screen{
  position:absolute;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
}

.lock-screen.active{
  display:flex;
}

.unlock-button{
  border:1px solid rgba(255,255,255,.4);
  background:rgba(20,3,38,.9);
  color:white;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
}

.lock-message{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.7);
  padding:7px 12px;
  border-radius:6px;
  font-size:12px;
}

/* PLAY */

.play-overlay{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
}

.play-overlay.hidden{
  display:none;
}

.play-button{
  width:70px;
  height:70px;
  border-radius:50%;
  border:2px solid white;
  background:linear-gradient(135deg,var(--purple),var(--purple-dark));
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* LOADING */

.loading{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  font-size:13px;
}

.loading.active{
  display:flex;
}

/* ERROR */

.error{
  position:absolute;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.9);
}

.error.active{
  display:flex;
}

.error-box{
  max-width:450px;
  padding:20px;
  border-radius:12px;
  background:#1b0633;
  text-align:center;
}

.error-box p{
  font-size:13px;
  color:#ccc;
  margin:10px 0;
}

.error-box button{
  padding:9px 18px;
  border:0;
  border-radius:7px;
  background:var(--purple);
  color:white;
}

/* URL */

.url-section{
  height:calc(52vh - 58px);
  padding:12px;
  background:#10021f;
}

.url-title{
  color:#999;
  font-size:11px;
  margin-bottom:7px;
}

.input-row{
  display:flex;
  gap:7px;
}

.url-input{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid rgba(168,85,247,.4);
  border-radius:7px;
  background:#ffffff08;
  color:white;
  padding:0 10px;
  outline:none;
}

.load-button{
  height:40px;
  padding:0 15px;
  border:0;
  border-radius:7px;
  background:var(--purple);
  color:white;
  font-weight:bold;
}

.history-title{
  margin-top:12px;
  margin-bottom:6px;
  color:#888;
  font-size:10px;
}

.history{
  max-height:calc(100% - 95px);
  overflow-y:auto;
}

.history-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px;
  margin-bottom:5px;
  background:#ffffff06;
  border:1px solid rgba(168,85,247,.1);
  border-radius:6px;
}

.history-name{
  flex:1;
  min-width:0;
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-play{
  border:0;
  background:var(--purple-dark);
  color:white;
  border-radius:5px;
  padding:5px 8px;
}

@media(max-width:600px){
  .player{height:45vh}
  .settings-menu{left:50%}
  .url-section{height:calc(55vh - 58px)}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">JeissoNxP182</div>
  <div class="title" id="title">Ningún vídeo cargado</div>
</header>

<main class="player" id="playerWrapper">

  <video id="video" playsinline webkit-playsinline preload="metadata"></video>

  <iframe
    id="iframe"
    allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
    allowfullscreen>
  </iframe>

  <button class="settings-button" id="settingsButton">⚙</button>

  <!-- MENÚ PRINCIPAL -->
  <div class="settings-menu" id="settingsMenu">

    <div class="settings-header">
      <button class="settings-back" id="menuBack">‹</button>
      <span id="menuTitle">Configuración</span>
    </div>

    <div class="settings-content">

      <div id="mainSettings">

        <button class="setting-item" data-menu="quality">
          <span class="setting-left">
            <span class="setting-icon">▣</span>
            <span>Calidad</span>
          </span>
          <span class="setting-value" id="qualityValue">Auto</span>
        </button>

        <button class="setting-item" data-menu="speed">
          <span class="setting-left">
            <span class="setting-icon">◷</span>
            <span>Velocidad</span>
          </span>
          <span class="setting-value" id="speedValue">Normal</span>
        </button>

        <button class="setting-item" data-menu="aspect">
          <span class="setting-left">
            <span class="setting-icon">▣</span>
            <span>Relación de aspecto</span>
          </span>
          <span class="setting-value" id="aspectValue">16:9</span>
        </button>

        <button class="setting-item" data-menu="sound">
          <span class="setting-left">
            <span class="setting-icon">🔊</span>
            <span>Sonido</span>
          </span>
          <span class="setting-value" id="soundValue">Normal</span>
        </button>

        <button class="setting-item" id="mirrorButton">
          <span class="setting-left">
            <span class="setting-icon">↔</span>
            <span>Modo espejo</span>
          </span>
          <span class="setting-value" id="mirrorValue">Desactivado</span>
        </button>

        <button class="setting-item" id="lockButton">
          <span class="setting-left">
            <span class="setting-icon">🔒</span>
            <span>Bloquear pantalla</span>
          </span>
        </button>

      </div>

      <!-- CALIDAD -->
      <div class="submenu" id="qualityMenu">
        <button class="option" data-quality="-1">Automática</button>
      </div>

      <!-- VELOCIDAD -->
      <div class="submenu" id="speedMenu">
        <button class="option" data-speed="0.5">0.5x — Lento</button>
        <button class="option" data-speed="0.75">0.75x</button>
        <button class="option active" data-speed="1">1x — Normal</button>
        <button class="option" data-speed="1.25">1.25x</button>
        <button class="option" data-speed="1.5">1.5x — Rápido</button>
        <button class="option" data-speed="1.75">1.75x</button>
        <button class="option" data-speed="2">2x — Muy rápido</button>
      </div>

      <!-- ASPECTO -->
      <div class="submenu" id="aspectMenu">
        <button class="option active" data-aspect="contain">16:9</button>
        <button class="option" data-aspect="43">4:3</button>
        <button class="option" data-aspect="cover">Expandir</button>
        <button class="option" data-aspect="fill">Estirar</button>
      </div>

      <!-- SONIDO -->
      <div class="submenu" id="soundMenu">
        <button class="option active" data-sound="normal">Normal</button>
        <button class="option" data-sound="bass">Aumento de bajos</button>
        <button class="option" data-sound="spatial">Sonido espacial</button>
        <button class="option" data-sound="surround">Sonido envolvente</button>
      </div>

    </div>
  </div>

  <!-- BLOQUEO -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-message">🔒 Pantalla bloqueada</div>
    <button class="unlock-button" id="unlockButton">
      Desbloquear
    </button>
  </div>

  <!-- PLAY -->
  <div class="play-overlay" id="playOverlay">
    <button class="play-button" id="playButton">▶</button>
  </div>

  <div class="loading" id="loading">
    Cargando...
  </div>

  <div class="error" id="error">
    <div class="error-box">
      <strong>No se pudo reproducir</strong>
      <p id="errorText"></p>
      <button id="errorClose">Cerrar</button>
    </div>
  </div>

</main>

<section class="url-section">

  <div class="url-title">
    FUENTE DE VÍDEO — MP4 / M3U8 / HLS / EMBED
  </div>

  <div class="input-row">
    <input
      class="url-input"
      id="urlInput"
      placeholder="Pega aquí la URL..."
      autocomplete="off"
      spellcheck="false">

    <button class="load-button" id="loadButton">
      Cargar
    </button>
  </div>

  <div class="history-title">
    ÚLTIMAS PELÍCULAS
  </div>

  <div class="history" id="history"></div>

</section>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded",()=>{

"use strict";

const $=id=>document.getElementById(id);

const video=$("video");
const iframe=$("iframe");
const wrapper=$("playerWrapper");
const title=$("title");
const input=$("urlInput");
const historyBox=$("history");
const loading=$("loading");
const error=$("error");
const errorText=$("errorText");
const playOverlay=$("playOverlay");

let hls=null;
let currentUrl="";
let currentType="";
let audioContext=null;
let sourceNode=null;
let filters=[];
let mirror=false;

const player=new Plyr(video,{
  controls:[
    "play-large",
    "play",
    "progress",
    "current-time",
    "duration",
    "mute",
    "volume",
    "fullscreen"
  ],
  clickToPlay:false,
  keyboard:{focused:true,global:true},
  fullscreen:{enabled:true,fallback:true,iosNative:true}
});

/* MENÚ */

const settingsMenu=$("settingsMenu");
const mainSettings=$("mainSettings");
const menuTitle=$("menuTitle");

$("settingsButton").onclick=()=>{
  settingsMenu.classList.toggle("open");
};

$("menuBack").onclick=()=>{
  showMainMenu();
};

function showMainMenu(){
  document.querySelectorAll(".submenu").forEach(x=>x.classList.remove("active"));
  mainSettings.style.display="block";
  menuTitle.textContent="Configuración";
}

document.querySelectorAll("[data-menu]").forEach(button=>{
  button.onclick=()=>{
    mainSettings.style.display="none";
    document.querySelectorAll(".submenu").forEach(x=>x.classList.remove("active"));

    const name=button.dataset.menu;
    $(name+"Menu").classList.add("active");
    menuTitle.textContent=button.querySelector("span span:last-child").textContent;
  };
});

/* CALIDAD HLS */

function setupQuality(){

  const menu=$("qualityMenu");
  menu.innerHTML='<button class="option active" data-quality="-1">Automática</button>';

  if(!hls || !hls.levels.length)return;

  const levels=hls.levels
    .map((level,index)=>({
      index,
      height:level.height||0
    }))
    .filter(x=>x.height)
    .sort((a,b)=>b.height-a.height);

  levels.forEach(level=>{
    const button=document.createElement("button");
    button.className="option";
    button.dataset.quality=level.index;
    button.textContent=level.height+"p";
    menu.appendChild(button);
  });

  menu.querySelectorAll("[data-quality]").forEach(button=>{
    button.onclick=()=>{
      const value=Number(button.dataset.quality);

      hls.currentLevel=value;

      menu.querySelectorAll(".option")
        .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      $("qualityValue").textContent=
        value===-1?"Auto":button.textContent;

      showMainMenu();
    };
  });
}

/* VELOCIDAD */

document.querySelectorAll("[data-speed]").forEach(button=>{
  button.onclick=()=>{
    const speed=Number(button.dataset.speed);

    player.speed=speed;

    document.querySelectorAll("#speedMenu .option")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    $("speedValue").textContent=button.textContent.split("—")[0].trim();

    showMainMenu();
  };
});

/* RELACIÓN */

document.querySelectorAll("[data-aspect]").forEach(button=>{
  button.onclick=()=>{
    const aspect=button.dataset.aspect;

    video.style.objectFit=aspect==="43"?"contain":aspect==="fill"?"fill":aspect==="cover"?"cover":"contain";

    if(aspect==="43"){
      video.style.aspectRatio="4/3";
    }else{
      video.style.aspectRatio="16/9";
    }

    document.querySelectorAll("#aspectMenu .option")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    $("aspectValue").textContent=button.textContent;

    showMainMenu();
  };
});

/* ESPEJO */

$("mirrorButton").onclick=()=>{
  mirror=!mirror;
  video.style.transform=mirror?"scaleX(-1)":"scaleX(1)";
  $("mirrorValue").textContent=mirror?"Activado":"Desactivado";
};

/* BLOQUEO */

$("lockButton").onclick=()=>{
  settingsMenu.classList.remove("open");
  document.querySelectorAll(".submenu").forEach(x=>x.classList.remove("active"));
  mainSettings.style.display="block";
  lockScreen();
};

const lockScreen=()=>{
  $("lockScreen").classList.add("active");

  /* Evita interacción con Plyr */
  player.elements.controls.style.pointerEvents="none";
};

$("unlockButton").onclick=()=>{
  $("lockScreen").classList.remove("active");

  player.elements.controls.style.pointerEvents="";
};

/* SONIDO */

function createAudio(){

  if(audioContext)return;

  try{

    audioContext=new AudioContext();
    sourceNode=audioContext.createMediaElementSource(video);

  }catch(e){
    console.warn("Web Audio no disponible",e);
  }
}

function clearAudio(){

  filters.forEach(filter=>{
    try{filter.disconnect()}catch(e){}
  });

  filters=[];

  if(sourceNode){
    try{sourceNode.disconnect()}catch(e){}
  }

  if(audioContext){

    const gain=audioContext.createGain();

    sourceNode.connect(gain);
    gain.connect(audioContext.destination);

  }
}

function applySound(type){

  createAudio();

  if(!audioContext || !sourceNode)return;

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  clearAudio();

  const gain=audioContext.createGain();

  if(type==="normal"){

    sourceNode.connect(gain);
    gain.connect(audioContext.destination);

  }

  if(type==="bass"){

    const bass=audioContext.createBiquadFilter();

    bass.type="lowshelf";
    bass.frequency.value=180;
    bass.gain.value=8;

    sourceNode.connect(bass);
    bass.connect(gain);
    gain.connect(audioContext.destination);

    filters.push(bass);

  }

  if(type==="spatial"){

    const panner=audioContext.createStereoPanner();

    panner.pan.value=0;

    sourceNode.connect(panner);
    panner.connect(gain);
    gain.connect(audioContext.destination);

    filters.push(panner);

  }

  if(type==="surround"){

    const splitter=audioContext.createChannelSplitter(2);
    const merger=audioContext.createChannelMerger(2);

    const left=audioContext.createGain();
    const right=audioContext.createGain();

    left.gain.value=1.15;
    right.gain.value=1.15;

    sourceNode.connect(splitter);

    splitter.connect(left,0);
    splitter.connect(right,1);

    left.connect(merger,0,0);
    right.connect(merger,0,1);

    merger.connect(gain);
    gain.connect(audioContext.destination);

    filters.push(splitter,merger,left,right);

  }
}

document.querySelectorAll("[data-sound]").forEach(button=>{
  button.onclick=()=>{
    const sound=button.dataset.sound;

    /* IMPORTANTE:
       Nunca hacemos video.muted=true.
    */

    video.muted=false;
    player.muted=false;

    applySound(sound);

    document.querySelectorAll("#soundMenu .option")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    $("soundValue").textContent=button.textContent;

    showMainMenu();
  };
});

/* CARGA */

function detect(url){

  const clean=url.toLowerCase().split("?")[0];

  if(clean.includes(".m3u8"))return"hls";

  if(/\.(mp4|webm|ogg|ogv|mov)$/i.test(clean))return"video";

  if(/youtube\.com|youtu\.be/i.test(url))return"youtube";

  if(/\/embed\//i.test(url))return"iframe";

  return"video";
}

function name(url){

  try{

    const u=new URL(url);
    let n=u.pathname.split("/").filter(Boolean).pop();

    if(!n)return u.hostname;

    return decodeURIComponent(n)
      .replace(/\.(mp4|m3u8|webm|ogg|ogv|mov)$/i,"")
      .replace(/[_-]+/g," ");

  }catch{

    return url;

  }
}

function showLoading(value=true){
  loading.classList.toggle("active",value);
}

function showError(message){
  showLoading(false);
  errorText.textContent=message;
  error.classList.add("active");
}

$("errorClose").onclick=()=>{
  error.classList.remove("active");
};

function destroy(){

  if(hls){

    try{hls.destroy()}catch(e){}

    hls=null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  iframe.src="about:blank";
  iframe.style.display="none";
  video.style.display="block";
}

function youtube(url){

  try{

    const u=new URL(url);
    let id=u.searchParams.get("v");

    if(u.hostname.includes("youtu.be")){
      id=u.pathname.slice(1).split("/")[0];
    }

    if(u.pathname.includes("/embed/")){
      id=u.pathname.split("/embed/")[1].split("/")[0];
    }

    return id
      ?"https://www.youtube.com/embed/"+encodeURIComponent(id)+"?rel=0"
      :null;

  }catch{

    return null;

  }
}

function load(url){

  url=url.trim();

  if(!url){
    showError("Introduce una URL.");
    return;
  }

  error.classList.remove("active");
  destroy();

  currentUrl=url;
  currentType=detect(url);
  title.textContent=name(url);

  saveHistory(url);

  playOverlay.classList.remove("hidden");

  if(currentType==="youtube"){

    const yt=youtube(url);

    if(!yt){
      showError("No se pudo identificar el vídeo.");
      return;
    }

    video.style.display="none";
    iframe.style.display="block";
    iframe.src=yt;
    playOverlay.classList.add("hidden");
    return;
  }

  if(currentType==="iframe"){

    video.style.display="none";
    iframe.style.display="block";
    iframe.src=url;
    playOverlay.classList.add("hidden");
    return;
  }

  video.style.display="block";
  iframe.style.display="none";

  showLoading();

  if(currentType==="hls"){

    if(video.canPlayType("application/vnd.apple.mpegurl")){

      video.src=url;
      video.load();

    }else if(window.Hls && Hls.isSupported()){

      hls=new Hls({
        enableWorker:true,
        lowLatencyMode:false,
        backBufferLength:60,
        maxBufferLength:30
      });

      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED,()=>{
        showLoading(false);
        setupQuality();
      });

      hls.on(Hls.Events.ERROR,(event,data)=>{

        if(data.fatal){

          showError(
            "No se pudo reproducir la transmisión HLS. "+
            "Comprueba la URL y que el servidor permita reproducción desde el navegador."
          );

        }

      });

    }else{

      showError("Este navegador no soporta HLS.");

    }

  }else{

    video.src=url;
    video.load();

  }
}

/* PLAY */

$("playButton").onclick=async()=>{

  if(!currentUrl){
    showError("Primero carga una URL.");
    return;
  }

  try{

    await player.play();

    playOverlay.classList.add("hidden");

    createAudio();

  }catch(e){

    showError(
      "El navegador no pudo iniciar la reproducción."
    );

  }
};

video.addEventListener("loadedmetadata",()=>{
  showLoading(false);
});

video.addEventListener("canplay",()=>{
  showLoading(false);
});

video.addEventListener("playing",()=>{
  showLoading(false);
  playOverlay.classList.add("hidden");
});

video.addEventListener("waiting",()=>{
  if(currentUrl)showLoading(true);
});

video.addEventListener("error",()=>{

  if(!currentUrl)return;

  showLoading(false);

  if(currentType!=="hls"){

    showError(
      "El vídeo no pudo reproducirse. "+
      "Comprueba que la URL sea válida y que el formato sea compatible."
    );

  }

});

/* HISTORIAL */

function getHistory(){

  try{
    return JSON.parse(localStorage.getItem("jeissonHistory")||"[]");
  }catch{
    return[];
  }
}

function saveHistory(url){

  let data=getHistory();

  data=data.filter(x=>x.url!==url);

  data.unshift({
    url,
    name:name(url)
  });

  data=data.slice(0,10);

  localStorage.setItem(
    "jeissonHistory",
    JSON.stringify(data)
  );

  renderHistory();
}

function renderHistory(){

  historyBox.innerHTML="";

  const data=getHistory();

  if(!data.length){

    historyBox.innerHTML=
      '<div style="font-size:11px;color:#666">Todavía no hay películas.</div>';

    return;
  }

  data.forEach(item=>{

    const row=document.createElement("div");
    row.className="history-item";

    const text=document.createElement("span");
    text.className="history-name";
    text.textContent=item.name;

    const button=document.createElement("button");
    button.className="history-play";
    button.textContent="▶";

    button.onclick=()=>load(item.url);

    row.append(text,button);
    historyBox.appendChild(row);

  });
}

$("loadButton").onclick=()=>{
  load(input.value);
};

input.addEventListener("keydown",e=>{
  if(e.key==="Enter")load(input.value);
});

renderHistory();

});
</script>
