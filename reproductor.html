<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#140326">

<title>Reproductor JeissoNxP182</title>

<!-- =========================================================
     PLYR
========================================================= -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">

<!-- =========================================================
     HLS.JS
========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

<style>

:root{
    --primary:#a855f7;
    --primary-dark:#3b0764;
    --primary-soft:#c084fc;
    --background:#140326;
    --background-2:#0c0118;
    --panel:#1b0633;
    --text:#f8fafc;
    --muted:#94a3b8;
    --danger:#ef4444;
    --success:#22c55e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:
        radial-gradient(
            circle at top,
            #260743 0%,
            var(--background) 45%,
            #08010e 100%
        );
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* =========================================================
   HEADER
========================================================= */

.video-header{
    height:64px;
    padding:10px 15px;
    background:rgba(20,3,38,.96);
    border-bottom:1px solid rgba(168,85,247,.15);
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.brand-watermark{
    font-size:17px;
    font-weight:800;
    letter-spacing:1px;
    color:#e9d5ff;
}

.video-title-display{
    margin-top:3px;
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   PLAYER
========================================================= */

.player-wrapper{
    position:relative;
    width:100%;
    height:55vh;
    max-height:68vh;
    min-height:220px;
    background:#000;
    overflow:hidden;
    box-shadow:
        0 5px 30px rgba(0,0,0,.7),
        inset 0 0 30px rgba(0,0,0,.4);
}

/*
   Importante:
   Plyr necesita que el video tenga dimensiones reales.
*/

.player-wrapper .plyr{
    width:100%;
    height:100%;
}

.player-wrapper .plyr__video-wrapper{
    width:100%;
    height:100%;
    background:#000;
}

.player-wrapper video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* =========================================================
   PLYR PERSONALIZACIÓN
========================================================= */

.plyr{
    --plyr-color-main:var(--primary);
    --plyr-video-control-color:#fff;
    --plyr-video-control-color-hover:#fff;
    --plyr-video-control-background-hover:rgba(168,85,247,.25);
    --plyr-menu-background:#1b0633;
    --plyr-menu-color:#fff;
    --plyr-tooltip-background:#1b0633;
    --plyr-tooltip-color:#fff;
    --plyr-control-icon-size:18px;
}

.plyr--video{
    background:#000;
}

.plyr__controls{
    background:
        linear-gradient(
            transparent,
            rgba(5,0,10,.92)
        ) !important;
}

.plyr__control:hover{
    background:rgba(168,85,247,.25) !important;
}

.plyr__progress input[type=range]{
    color:var(--primary);
}

.plyr__volume input[type=range]{
    color:var(--primary);
}

/* =========================================================
   PLAY OVERLAY
========================================================= */

.initial-play-overlay{
    position:absolute;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(20,3,38,.18),
            rgba(5,0,10,.72)
        );

    transition:
        opacity .25s ease,
        visibility .25s ease;
}

.initial-play-overlay.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.btn-initial-play{
    width:82px;
    height:82px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.8);

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 0 25px rgba(168,85,247,.55);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.btn-initial-play:hover{
    transform:scale(1.08);

    box-shadow:
        0 0 35px rgba(168,85,247,.8);
}

.btn-initial-play:active{
    transform:scale(.94);
}

.btn-initial-play svg{
    width:42px;
    height:42px;
    fill:white;
    margin-left:4px;
}

/* =========================================================
   LOADING
========================================================= */

.loading-overlay{
    position:absolute;
    inset:0;

    z-index:18;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:14px;

    background:rgba(5,0,10,.72);
}

.loading-overlay.active{
    display:flex;
}

.spinner{
    width:42px;
    height:42px;

    border-radius:50%;

    border:
        4px solid rgba(255,255,255,.15);

    border-top-color:var(--primary);

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    font-size:13px;
    color:#e9d5ff;
}

/* =========================================================
   ERROR
========================================================= */

.error-overlay{
    position:absolute;
    inset:0;

    z-index:25;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(5,0,10,.9);
}

.error-overlay.active{
    display:flex;
}

.error-box{
    width:min(500px,90%);
    padding:22px;

    background:
        linear-gradient(
            145deg,
            #24063f,
            #10011d
        );

    border:
        1px solid rgba(239,68,68,.5);

    border-radius:14px;

    text-align:center;

    box-shadow:
        0 15px 50px rgba(0,0,0,.6);
}

.error-icon{
    font-size:35px;
    margin-bottom:10px;
}

.error-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:8px;
}

.error-message{
    font-size:12px;
    color:#cbd5e1;
    line-height:1.5;
    word-break:break-word;
}

.error-close{
    margin-top:15px;

    padding:9px 17px;

    border:1px solid var(--primary);

    border-radius:7px;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    cursor:pointer;
}

/* =========================================================
   IFRAME
========================================================= */

#mainIframe{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    border:0;

    display:none;

    background:#000;
}

/* =========================================================
   URL SECTION
========================================================= */

.url-section{
    height:calc(45vh - 64px);

    min-height:150px;

    padding:14px;

    display:flex;
    flex-direction:column;

    gap:8px;

    background:
        linear-gradient(
            180deg,
            rgba(20,3,38,.96),
            rgba(10,1,18,.98)
        );
}

.url-title{
    font-size:11px;
    color:var(--muted);

    text-transform:uppercase;

    letter-spacing:.5px;
}

.input-wrapper{
    display:flex;
    gap:8px;
}

.url-input{
    height:42px;

    flex:1;

    min-width:0;

    background:#ffffff08;

    border:
        1px solid rgba(168,85,247,.4);

    border-radius:8px;

    padding:
        0 12px;

    color:white;

    font-size:13px;

    outline:none;

    user-select:text;
}

.url-input:focus{
    border-color:var(--primary);

    box-shadow:
        0 0 0 2px rgba(168,85,247,.12);
}

.url-input::placeholder{
    color:#64748b;
}

.btn-load{
    height:42px;

    padding:
        0 18px;

    border:
        1px solid rgba(255,255,255,.4);

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-dark)
        );

    color:white;

    font-weight:bold;

    cursor:pointer;

    white-space:nowrap;
}

.btn-load:active{
    transform:scale(.97);
}

/* =========================================================
   HISTORY
========================================================= */

.history-title{
    margin-top:3px;

    font-size:10px;

    color:var(--muted);

    text-transform:uppercase;
}

.history-list{
    display:flex;
    flex-direction:column;

    gap:5px;

    overflow-y:auto;

    padding-bottom:10px;
}

.history-list::-webkit-scrollbar{
    width:4px;
}

.history-list::-webkit-scrollbar-thumb{
    background:var(--primary-dark);
    border-radius:5px;
}

.history-item{
    min-height:34px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:8px;

    padding:
        6px 8px;

    border-radius:7px;

    border:
        1px solid rgba(168,85,247,.13);

    background:#ffffff06;
}

.history-name{
    flex:1;

    min-width:0;

    font-size:11px;

    color:#dbeafe;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.history-play{
    border:
        1px solid var(--primary);

    border-radius:5px;

    padding:
        4px 8px;

    color:white;

    background:var(--primary-dark);

    cursor:pointer;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:absolute;

    top:10px;
    left:10px;

    z-index:15;

    padding:
        5px 8px;

    border-radius:5px;

    background:
        rgba(0,0,0,.6);

    color:#cbd5e1;

    font-size:10px;

    pointer-events:none;

    opacity:0;

    transition:opacity .2s;
}

.status.show{
    opacity:1;
}

/* =========================================================
   ASPECT RATIO
========================================================= */

.aspect-43 video{
    object-fit:contain !important;
    aspect-ratio:4/3;
}

.aspect-169 video{
    object-fit:contain !important;
    aspect-ratio:16/9;
}

.aspect-fill video{
    object-fit:cover !important;
}

.aspect-stretch video{
    object-fit:fill !important;
}

.mirrored video{
    transform:scaleX(-1);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    .video-header{
        height:58px;
        padding:8px 12px;
    }

    .brand-watermark{
        font-size:15px;
    }

    .video-title-display{
        font-size:11px;
    }

    .player-wrapper{
        height:42vh;
        min-height:210px;
    }

    .url-section{
        height:calc(58vh - 58px);
    }

    .btn-initial-play{
        width:70px;
        height:70px;
    }

    .btn-initial-play svg{
        width:35px;
        height:35px;
    }

    .input-wrapper{
        gap:6px;
    }

    .btn-load{
        padding:0 13px;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header class="video-header">

    <div class="brand-watermark">
        JeissoNxP182
    </div>

    <div
        class="video-title-display"
        id="videoTitleDisplay">
        Ningún vídeo cargado
    </div>

</header>


<!-- =========================================================
     PLAYER
========================================================= -->

<main
    class="player-wrapper"
    id="playerWrapper"
>

    <!-- VIDEO NATIVO -->
    <video
        id="mainVideo"
        playsinline
        webkit-playsinline
        preload="metadata"
        crossorigin="anonymous"
    ></video>


    <!-- IFRAME PARA EMBEDS -->
    <iframe
        id="mainIframe"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
    ></iframe>


    <!-- PLAY INICIAL -->
    <div
        class="initial-play-overlay"
        id="initialPlayOverlay"
    >

        <button
            class="btn-initial-play"
            id="btnInitialPlay"
            aria-label="Reproducir"
        >

            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>

        </button>

    </div>


    <!-- LOADING -->
    <div
        class="loading-overlay"
        id="loadingOverlay"
    >

        <div class="spinner"></div>

        <div
            class="loading-text"
            id="loadingText"

            Cargando vídeo...
        </div>

    </div>


    <!-- ERROR -->
    <div
        class="error-overlay"
        id="errorOverlay"
    >

        <div class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <div class="error-title">
                No se pudo reproducir el vídeo
            </div>

            <div
                class="error-message"
                id="errorMessage"
            >
                La fuente no pudo ser reproducida.
            </div>

            <button
                class="error-close"
                id="errorClose"
            >
                Cerrar
            </button>

        </div>

    </div>


    <!-- STATUS -->
    <div
        class="status"
        id="status"
    >
        Preparado
    </div>

</main>


<!-- =========================================================
     URL / HISTORY
========================================================= -->

<section class="url-section">

    <div class="url-title">
        Fuente de vídeo
        (.mp4 / .m3u8 / embed)
    </div>


    <div class="input-wrapper">

        <input
            id="urlInput"
            class="url-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Pega aquí la URL del vídeo..."
        >

        <button
            id="btnLoad"
            class="btn-load"
        >
            Cargar
        </button>

    </div>


    <div class="history-title">
        Últimas 10 películas
    </div>


    <div
        class="history-list"
        id="historyList"
    ></div>

</section>


<!-- =========================================================
     PLYR
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded",function(){

"use strict";


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   ELEMENTOS
========================================================= */

const video = $("mainVideo");

const iframe = $("mainIframe");

const wrapper = $("playerWrapper");

const initialOverlay = $("initialPlayOverlay");

const initialPlay = $("btnInitialPlay");

const loadingOverlay = $("loadingOverlay");

const loadingText = $("loadingText");

const errorOverlay = $("errorOverlay");

const errorMessage = $("errorMessage");

const errorClose = $("errorClose");

const urlInput = $("urlInput");

const btnLoad = $("btnLoad");

const historyList = $("historyList");

const titleDisplay = $("videoTitleDisplay");

const status = $("status");


/* =========================================================
   VARIABLES
========================================================= */

let hls = null;

let currentUrl = "";

let currentType = "";

let currentPoster = "";

let destroyTimer = null;

let lastTap = 0;

let tapTimer = null;

let isLoading = false;


/* =========================================================
   PLYR
========================================================= */

const player = new Plyr(video,{

    autoplay:false,

    controls:[
        "play-large",
        "play",
        "progress",
        "current-time",
        "duration",
        "mute",
        "volume",
        "settings",
        "fullscreen"
    ],

    settings:[
        "quality",
        "speed"
    ],

    seekTime:10,

    keyboard:{
        focused:true,
        global:true
    },

    tooltips:{
        controls:true,
        seek:true
    },

    clickToPlay:false,

    disableContextMenu:true,

    fullscreen:{
        enabled:true,
        fallback:true,
        iosNative:true
    }

});


/* =========================================================
   FORMATO DE TIEMPO
========================================================= */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds) ||
        seconds < 0
    ){
        return "0:00";
    }

    const h = Math.floor(seconds / 3600);

    const m = Math.floor(
        (seconds % 3600) / 60
    );

    const s = Math.floor(
        seconds % 60
    );

    if(h > 0){

        return (
            h +
            ":" +
            String(m).padStart(2,"0") +
            ":" +
            String(s).padStart(2,"0")
        );

    }

    return (
        m +
        ":" +
        String(s).padStart(2,"0")
    );
}


/* =========================================================
   NOMBRE DEL VÍDEO
========================================================= */

function getVideoName(url){

    try{

        const u = new URL(url);

        let path =
            u.pathname
            .split("/")
            .filter(Boolean)
            .pop();

        if(!path){
            return u.hostname;
        }

        path = decodeURIComponent(path);

        path = path.replace(
            /\.(mp4|m3u8|webm|mov|mkv|avi)$/i,
            ""
        );

        path = path
            .replace(/[_-]+/g," ")
            .trim();

        return path || u.hostname;

    }catch{

        return url;

    }

}


/* =========================================================
   TIPO DE FUENTE
========================================================= */

function detectSource(url){

    const lower =
        url
        .split("?")[0]
        .toLowerCase();


    if(
        lower.endsWith(".m3u8")
    ){
        return "hls";
    }


    if(
        lower.endsWith(".mp4") ||
        lower.endsWith(".webm") ||
        lower.endsWith(".ogg") ||
        lower.endsWith(".ogv") ||
        lower.endsWith(".mov")
    ){
        return "video";
    }


    if(
        url.includes("youtube.com") ||
        url.includes("youtu.be")
    ){
        return "youtube";
    }


    if(
        url.includes("player.") ||
        url.includes("/embed/")
    ){
        return "iframe";
    }


    /*
       IMPORTANTE:

       Si no tiene extensión conocida,
       NO lo mandamos automáticamente
       a iframe.

       Muchos servidores entregan MP4
       sin terminar en .mp4.
    */

    return "video";

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text){

    loadingText.textContent =
        text || "Cargando vídeo...";

    loadingOverlay.classList.add("active");

    isLoading = true;

}


function hideLoading(){

    loadingOverlay.classList.remove("active");

    isLoading = false;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(text){

    status.textContent = text;

    status.classList.add("show");

    clearTimeout(destroyTimer);

    destroyTimer =
        setTimeout(
            ()=>{
                status.classList.remove("show");
            },
            2000
        );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    hideLoading();

    errorMessage.textContent =
        message ||
        "La fuente no pudo reproducirse.";

    errorOverlay.classList.add("active");

}


function hideError(){

    errorOverlay.classList.remove("active");

}


errorClose.onclick = function(){

    hideError();

};


/* =========================================================
   DESTRUIR FUENTE ANTERIOR
========================================================= */

function destroyCurrentSource(){

    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;

    }


    try{
        player.stop();
    }catch(e){}


    video.pause();

    video.removeAttribute("src");

    video.removeAttribute("poster");

    video.load();


    iframe.src = "about:blank";

    iframe.style.display = "none";


    video.style.display = "block";


    initialOverlay.classList.remove("hidden");

    hideLoading();

}


/* =========================================================
   POSTER
========================================================= */

function setPoster(poster){

    currentPoster = poster || "";

    if(currentPoster){

        video.setAttribute(
            "poster",
            currentPoster
        );

        try{
            player.poster =
                currentPoster;
        }catch(e){}

    }else{

        video.removeAttribute("poster");

    }

}


/* =========================================================
   CONFIGURAR PLYR PARA HLS
========================================================= */

function setupHlsQuality(){

    if(
        !hls ||
        !hls.levels ||
        !hls.levels.length
    ){
        return;
    }


    const levels = hls.levels;


    const qualities =
        levels
        .map(level => level.height)
        .filter(Boolean);


    const unique =
        [...new Set(qualities)]
        .sort((a,b)=>b-a);


    if(!unique.length){
        return;
    }


    /*
       Plyr mostrará automáticamente
       el menú de calidad.
    */

    player.config.quality = {

        default:-1,

        options:[
            -1,
            ...unique
        ],

        forced:true,

        onChange:function(newQuality){

            if(!hls){
                return;
            }


            if(newQuality === -1){

                hls.currentLevel = -1;

                return;

            }


            const index =
                levels.findIndex(
                    level =>
                    level.height === newQuality
                );

            if(index >= 0){

                hls.currentLevel =
                    index;

            }

        }

    };

}


/* =========================================================
   CARGAR HLS
========================================================= */

function loadHLS(url){

    showLoading(
        "Preparando transmisión HLS..."
    );


    /*
       Safari / iOS puede reproducir HLS
       directamente.
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = url;

        video.load();

        hideLoading();

        showStatus(
            "HLS preparado"
        );

        return;

    }


    /*
       Chrome / Android / Firefox
       utilizan Hls.js.
    */

    if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hls = new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:30,

            maxBufferLength:30,

            maxMaxBufferLength:60,

            startLevel:-1

        });


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            function(){

                hls.loadSource(url);

            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                hideLoading();

                setupHlsQuality();

                showStatus(
                    "HLS listo para reproducir"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                console.warn(
                    "HLS:",
                    data
                );


                if(!data.fatal){
                    return;
                }


                if(
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ){

                    showStatus(
                        "Reintentando conexión..."
                    );

                    try{
                        hls.startLoad();
                    }catch(e){}

                    return;

                }


                if(
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ){

                    try{
                        hls.recoverMediaError();
                    }catch(e){}

                    return;

                }


                showError(
                    "El servidor HLS rechazó la reproducción. " +
                    "Comprueba que el enlace .m3u8 siga activo."
                );

            }
        );


        return;

    }


    showError(
        "Este navegador no es compatible con reproducción HLS."
    );

}


/* =========================================================
   CARGAR VÍDEO DIRECTO
========================================================= */

function loadDirectVideo(url){

    showLoading(
        "Preparando vídeo..."
    );


    video.src = url;

    video.load();


    /*
       NO llamamos a play() aquí.

       El usuario debe pulsar
       el botón de reproducción.
    */

}


/* =========================================================
   YOUTUBE
========================================================= */

function convertYoutube(url){

    try{

        const u = new URL(url);

        let id = "";


        if(
            u.hostname.includes("youtu.be")
        ){

            id =
                u.pathname
                .replace("/","")
                .split("/")[0];

        }


        if(
            u.hostname.includes("youtube.com")
        ){

            id =
                u.searchParams.get("v") || "";

        }


        if(
            u.pathname.includes("/embed/")
        ){

            id =
                u.pathname
                .split("/embed/")[1]
                .split("/")[0];

        }


        if(!id){
            return null;
        }


        return (
            "https://www.youtube.com/embed/" +
            encodeURIComponent(id) +
            "?rel=0&modestbranding=1"
        );

    }catch{

        return null;

    }

}


/* =========================================================
   CARGAR URL
========================================================= */

function loadVideo(rawUrl,poster){

    const url =
        String(rawUrl || "").trim();


    if(!url){

        showError(
            "Pega una URL de vídeo antes de pulsar Cargar."
        );

        return;

    }


    hideError();

    destroyCurrentSource();


    currentUrl = url;

    currentType =
        detectSource(url);


    titleDisplay.textContent =
        getVideoName(url);


    saveHistory(url);


    setPoster(poster || "");


    console.log(
        "URL:",
        url
    );

    console.log(
        "Tipo:",
        currentType
    );


    /*
       YOUTUBE
    */

    if(currentType === "youtube"){

        const yt =
            convertYoutube(url);


        if(!yt){

            showError(
                "No se pudo identificar el vídeo de YouTube."
            );

            return;

        }


        video.style.display = "none";

        iframe.style.display = "block";

        initialOverlay.classList.add("hidden");

        iframe.src = yt;

        showStatus(
            "Vídeo externo cargado"
        );

        return;

    }


    /*
       IFRAME
    */

    if(currentType === "iframe"){

        video.style.display = "none";

        iframe.style.display = "block";

        initialOverlay.classList.add("hidden");

        iframe.src = url;

        showStatus(
            "Reproductor externo cargado"
        );

        return;

    }


    /*
       VÍDEO
    */

    video.style.display = "block";

    iframe.style.display = "none";

    initialOverlay.classList.remove("hidden");


    if(currentType === "hls"){

        loadHLS(url);

    }else{

        loadDirectVideo(url);

    }

}


/* =========================================================
   PLAY MANUAL
========================================================= */

async function playVideo(){

    if(!currentUrl){

        showError(
            "Primero debes cargar una película."
        );

        return;

    }


    if(
        currentType === "youtube" ||
        currentType === "iframe"
    ){

        showStatus(
            "La reproducción se controla desde el reproductor externo."
        );

        return;

    }


    hideError();


    try{

        await player.play();

        initialOverlay.classList.add(
            "hidden"
        );

    }catch(error){

        console.error(
            "Error de reproducción:",
            error
        );


        showError(
            "El navegador no pudo reproducir esta fuente. " +
            "Si es un MP4 externo, comprueba que el servidor " +
            "permita CORS y solicitudes de vídeo."
        );

    }

}


/* =========================================================

initialPlay.onclick =

/* =========================================================
   DOBLE TAP / DOBLE CLICK
========================================================= */

wrapper.addEventListener(
    "click",
    function(event){

        /*
           Ignorar controles de Plyr.
        */

        if(
            event.target.closest(
                ".plyr__controls"
            )
        ){

            return;

        }


        if(
            event.target.closest(
                "button"
            )
        ){

            return;

        }


        /*
           Los iframe externos no deben
           recibir nuestra lógica.
        */

        if(
            currentType === "youtube" ||
            currentType === "iframe"
        ){

            return;

        }


        const now =
            Date.now();


        const rect =
            wrapper.getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        /*
           DOBLE CLICK
        */

        if(
            now - lastTap < 320
        ){

            clearTimeout(tapTimer);


            const middle =
                rect.width / 2;


            if(x < middle){

                player.currentTime =
                    Math.max(
                        0,
                        player.currentTime - 10
                    );

                showStatus(
                    "−10 segundos"
                );

            }else{

                player.currentTime =
                    Math.min(
                        player.duration || Infinity,
                        player.currentTime + 10
                    );

                showStatus(
                    "+10 segundos"
                );

            }


            lastTap = 0;

            return;

        }


        lastTap = now;


        /*
           Un solo click no hace nada
           para no interferir con Plyr.
        */

        tapTimer =
            setTimeout(
                function(){

                    lastTap = 0;

                },
                340
            );

    }
);


/* =========================================================
   HISTORIAL
========================================================= */

function getHistory(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "jeissonHistory"
            ) || "[]"
        );

    }catch{

        return [];

    }

}


function saveHistory(url){

    let history =
        getHistory();


    history =
        history.filter(
            item =>
            item.url !== url
        );


    history.unshift({

        url:url,

        name:getVideoName(url),

        date:Date.now()

    });


    history =
        history.slice(0,10);


    try{

        localStorage.setItem(
            "jeissonHistory",
            JSON.stringify(history)
        );

    }catch(e){}


    renderHistory();

}


function renderHistory(){

    const history =
        getHistory();


    historyList.innerHTML = "";


    if(!history.length){

        const empty =
            document.createElement(
                "div"
            );

        empty.style.color =
            "#64748b";

        empty.style.fontSize =
            "11px";

        empty.textContent =
            "Todavía no hay películas.";

        historyList.appendChild(
            empty
        );

        return;

    }


    history.forEach(
        function(item){

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "history-item";


            const name =
                document.createElement(
                    "span"
                );

            name.className =
                "history-name";

            name.textContent =
                item.name;


            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "history-play";

            button.textContent =
                "▶";


            button.onclick =
                function(){

                    loadVideo(
                        item.url
                    );

                };


            row.appendChild(name);

            row.appendChild(button);

            historyList.appendChild(row);

        }
    );

}

   CARGAR BOTÓN

function(){

    if(!url){

/* =========================================================
   ENTER
========================================================= */

urlInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            btnLoad.click();

        }

    }
);


/* =========================================================
   TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /*
           No interferir con el campo URL.
        */

        if(
            document.activeElement ===
            urlInput
        ){

            return;

        }


        if(
            currentType === "youtube" ||
            currentType === "iframe"
        ){

            return;

        }


        const key =
            event.key.toLowerCase();


        /*
           ESPACIO / K
        */

        if(
            key === " " ||
            key === "k"
        ){

            event.preventDefault();

            if(player.paused){

                player.play();

            }else{

                player.pause();

            }

        }


        /*
           J / ←
        */

        else if(
            key === "j" ||
            key === "arrowleft"
        ){

            event.preventDefault();

            player.currentTime =
                Math.max(
                    0,
                    player.currentTime - 10
                );

        }


        /*
           L / →
        */

        else if(
            key === "l" ||
            key === "arrowright"
        ){

            event.preventDefault();

            player.currentTime =
                Math.min(
                    player.duration || Infinity,
                    player.currentTime + 10
                );

        }


        /*
           ↑
        */

        else if(
            key === "arrowup"
        ){

            event.preventDefault();

            player.volume =
                Math.min(
                    1,
                    player.volume + .05
                );

        }


        /*
           ↓
        */

        else if(
            key === "arrowdown"
        ){

            event.preventDefault();

            player.volume =
                Math.max(
                    0,
                    player.volume - .05
                );

        }


        /*
           M
        */

        else if(
            key === "m"
        ){

            player.muted =
                !player.muted;

        }


        /*
           F
        */

        else if(
            key === "f"
        ){

            event.preventDefault();

            player.fullscreen.toggle();

        }

    }
);


/* =========================================================
   PARÁMETROS DE URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/*
   Vídeo:
   ?v=
   ?url=
*/

const videoParam =
    params.get("v") ||
    params.get("url");


/*
   Poster:
   ?p=
   ?poster=
*/

const posterParam =
    params.get("p") ||
    params.get("poster");


/* =========================================================
   INICIO
========================================================= */

renderHistory();


/*
   Si hay vídeo en la URL,
   lo carga pero NO lo reproduce.
*/

if(videoParam){

    try{

        loadVideo(
            decodeURIComponent(
                videoParam
            ),
            posterParam
                ? decodeURIComponent(
                    posterParam
                )
                : ""
        );

    }catch{

        loadVideo(
            videoParam,
            posterParam
        );

    }

}

});
