<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Reproductor</title>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #140326;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* ==============================
       CONTENEDOR
    ============================== */

    .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        padding: 15px;
    }

    /* ==============================
       REPRODUCTOR
    ============================== */

    .player {
        width: 100%;
        background: #000000;
        border: 1px solid #6b21a8;
    }

    video {
        display: block;
        width: 100%;
        height: auto;
        min-height: 220px;
        background: #000000;
    }

    /* ==============================
       CAJA URL
    ============================== */

    .url-box {
        margin-top: 15px;
        padding: 12px;
        background: #1b0633;
        border: 1px solid #6b21a8;
    }

    .url-input {
        width: 100%;
        height: 42px;
        padding: 0 10px;

        background: #0c0118;
        color: #ffffff;

        border: 1px solid #7e22ce;
        outline: none;

        font-size: 14px;
    }

    .url-input:focus {
        border-color: #a855f7;
    }

    .url-input::placeholder {
        color: #8b7a99;
    }

    /* ==============================
       BOTÓN
    ============================== */

    .load-button {
        width: 100%;
        height: 42px;

        margin-top: 8px;

        background: #7e22ce;
        color: #ffffff;

        border: 1px solid #a855f7;

        cursor: pointer;

        font-size: 14px;
        font-weight: bold;
    }

    .load-button:active {
        background: #6b21a8;
    }

    /* ==============================
       ESTADO
    ============================== */

    .status {
        margin-top: 8px;

        font-size: 12px;
        color: #c084fc;

        min-height: 18px;
    }

    /* ==============================
       ERROR
    ============================== */

    .error {
        margin-top: 8px;

        font-size: 12px;
        color: #f87171;

        display: none;
    }

    .error.show {
        display: block;
    }

</style>
</head>

<body>

<div class="container">

    <!-- ==========================
         REPRODUCTOR
    =========================== -->

    <div class="player">

        <video
            id="video"
            controls
            playsinline
            preload="metadata">
        </video>

    </div>


    <!-- ==========================
         URL
    =========================== -->

    <div class="url-box">

        <input
            id="urlInput"
            class="url-input"
            type="text"
            placeholder="Pega aquí una URL .m3u8, HLS o MP4"
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="loadButton"
            class="load-button">
            Cargar
        </button>

        <div
            id="status"
            class="status">
        </div>

        <div
            id="error"
            class="error">
        </div>

    </div>

</div>


<script>

"use strict";


/* ==========================================
   ELEMENTOS
========================================== */

const video =
    document.getElementById("video");

const urlInput =
    document.getElementById("urlInput");

const loadButton =
    document.getElementById("loadButton");

const status =
    document.getElementById("status");

const error =
    document.getElementById("error");


/* ==========================================
   HLS
========================================== */

let hls = null;


/* ==========================================
   ESTADO
========================================== */

function setStatus(text) {

    status.textContent = text;

}


function showError(text) {

    error.textContent = text;

    error.classList.add("show");

}


function hideError() {

    error.textContent = "";

    error.classList.remove("show");

}


/* ==========================================
   DESTRUIR HLS ANTERIOR
========================================== */

function destroyHLS() {

    if (!hls) {
        return;
    }

    try {
        hls.destroy();
    } catch (e) {
        console.warn(e);
    }

    hls = null;

}


/* ==========================================
   LIMPIAR REPRODUCTOR
========================================== */

function clearPlayer() {

    destroyHLS();

    try {
        video.pause();
    } catch (e) {}

    video.removeAttribute("src");

    video.load();

}


/* ==========================================
   DETECTAR HLS
========================================== */

function isHLS(url) {

    const cleanUrl =
        url
            .split("#")[0]
            .toLowerCase();

    return (
        cleanUrl.includes(".m3u8") ||
        cleanUrl.includes("application/vnd.apple.mpegurl")
    );

}


/* ==========================================
   CARGAR HLS
========================================== */

function loadHLS(url) {

    setStatus("Cargando HLS...");


    /*
       HLS nativo.

       Safari, iPhone, iPad y algunos
       navegadores pueden reproducir
       .m3u8 directamente.
    */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = url;

        video.load();

        setStatus("HLS listo.");

        return;

    }


    /*
       HLS.js
    */

    if (
        typeof Hls === "undefined"
    ) {

        showError(
            "No se pudo cargar HLS.js."
        );

        return;

    }


    if (
        !Hls.isSupported()
    ) {

        showError(
            "Este navegador no soporta reproducción HLS."
        );

        return;

    }


    hls = new Hls({

        enableWorker: true,

        lowLatencyMode: false,

        backBufferLength: 60,

        maxBufferLength: 30

    });


    hls.attachMedia(video);


    hls.on(
        Hls.Events.MEDIA_ATTACHED,
        function() {

            hls.loadSource(url);

        }
    );


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function() {

            setStatus(
                "HLS cargado correctamente."
            );

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function(event, data) {

            console.warn(
                "HLS error:",
                data
            );


            if (!data.fatal) {
                return;
            }


            showError(
                "No se pudo reproducir la transmisión HLS."
            );

        }
    );

}


/* ==========================================
   CARGAR MP4 / VIDEO DIRECTO
========================================== */

function loadVideo(url) {

    setStatus(
        "Cargando vídeo..."
    );


    video.src = url;

    video.load();


    video.addEventListener(
        "loadedmetadata",
        function onMetadata() {

            video.removeEventListener(
                "loadedmetadata",
                onMetadata
            );

            setStatus(
                "Vídeo listo."
            );

        }
    );

}


/* ==========================================
   CARGAR URL
========================================== */

function loadSource() {

    const url =
        urlInput.value.trim();


    hideError();


    if (!url) {

        showError(
            "Introduce una URL."
        );

        return;

    }


    clearPlayer();


    /*
       Detectamos automáticamente
       si es HLS o vídeo directo.
    */

    if (isHLS(url)) {

        loadHLS(url);

    } else {

        loadVideo(url);

    }

}


/* ==========================================
   BOTÓN CARGAR
========================================== */

loadButton.addEventListener(
    "click",
    loadSource
);


/* ==========================================
   ENTER
========================================== */

urlInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loadSource();

        }

    }
);


/* ==========================================
   ERRORES DEL VÍDEO
========================================== */

video.addEventListener(
    "error",
    function() {

        if (!video.error) {
            return;
        }


        let message =
            "No se pudo reproducir el vídeo.";


        switch (
            video.error.code
        ) {

            case MediaError.MEDIA_ERR_ABORTED:

                message =
                    "La reproducción fue cancelada.";

                break;


            case MediaError.MEDIA_ERR_NETWORK:

                message =
                    "No se pudo obtener el vídeo desde el servidor.";

                break;


            case MediaError.MEDIA_ERR_DECODE:

                message =
                    "El navegador no pudo decodificar el vídeo.";

                break;


            case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:

                message =
                    "El formato de vídeo no es compatible.";

                break;

        }


        showError(message);

    }
);

</script>

</body>
</html>
