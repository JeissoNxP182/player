<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reproductor JeissoNxP</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
 --purple:#a855f7;
 --dark:#140326;
 --deep:#09010f;
 --white:#f8fafc;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 user-select:none;
 -webkit-user-select:none;
 touch-action:manipulation;
}

body{
 width:100vw;
 min-height:100vh;
 background:var(--deep);
 color:var(--white);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 overflow-x:hidden;
}

.player-wrapper{
 width:100%;
 height:60vh;
 max-height:70vh;
 position:relative;
 background:#000;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 box-shadow:0 4px 25px #000;
}

video,iframe{
 width:100%;
 height:100%;
 border:0;
 object-fit:contain;
}

iframe{
 display:none;
 z-index:5;
}

video{
 transition:transform .3s ease,object-fit .2s ease;
}

.brand-watermark{
 position:absolute;
 top:10px;
 left:14px;
 font-size:17px;
 font-weight:900;
 letter-spacing:1px;
 color:#fff;
 text-shadow:0 2px 8px #000;
 z-index:25;
 pointer-events:none;
}

.video-title-display{
 position:absolute;
 top:37px;
 left:14px;
 font-size:14px;
 font-weight:600;
 color:#e2e8f0;
 max-width:70%;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 z-index:25;
 text-shadow:0 2px 7px #000;
 pointer-events:none;
}

.initial-play-overlay{
 position:absolute;
 inset:0;
 background:rgba(10,2,20,.72);
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:30;
 transition:.2s;
}

.initial-play-overlay.hidden{
 opacity:0;
 pointer-events:none;
}

.btn-initial-play{
 width:80px;
 height:80px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--purple),#3b0764);
 border:2px solid #cbd5e1;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 0 25px rgba(168,85,247,.6);
}

.btn-initial-play svg{
 width:44px;
 height:44px;
 fill:currentColor;
 margin-left:4px;
}

.controls-overlay{
 position:absolute;
 inset:0;
 background:rgba(10,2,20,.5);
 display:flex;
 flex-direction:column;
 justify-content:space-between;
 padding:12px;
 opacity:0;
 pointer-events:none;
 transition:opacity .2s;
 z-index:20;
}

.controls-overlay.active{
 opacity:1;
 pointer-events:auto;
}

.top-controls{
 display:flex;
 justify-content:flex-end;
 align-items:center;
 gap:8px;
 width:100%;
}

.center-controls{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 display:flex;
 align-items:center;
 gap:24px;
 z-index:22;
}

.btn-center{
 background:rgba(20,3,38,.8);
 border:1px solid rgba(168,85,247,.6);
 width:52px;
 height:52px;
 border-radius:50%;
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 backdrop-filter:blur(4px);
}

.btn-center.play-main{
 width:64px;
 height:64px;
 background:linear-gradient(135deg,var(--purple),#3b0764);
 border-color:#cbd5e1;
}

.icon-btn{
 background:none;
 border:0;
 color:#fff;
 width:36px;
 height:36px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
}

.icon-btn:active{
 background:rgba(168,85,247,.35);
}

.icon-btn svg{
 width:24px;
 height:24px;
 fill:currentColor;
}

.bottom-controls-wrapper{
 display:flex;
 flex-direction:column;
 gap:8px;
 width:100%;
}

.scrubber-container{
 width:100%;
 position:relative;
}

.video-scrubber{
 width:100%;
 height:7px;
 appearance:none;
 -webkit-appearance:none;
 background:rgba(255,255,255,.2);
 border-radius:5px;
 outline:none;
 cursor:pointer;
}

.video-scrubber::-webkit-slider-thumb{
 appearance:none;
 -webkit-appearance:none;
 width:15px;
 height:15px;
 border-radius:50%;
 background:#fff;
 border:2px solid var(--purple);
 box-shadow:0 0 8px var(--purple);
}

.scrubber-thumbnail-preview{
 position:absolute;
 bottom:27px;
 transform:translateX(-50%);
 display:none;
 flex-direction:column;
 align-items:center;
 z-index:35;
 pointer-events:none;
}

.scrubber-thumbnail-preview.active{
 display:flex;
}

.scrubber-preview-canvas{
 width:150px;
 height:84px;
 object-fit:cover;
 background:#000;
 border:2px solid var(--purple);
 border-radius:6px;
 box-shadow:0 4px 15px #000;
}

.scrubber-preview-time{
 margin-top:4px;
 padding:2px 6px;
 border-radius:4px;
 background:rgba(20,3,38,.95);
 font:700 10px monospace;
}

.bottom-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.bottom-left,.bottom-right{
 display:flex;
 align-items:center;
 gap:7px;
}

.volume-group{
 display:flex;
 align-items:center;
 gap:5px;
}

.volume-slider{
 width:60px;
}

.time-counter{
 font:700 11px monospace;
 color:#e2e8f0;
 padding:4px 6px;
 border-radius:4px;
 background:rgba(255,255,255,.08);
}

.settings-panel{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 background:rgba(20,3,38,.97);
 border-top:1px solid var(--purple);
 border-radius:16px 16px 0 0;
 padding:16px;
 display:none;
 flex-direction:column;
 gap:14px;
 z-index:40;
 backdrop-filter:blur(10px);
}

.settings-panel.active{
 display:flex;
}

.settings-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 font-size:13px;
 color:#e2e8f0;
}

.settings-item select{
 background:#2e0854;
 color:#fff;
 border:1px solid var(--purple);
 padding:5px 8px;
 border-radius:6px;
 outline:0;
}

.mirror-active{
 animation:mirror .3s ease;
}

@keyframes mirror{
 0%{transform:scaleX(1)}
 50%{transform:scaleX(-1) scale(.98)}
 100%{transform:scaleX(-1)}
}

.shortcuts-panel{
 position:absolute;
 inset:0;
 background:rgba(14,2,28,.96);
 z-index:45;
 display:none;
 flex-direction:column;
 padding:16px;
 overflow:auto;
}

.shortcuts-panel.active{
 display:flex;
}

.shortcuts-header{
 display:flex;
 justify-content:space-between;
 border-bottom:1px solid rgba(168,85,247,.4);
 padding-bottom:8px;
 margin-bottom:12px;
}

.shortcuts-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:10px;
 font-size:12px;
}

.shortcut-card{
 background:rgba(255,255,255,.05);
 border:1px solid rgba(168,85,247,.2);
 border-radius:8px;
 padding:8px 12px;
 display:flex;
 gap:10px;
 align-items:center;
}

.shortcut-key{
 background:#3b0764;
 border:1px solid var(--purple);
 padding:2px 6px;
 border-radius:4px;
 font:700 11px monospace;
}

.lock-overlay{
 position:absolute;
 inset:0;
 z-index:50;
 display:none;
 justify-content:flex-end;
 align-items:flex-start;
 padding:12px;
}

.lock-overlay.active{
 display:flex;
}

.url-section{
 padding:16px;
 background:var(--dark);
}

.url-title{
 font-size:12px;
 font-weight:600;
 color:#94a3b8;
 margin-bottom:10px;
 text-transform:uppercase;
}

.input-wrapper{
 display:flex;
 gap:8px;
}

.url-input{
 flex:1;
 height:42px;
 background:rgba(255,255,255,.05);
 border:1px solid rgba(168,85,247,.4);
 border-radius:8px;
 padding:0 12px;
 color:#fff;
 font-size:13px;
 outline:0;
 user-select:text;
}

.btn-load{
 height:42px;
 padding:0 18px;
 background:linear-gradient(135deg,var(--purple),#3b0764);
 border:1px solid #94a3b8;
 border-radius:8px;
 color:#fff;
 font-weight:600;
}

/* HISTORIAL */
.history{
 padding:0 16px 25px;
 background:var(--dark);
}

.history-title{
 color:#94a3b8;
 font-size:12px;
 font-weight:700;
 text-transform:uppercase;
 margin-bottom:10px;
}

.history-list{
 display:flex;
 flex-direction:column;
 gap:7px;
}

.history-item{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 background:rgba(255,255,255,.05);
 border:1px solid rgba(168,85,247,.18);
 border-radius:8px;
 padding:9px 10px;
 cursor:pointer;
}

.history-name{
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:12px;
}

.history-delete{
 color:#94a3b8;
 font-size:18px;
}

.empty-history{
 color:#64748b;
 font-size:12px;
 padding:8px 0;
}
</style>
</head>

<body>

<div class="player-wrapper" id="playerWrapper">

 <div class="brand-watermark">JeissoNxP</div>
 <div class="video-title-display" id="videoTitleDisplay"></div>

 <div class="initial-play-overlay" id="initialPlayOverlay">
  <button class="btn-initial-play" id="btnInitialPlay">
   <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
 </div>

 <video id="mainVideo"
  preload="metadata"
  playsinline
  webkit-playsinline
  crossorigin="anonymous"></video>

 <iframe id="mainIframe"
  allow="autoplay; encrypted-media; picture-in-picture"
  allowfullscreen></iframe>

 <div class="controls-overlay" id="controlsOverlay">

  <div class="top-controls">

   <!-- ATAJOS -->
   <button class="icon-btn" id="btnShortcuts" title="Atajos">
    <svg viewBox="0 0 24 24">
     <path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zM7 15H5v-2h2v2zm0-4H5V9h2v2zm4 4H9v-2h2v2zm0-4H9V9h2v2zm4 4h-2v-2h2v2zm0-4h-2V9h2v2zm4 4h-2v-2h2v2zm0-4h-2V9h2v2z"/>
    </svg>
   </button>

   <!-- TIJERA / SCREENSHOT -->
   <button class="icon-btn" id="btnScreenshot" title="Capturar pantalla">
    <svg viewBox="0 0 24 24">
     <path d="M9.64 7.64 5.5 3.5 4.09 4.91l4.14 4.14L4.09 13.2 5.5 14.61l4.14-4.14L12 12.83V18H8v2h10v-2h-4v-5.17l2.36-2.36 4.14 4.14 1.41-1.41-4.14-4.14 4.14-4.14L20.5 3.5l-4.14 4.14L14 5.28V2h-2v3.28z"/>
    </svg>
   </button>

   <!-- CAST -->
   <button class="icon-btn" id="btnCast" title="Transmitir">
    <svg viewBox="0 0 24 24">
     <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zM21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
    </svg>
   </button>

   <!-- PIP -->
   <button class="icon-btn" id="btnPip" title="PiP">
    <svg viewBox="0 0 24 24">
     <path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zM3 19V5h18v14H3z"/>
    </svg>
   </button>

   <!-- AJUSTES -->
   <button class="icon-btn" id="btnSettings" title="Ajustes">
    <svg viewBox="0 0 24 24">
     <path d="M19.43 12.98c.04-.32.07-.64-.07-.98s.03-.66.07-.98l2.11-1.65-2-3.46-2.49 1a7.7 7.7 0 0 0-1.69-.98l-.38-2.65h-4l-.38 2.65a7.7 7.7 0 0 0-1.69.98l-2.49-1-2 3.46 2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65 2 3.46 2.49-1c.52.4 1.08.73 1.69.98l.38 2.65h4l.38-2.65a7.7 7.7 0 0 0 1.69-.98l2.49 1 2-3.46zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
    </svg>
   </button>
  </div>

  <div class="center-controls">

   <button class="btn-center" id="btnRewind">
    <svg viewBox="0 0 24 24" style="width:28px;fill:currentColor">
     <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
    </svg>
   </button>

   <button class="btn-center play-main" id="btnCenterPlay">
    <svg id="centerIconPlay" viewBox="0 0 24 24" style="width:34px;fill:currentColor">
     <path d="M8 5v14l11-7z"/>
    </svg>
    <svg id="centerIconPause" viewBox="0 0 24 24" style="width:34px;fill:currentColor;display:none">
     <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
   </button>

   <button class="btn-center" id="btnForward">
    <svg viewBox="0 0 24 24" style="width:28px;fill:currentColor">
     <path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/>
    </svg>
   </button>

  </div>

  <div class="bottom-controls-wrapper">

   <div class="scrubber-container" id="scrubberContainer">

    <div class="scrubber-thumbnail-preview" id="thumbPreview">
     <canvas class="scrubber-preview-canvas" id="previewCanvas"></canvas>
     <span class="scrubber-preview-time" id="previewTime">0:00:00</span>
    </div>

    <input type="range"
     class="video-scrubber"
     id="videoScrubber"
     min="0"
     max="100"
     value="0"
     step=".05">

   </div>

   <div class="bottom-row">

    <div class="bottom-left">

     <button class="icon-btn" id="btnBottomPlay">
      <svg id="bottomIconPlay" viewBox="0 0 24 24">
       <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="bottomIconPause" viewBox="0 0 24 24" style="display:none">
       <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
      </svg>
     </button>

     <div class="volume-group">
      <button class="icon-btn" id="btnMute">
       🔊
      </button>
      <input class="volume-slider" id="volumeSlider"
       type="range" min="0" max="1" step=".05" value="1">
     </div>

     <div class="time-counter" id="currTime">0:00:00</div>
    </div>

    <div class="bottom-right">

     <button class="icon-btn" id="btnCopyLink">🔗</button>
     <button class="icon-btn" id="btnDownload">⬇️</button>
     <button class="icon-btn" id="btnFullscreen">⛶</button>

    </div>

   </div>
  </div>
 </div>

 <!-- AJUSTES -->
 <div class="settings-panel" id="settingsPanel">

  <div class="settings-item">
   <span>Relación de aspecto</span>
   <select id="selectAspect">
    <option value="contain">Automática</option>
    <option value="16:9">16:9</option>
    <option value="4:3">4:3</option>
    <option value="21:9">21:9</option>
    <option value="cover">Expandido</option>
   </select>
  </div>

  <div class="settings-item">
   <span>Sonido</span>
   <select id="selectAudio">
    <option value="normal">Normal</option>
    <option value="bass">Aumento de bajos</option>
    <option value="spatial">Sonido espacial</option>
    <option value="eq">Ecualizador</option>
   </select>
  </div>

  <div class="settings-item" id="mirrorOption">
   <span>Modo espejo</span>
   <span id="mirrorStatus">OFF</span>
  </div>

  <div class="settings-item" id="optLockScreen">
   <span>Bloquear pantalla</span>
   🔒
  </div>

 </div>

 <!-- ATAJOS -->
 <div class="shortcuts-panel" id="shortcutsPanel">
  <div class="shortcuts-header">
   <b>⌨️ Atajos de teclado</b>
   <button class="icon-btn" id="btnCloseShortcuts">✕</button>
  </div>

  <div class="shortcuts-grid">
   <div class="shortcut-card"><b>Espacio/K</b> Reproducir</div>
   <div class="shortcut-card"><b>←/J</b> -10 segundos</div>
   <div class="shortcut-card"><b>→/L</b> +10 segundos</div>
   <div class="shortcut-card"><b>↑</b> Volumen +</div>
   <div class="shortcut-card"><b>↓</b> Volumen -</div>
   <div class="shortcut-card"><b>M</b> Silenciar</div>
   <div class="shortcut-card"><b>F</b> Pantalla completa</div>
   <div class="shortcut-card"><b>P</b> PiP</div>
  </div>
 </div>

 <div class="lock-overlay" id="lockOverlay">
  <button class="icon-btn" id="btnUnlock"
   style="background:rgba(20,3,38,.8);border:1px solid var(--purple)">
   🔓
  </button>
 </div>

</div>

<!-- URL -->
<div class="url-section">

 <div class="url-title">
  Cargar fuente de vídeo
 </div>

 <div class="input-wrapper">
  <input id="urlInput"
   class="url-input"
   placeholder="Pega URL MP4, M3U8, YouTube o Embed">

  <button id="btnLoad" class="btn-load">
   Cargar
  </button>
 </div>

</div>

<!-- HISTORIAL -->
<div class="history">

 <div class="history-title">
  Últimas 10 películas
 </div>

 <div class="history-list" id="historyList"></div>

</div>


<script>
document.addEventListener("DOMContentLoaded",()=>{

const video=document.getElementById("mainVideo");
const wrapper=document.getElementById("playerWrapper");
const iframe=document.getElementById("mainIframe");

const initial=document.getElementById("initialPlayOverlay");
const initialBtn=document.getElementById("btnInitialPlay");

const controls=document.getElementById("controlsOverlay");
const settings=document.getElementById("settingsPanel");
const shortcuts=document.getElementById("shortcutsPanel");

const centerPlay=document.getElementById("btnCenterPlay");
const bottomPlay=document.getElementById("btnBottomPlay");

const rewind=document.getElementById("btnRewind");
const forward=document.getElementById("btnForward");

const scrub=document.getElementById("videoScrubber");
const scrubberContainer=document.getElementById("scrubberContainer");

const preview=document.getElementById("thumbPreview");
const canvas=document.getElementById("previewCanvas");
const previewTime=document.getElementById("previewTime");

const curr=document.getElementById("currTime");

const volume=document.getElementById("volumeSlider");
const mute=document.getElementById("btnMute");

const input=document.getElementById("urlInput");
const loadBtn=document.getElementById("btnLoad");

const selectAspect=document.getElementById("selectAspect");
const selectAudio=document.getElementById("selectAudio");
const mirrorOption=document.getElementById("mirrorOption");
const mirrorStatus=document.getElementById("mirrorStatus");

const historyList=document.getElementById("historyList");

let hls=null;
let currentUrl="";
let pendingUrl="";
let isEmbed=false;
let controlsTimer=null;
let timeMode=0;
let seeking=false;
let mirror=false;

const previewVideo=document.createElement("video");
previewVideo.muted=true;
previewVideo.preload="metadata";
previewVideo.crossOrigin="anonymous";
previewVideo.playsInline=true;


/* =========================
   CONTROLES 10 SEGUNDOS
========================= */

function resetControls(){

 clearTimeout(controlsTimer);

 if(!isEmbed && !video.paused){

  controls.classList.add("active");

  controlsTimer=setTimeout(()=>{
   controls.classList.remove("active");
   settings.classList.remove("active");
  },10000);

 }
}


/* =========================
   PLAY
========================= */

function togglePlay(){

 if(isEmbed)return;

 if(video.paused) video.play().catch(()=>{});
 else video.pause();

}

centerPlay.onclick=togglePlay;
bottomPlay.onclick=togglePlay;

video.addEventListener("play",()=>{
 initial.classList.add("hidden");
 controls.classList.add("active");
 resetControls();
});

video.addEventListener("pause",()=>{
 controls.classList.add("active");
 clearTimeout(controlsTimer);
});


/* =========================
   PLAY INICIAL
========================= */

initialBtn.onclick=()=>{

 initial.classList.add("hidden");

 if(pendingUrl){
  actualLoadAndPlay(pendingUrl);
 }

};


/* =========================
   TIEMPO
========================= */

function formatTime(sec){

 if(!isFinite(sec)||sec<0)return"0:00:00";

 let h=Math.floor(sec/3600);
 let m=Math.floor(sec%3600/60);
 let s=Math.floor(sec%60);

 return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

}

function updateUI(){

 if(isEmbed)return;

 let dur=video.duration||0;
 let cur=video.currentTime||0;

 if(timeMode===0)curr.textContent=formatTime(cur);
 if(timeMode===1)curr.textContent="-"+formatTime(dur-cur);
 if(timeMode===2)curr.textContent="["+formatTime(dur)+"]";

 if(dur&&!seeking)
  scrub.value=cur/dur*100;

 /* BUFFER */

 let bufferEnd=0;

 if(video.buffered.length){

  for(let i=0;i<video.buffered.length;i++){

   if(
    video.buffered.start(i)<=cur &&
    cur<=video.buffered.end(i)
   ){
    bufferEnd=video.buffered.end(i);
    break;
   }

  }

  if(!bufferEnd)
   bufferEnd=video.buffered.end(video.buffered.length-1);

 }

 let bufferPercent=dur?bufferEnd/dur*100:0;
 let currentPercent=dur?cur/dur*100:0;

 scrub.style.background=
 `linear-gradient(to right,
 rgba(168,85,247,1) 0%,
 rgba(168,85,247,1) ${currentPercent}%,
 rgba(255,255,255,.48) ${currentPercent}%,
 rgba(255,255,255,.48) ${bufferPercent}%,
 rgba(255,255,255,.16) ${bufferPercent}%,
 rgba(255,255,255,.16) 100%)`;

}

video.addEventListener("timeupdate",()=>{
 if(!seeking)updateUI();
});

video.addEventListener("progress",updateUI);

curr.onclick=()=>{
 timeMode=(timeMode+1)%3;
 updateUI();
 resetControls();
};


/* =========================
   BARRA + MINIATURA
========================= */

function showPreview(e){

 if(!video.duration)return;

 const rect=scrub.getBoundingClientRect();

 let x=e.clientX;

 if(e.touches)x=e.touches[0].clientX;

 let pos=Math.max(0,Math.min(x-rect.left,rect.width));

 let percent=pos/rect.width;
 let time=percent*video.duration;

 preview.style.left=pos+"px";
 previewTime.textContent=formatTime(time);
 preview.classList.add("active");

 if(previewVideo.readyState>=1){

  try{
   previewVideo.currentTime=time;
  }catch(err){}

 }

}

scrub.addEventListener("pointerdown",e=>{
 seeking=true;
 showPreview(e);
});

scrub.addEventListener("pointermove",showPreview);

scrub.addEventListener("pointerup",()=>{
 preview.classList.remove("active");

 if(video.duration)
  video.currentTime=(scrub.value/100)*video.duration;

 seeking=false;
 resetControls();
});

scrub.addEventListener("pointerleave",()=>{
 preview.classList.remove("active");
});

scrub.addEventListener("input",e=>{

 seeking=true;

 let time=(scrub.value/100)*(video.duration||0);

 previewTime.textContent=formatTime(time);

 try{
  if(previewVideo.readyState>=1)
   previewVideo.currentTime=time;
 }catch(err){}

});

previewVideo.addEventListener("seeked",()=>{

 if(!preview.classList.contains("active"))return;

 if(!previewVideo.videoWidth)return;

 canvas.width=previewVideo.videoWidth;
 canvas.height=previewVideo.videoHeight;

 try{
  canvas.getContext("2d").drawImage(
   previewVideo,
   0,0,
   canvas.width,
   canvas.height
  );
 }catch(err){}

});


/* =========================
   +10 / -10
========================= */

function seek(seconds){

 if(!video.duration)return;

 video.currentTime=Math.max(
  0,
  Math.min(video.duration,video.currentTime+seconds)
 );

 resetControls();

}

rewind.onclick=e=>{
 e.stopPropagation();
 seek(-10);
};

forward.onclick=e=>{
 e.stopPropagation();
 seek(10);
};


/* =========================
   DOBLE TAP
========================= */

let lastTap=0;
let lastTapX=0;

wrapper.addEventListener("touchend",e=>{

 if(
  e.target.closest(".controls-overlay") ||
  e.target.closest(".settings-panel") ||
  e.target.closest(".shortcuts-panel")
 )return;

 const now=Date.now();
 const touch=e.changedTouches[0];
 const x=touch.clientX;

 if(now-lastTap<350 && Math.abs(x-lastTapX)<120){

  const rect=wrapper.getBoundingClientRect();
  const relative=x-rect.left;

  if(relative<rect.width*.4){
   seek(-10);
  }
  else if(relative>rect.width*.6){
   seek(10);
  }

  lastTap=0;
  return;
 }

 lastTap=now;
 lastTapX=x;

});


/* =========================
   VOLUMEN
========================= */

volume.oninput=()=>{
 video.volume=Number(volume.value);
 video.muted=video.volume===0;
};

mute.onclick=()=>{
 video.muted=!video.muted;
 if(!video.muted && video.volume===0)
  video.volume=1;
};


/* =========================
   AJUSTES
========================= */

document.getElementById("btnSettings").onclick=e=>{
 e.stopPropagation();
 settings.classList.toggle("active");
 shortcuts.classList.remove("active");
};


/* ASPECTO */

selectAspect.onchange=()=>{

 const value=selectAspect.value;

 if(value==="contain"){
  video.style.objectFit="contain";
 }

 if(value==="cover"){
  video.style.objectFit="cover";
 }

 if(value==="16:9"){
  video.style.objectFit="contain";
  video.style.aspectRatio="16/9";
 }

 if(value==="4:3"){
  video.style.objectFit="contain";
  video.style.aspectRatio="4/3";
 }

 if(value==="21:9"){
  video.style.objectFit="contain";
  video.style.aspectRatio="21/9";
 }

};


/* ESPEJO */

mirrorOption.onclick=()=>{

 mirror=!mirror;

 video.classList.remove("mirror-active");

 void video.offsetWidth;

 video.classList.add("mirror-active");

 video.style.transform=mirror?"scaleX(-1)":"scaleX(1)";

 mirrorStatus.textContent=mirror?"ON":"OFF";

};


/* =========================
   AUDIO
========================= */

let audioContext=null;
let sourceNode=null;
let bassFilter=null;
let trebleFilter=null;
let analyser=null;

function setupAudio(){

 if(audioContext)return;

 try{

  audioContext=new(
   window.AudioContext||
   window.webkitAudioContext
  )();

  sourceNode=audioContext.createMediaElementSource(video);

  bassFilter=audioContext.createBiquadFilter();
  bassFilter.type="lowshelf";
  bassFilter.frequency.value=180;
  bassFilter.gain.value=0;

  trebleFilter=audioContext.createBiquadFilter();
  trebleFilter.type="highshelf";
  trebleFilter.frequency.value=4000;
  trebleFilter.gain.value=0;

  analyser=audioContext.createAnalyser();

  sourceNode
   .connect(bassFilter)
   .connect(trebleFilter)
   .connect(analyser)
   .connect(audioContext.destination);

 }catch(err){}

}

selectAudio.onchange=()=>{

 setupAudio();

 if(!audioContext)return;

 audioContext.resume();

 bassFilter.gain.value=0;
 trebleFilter.gain.value=0;

 if(selectAudio.value==="bass"){
  bassFilter.gain.value=8;
 }

 if(selectAudio.value==="spatial"){
  bassFilter.gain.value=4;
  trebleFilter.gain.value=3;
 }

 if(selectAudio.value==="eq"){
  bassFilter.gain.value=5;
  trebleFilter.gain.value=5;
 }

};


/* =========================
   ATAJOS
========================= */

document.getElementById("btnShortcuts").onclick=e=>{
 e.stopPropagation();
 shortcuts.classList.add("active");
 settings.classList.remove("active");
};

document.getElementById("btnCloseShortcuts").onclick=()=>{
 shortcuts.classList.remove("active");
};


/* =========================
   SCREENSHOT
========================= */

document.getElementById("btnScreenshot").onclick=()=>{

 if(isEmbed||!video.videoWidth)return;

 try{

  const shot=document.createElement("canvas");

  shot.width=video.videoWidth;
  shot.height=video.videoHeight;

  const ctx=shot.getContext("2d");

  if(mirror){

   ctx.translate(shot.width,0);
   ctx.scale(-1,1);

  }

  ctx.drawImage(video,0,0,shot.width,shot.height);

  const link=document.createElement("a");

  link.download=
   "JeissoNxP-"+formatTime(video.currentTime).replaceAll(":","-")+".png";

  link.href=shot.toDataURL("image/png");

  link.click();

 }catch(err){

  alert(
   "No se pudo capturar este vídeo. El servidor puede bloquear capturas por CORS."
  );

 }

};


/* =========================
   HISTORIAL
========================= */

function getTitle(url){

 try{

  let u=new URL(url);
  let p=u.pathname.split("/").filter(Boolean);

  if(p.length)
   return decodeURIComponent(p[p.length-1])
    .replace(/\.[^/.]+$/,"")
    .replaceAll("_"," ");

  return u.hostname;

 }catch{
  return url;
 }

}

function saveHistory(url){

 let history=JSON.parse(
  localStorage.getItem("jeisson_history")||"[]"
 );

 history=history.filter(x=>x.url!==url);

 history.unshift({
  url:url,
  title:getTitle(url)
 });

 history=history.slice(0,10);

 localStorage.setItem(
  "jeisson_history",
  JSON.stringify(history)
 );

 renderHistory();

}

function renderHistory(){

 let history=JSON.parse(
  localStorage.getItem("jeisson_history")||"[]"
 );

 historyList.innerHTML="";

 if(!history.length){

  historyList.innerHTML=
   '<div class="empty-history">Todavía no hay películas.</div>';

  return;

 }

 history.forEach((item,index)=>{

  const row=document.createElement("div");

  row.className="history-item";

  row.innerHTML=`
   <span class="history-name">${escapeHTML(item.title)}</span>
   <span class="history-delete">×</span>
  `;

  row.querySelector(".history-name").onclick=()=>{
   input.value=item.url;
   loadVideo(item.url);
  };

  row.querySelector(".history-delete").onclick=e=>{

   e.stopPropagation();

   history.splice(index,1);

   localStorage.setItem(
    "jeisson_history",
    JSON.stringify(history)
   );

   renderHistory();

  };

  historyList.appendChild(row);

 });

}

function escapeHTML(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;");

}


/* =========================
   CARGAR VÍDEO
========================= */

function actualLoadAndPlay(url){

 const lower=url.toLowerCase();

 video.muted=false;
 video.volume=1;

 setupAudio();

 if(audioContext)
  audioContext.resume();

 if(lower.includes(".m3u8")){

  if(video.canPlayType("application/vnd.apple.mpegurl")){

   video.src=url;
   previewVideo.src=url;

   video.play().catch(()=>{});

  }else if(Hls.isSupported()){

   hls=new Hls({
    enableWorker:true,
    lowLatencyMode:true
   });

   hls.loadSource(url);
   hls.attachMedia(video);

   hls.on(Hls.Events.MANIFEST_PARSED,()=>{
    video.play().catch(()=>{});
   });

  }

 }else{

  video.src=url;
  previewVideo.src=url;

  video.play().catch(()=>{});

 }

}


/* =========================
   CARGAR URL
========================= */

function loadVideo(url){

 if(!url)return;

 currentUrl=url;
 pendingUrl=url;

 input.value="";

 document.getElementById("videoTitleDisplay")
  .textContent=getTitle(url);

 saveHistory(url);

 if(hls){
  hls.destroy();
  hls=null;
 }

 video.pause();
 video.removeAttribute("src");
 video.load();

 previewVideo.removeAttribute("src");
 previewVideo.load();

 const lower=url.toLowerCase();

 isEmbed=
  lower.includes("youtube.com")||
  lower.includes("youtu.be")||
  lower.includes("/embed")||
  lower.includes("drive.google.com");

 if(isEmbed){

  let embed=url;

  if(url.includes("youtu.be/")){

   let id=url.split("youtu.be/")[1].split("?")[0];

   embed=
    "https://www.youtube.com/embed/"+id+"?autoplay=1";

  }

  else if(url.includes("youtube.com/watch?v=")){

   let id=url.split("v=")[1].split("&")[0];

   embed=
    "https://www.youtube.com/embed/"+id+"?autoplay=1";

  }

  video.style.display="none";
  iframe.style.display="block";
  iframe.src=embed;

  controls.style.display="none";
  initial.classList.add("hidden");

 }else{

  iframe.style.display="none";
  iframe.src="about:blank";

  video.style.display="block";
  controls.style.display="flex";

  initial.classList.remove("hidden");
  controls.classList.remove("active");

 }

}

loadBtn.onclick=()=>{
 loadVideo(input.value.trim());
};

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")
  loadVideo(input.value.trim());
});


/* =========================
   CLICK EN EL REPRODUCTOR
========================= */

wrapper.addEventListener("click",e=>{

 if(isEmbed)return;

 if(
  e.target.closest(".controls-overlay")||
  e.target.closest(".settings-panel")||
  e.target.closest(".shortcuts-panel")||
  e.target.closest(".lock-overlay")
 )return;

 if(!initial.classList.contains("hidden"))return;

 controls.classList.toggle("active");

 if(controls.classList.contains("active"))
  resetControls();

});


/* =========================
   PIP
========================= */

document.getElementById("btnPip").onclick=async()=>{

 try{

  if(document.pictureInPictureElement)
   await document.exitPictureInPicture();

  else if(document.pictureInPictureEnabled)
   await video.requestPictureInPicture();

 }catch(err){}

};


/* =========================
   FULLSCREEN
========================= */

document.getElementById("btnFullscreen").onclick=()=>{

 if(!document.fullscreenElement)
  wrapper.requestFullscreen?.();

 else
  document.exitFullscreen?.();

};


/* =========================
   COPIAR
========================= */

document.getElementById("btnCopyLink").onclick=async()=>{

 if(!currentUrl)return;

 try{
  await navigator.clipboard.writeText(currentUrl);
 }catch(err){}

};


/* =========================
   DESCARGA
========================= */

document.getElementById("btnDownload").onclick=()=>{

 if(!currentUrl)return;

 const a=document.createElement("a");

 a.href=currentUrl;
 a.download="";
 a.target="_blank";

 document.body.appendChild(a);
 a.click();
 a.remove();

};


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown",e=>{

 if(
  document.activeElement===input||
  isEmbed||
  !initial.classList.contains("hidden")
 )return;

 switch(e.key.toLowerCase()){

  case" ":
  case"k":
   e.preventDefault();
   togglePlay();
   resetControls();
   break;

  case"arrowleft":
  case"j":
   e.preventDefault();
   seek(-10);
   break;

  case"arrowright":
  case"l":
   e.preventDefault();
   seek(10);
   break;

  case"arrowup":
   e.preventDefault();
   video.volume=Math.min(1,video.volume+.05);
   break;

  case"arrowdown":
   e.preventDefault();
   video.volume=Math.max(0,video.volume-.05);
   break;

  case"m":
   video.muted=!video.muted;
   break;

  case"f":
   document.getElementById("btnFullscreen").click();
   break;

  case"p":
   document.getElementById("btnPip").click();
   break;

 }

 resetControls();

});


/* =========================
   HISTORIAL INICIAL
========================= */

renderHistory();


/* =========================
   ?url=
========================= */

const params=new URLSearchParams(location.search);

const url=params.get("url")||params.get("v");

if(url)
 loadVideo(url);

});
</script>
