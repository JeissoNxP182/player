<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#140326">
<title>JeissoNxP182</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>

<style>
:root{
 --p:#a855f7;
 --pd:#3b0764;
 --bg:#140326;
 --panel:#1b0633;
 --text:#fff;
 --muted:#aaa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{overflow:hidden}

.header{
 height:64px;padding:9px 14px;background:#140326;
 display:flex;flex-direction:column;justify-content:center;
 border-bottom:1px solid #ffffff12;
}
.brand{font-size:16px;font-weight:bold;color:#e9d5ff}
.movie-title{
 margin-top:3px;font-size:12px;color:#aaa;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

.player{
 position:relative;width:100%;height:55vh;min-height:220px;
 background:#000;overflow:hidden
}
video{width:100%;height:100%;object-fit:contain;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}

button{
 border:0;background:none;color:#fff;cursor:pointer;
 -webkit-tap-highlight-color:transparent
}

.settings{
 position:absolute;top:10px;right:10px;z-index:40;
 width:36px;height:36px;border-radius:50%;
 background:#0009;font-size:20px
}
.settings:active{background:var(--p)}

.settings-menu{
 position:absolute;top:52px;right:0;z-index:50;
 width:50%;min-width:220px;max-height:calc(100% - 60px);
 overflow:hidden;background:#160425;
 border:1px solid #ffffff18;border-radius:10px;
 display:none;box-shadow:0 10px 30px #000b
}
.settings-menu.show{display:block}

.menu-main{display:flex;flex-direction:column}
.menu-item{
 padding:15px 16px;border-bottom:1px solid #ffffff0d;
 font-size:14px;display:flex;justify-content:space-between;
 align-items:center
}
.menu-item:active{background:#a855f722}
.menu-value{font-size:11px;color:#aaa}

.submenu{display:none;height:100%;overflow-y:auto}
.submenu.show{display:block}
.sub-head{
 padding:13px 15px;border-bottom:1px solid #ffffff15;
 font-weight:bold;display:flex;gap:10px;align-items:center
}
.sub-option{
 padding:13px 16px;font-size:13px;
 border-bottom:1px solid #ffffff0b
}
.sub-option.active{color:#c084fc;background:#a855f715}

.controls{
 position:absolute;left:0;right:0;bottom:0;z-index:20;
 padding:8px 10px 7px;
 background:linear-gradient(transparent,#000d)
}
.controls-row{display:flex;align-items:center;gap:9px}
.icon{font-size:18px;min-width:25px;text-align:center}
.play-small{font-size:18px}
.time{
 font-size:11px;color:#fff;white-space:nowrap;
 font-variant-numeric:tabular-nums
}
.progress{
 flex:1;height:5px;appearance:none;background:#ffffff40;
 border-radius:10px;outline:none
}
.progress::-webkit-slider-thumb{
 appearance:none;width:13px;height:13px;border-radius:50%;
 background:var(--p);box-shadow:0 0 0 2px #ffffff33
}
.progress::-moz-range-thumb{
 width:13px;height:13px;border:0;border-radius:50%;
 background:var(--p)
}
.volume{
 width:70px;height:4px;appearance:none;background:#ffffff40;
 border-radius:5px
}
.volume::-webkit-slider-thumb{
 appearance:none;width:12px;height:12px;border-radius:50%;background:var(--p)
}
.volume::-moz-range-thumb{
 width:12px;height:12px;border:0;border-radius:50%;background:var(--p)
}

.center-controls{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 z-index:25;display:flex;align-items:center;gap:25px;
 opacity:0;pointer-events:none;transition:.15s
}
.player.show-controls .center-controls{
 opacity:1;pointer-events:auto
}
.center-btn{
 width:48px;height:48px;border-radius:50%;
 background:#0009;font-size:20px
}
.center-play{width:58px;height:58px;background:var(--p);font-size:25px}

.time-mode{
 position:absolute;bottom:43px;left:50%;
 transform:translateX(-50%);
 z-index:21;background:#0009;border-radius:5px;
 padding:4px 8px;font-size:11px;
 font-variant-numeric:tabular-nums
}

.locked .controls,
.locked .settings,
.locked .center-controls,
.locked .time-mode{
 display:none!important
}

.locked{
 cursor:none
}

.loading{
 position:absolute;inset:0;z-index:30;
 display:none;align-items:center;justify-content:center;
 background:#0008
}
.loading.show{display:flex}
.spinner{
 width:36px;height:36px;border:4px solid #ffffff22;
 border-top-color:var(--p);border-radius:50%;
 animation:spin .7s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.error{
 position:absolute;inset:0;z-index:60;
 display:none;align-items:center;justify-content:center;
 background:#000d;padding:20px;text-align:center
}
.error.show{display:flex}
.error-box{
 max-width:430px;background:#1b0633;border:1px solid #ef444477;
 border-radius:10px;padding:20px
}
.error button{
 margin-top:12px;padding:8px 15px;background:var(--p);
 border-radius:6px
}

.initial{
 position:absolute;inset:0;z-index:18;
 display:flex;align-items:center;justify-content:center;
 background:#0005
}
.initial.hidden{display:none}
.initial button{
 width:65px;height:65px;border-radius:50%;
 background:var(--p);font-size:28px
}

.url-section{
 height:calc(45vh - 64px);min-height:150px;
 padding:13px;background:#140326
}
.url-label{font-size:10px;color:#aaa;margin-bottom:7px}
.url-row{display:flex;gap:7px}
.url-input{
 flex:1;min-width:0;height:40px;padding:0 10px;
 border-radius:7px;border:1px solid #a855f766;
 background:#ffffff08;color:#fff;outline:0
}
.load{
 height:40px;padding:0 14px;border-radius:7px;
 background:var(--p);font-weight:bold
}
.history-title{
 margin-top:12px;font-size:10px;color:#888
}
.history{
 margin-top:5px;max-height:90px;overflow:auto
}
.history-item{
 padding:7px;border-bottom:1px solid #ffffff0b;
 display:flex;justify-content:space-between;gap:7px;font-size:11px
}
.history-name{
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.history-play{color:#c084fc}

@media(max-width:600px){
 .header{height:58px}
 .player{height:42vh;min-height:210px}
 .url-section{height:calc(58vh - 58px)}
 .settings-menu{width:52%;min-width:205px}
 .volume{width:55px}
 .center-controls{gap:18px}
}
</style>
</head>

<body>

<header class="header">
 <div class="brand">JeissoNxP182</div>
 <div class="movie-title" id="movieTitle">Ningún vídeo cargado</div>
</header>

<main class="player" id="player">

 <video id="video"
  playsinline webkit-playsinline preload="metadata"></video>

 <iframe id="iframe"
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
  allowfullscreen></iframe>

 <button class="settings" id="settingsBtn" aria-label="Opciones">⚙</button>

 <div class="settings-menu" id="settingsMenu">

  <div class="menu-main" id="menuMain">

   <button class="menu-item" data-menu="quality">
    <span>Calidad</span><span class="menu-value" id="qualityValue">Auto</span>
   </button>

   <button class="menu-item" data-menu="speed">
    <span>Velocidad</span><span class="menu-value" id="speedValue">Normal</span>
   </button>

   <button class="menu-item" data-menu="aspect">
    <span>Relación de aspecto</span><span class="menu-value" id="aspectValue">16:9</span>
   </button>

   <button class="menu-item" data-menu="sound">
    <span>Sonido</span><span class="menu-value" id="soundValue">Normal</span>
   </button>

   <button class="menu-item" data-menu="mirror">
    <span>Modo espejo</span><span class="menu-value" id="mirrorValue">Desactivado</span>
   </button>

   <button class="menu-item" id="lockMenu">
    <span>Bloquear pantalla</span>
   </button>

  </div>

  <div class="submenu" id="submenu"></div>

 </div>

 <div class="initial" id="initial">
  <button id="initialPlay">▶</button>
 </div>

 <div class="center-controls">
  <button class="center-btn" id="back10">↶</button>
  <button class="center-btn center-play" id="centerPlay">▶</button>
  <button class="center-btn" id="forward10">↷</button>
 </div>

 <div class="time-mode" id="timeMode">00:00:00</div>

 <div class="controls" id="controls">

  <div class="controls-row">

   <button class="icon play-small" id="playBtn">▶</button>

   <button class="icon" id="muteBtn">🔊</button>

   <input class="volume" id="volume" type="range" min="0" max="1" step=".01" value="1">

   <span class="time" id="timeCurrent">00:00</span>

   <input class="progress" id="progress" type="range" min="0" max="1000" value="0">

   <span class="time" id="timeTotal">00:00</span>

   <button class="icon" id="pipBtn" title="Picture in Picture">▣</button>
   <button class="icon" id="castBtn" title="Transmitir">◉</button>
   <button class="icon" id="shortcutsBtn" title="Atajos">⌨</button>
   <button class="icon" id="fullscreenBtn" title="Pantalla completa">⛶</button>

  </div>

 </div>

 <div class="loading" id="loading">
  <div class="spinner"></div>
 </div>

 <div class="error" id="error">
  <div class="error-box">
   <div id="errorText">No se pudo reproducir el vídeo.</div>
   <button id="errorClose">Cerrar</button>
  </div>
 </div>

</main>

<section class="url-section">
 <div class="url-label">Fuente de vídeo · MP4 / M3U8 / HLS / Embed</div>

 <div class="url-row">
  <input class="url-input" id="urlInput"
   placeholder="Pega aquí la URL..." autocomplete="off" spellcheck="false">
  <button class="load" id="loadBtn">Cargar</button>
 </div>

 <div class="history-title">Últimas 10 películas</div>
 <div class="history" id="history"></div>
</section>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const $=id=>document.getElementById(id);

const video=$("video");
const iframe=$("iframe");
const player=$("player");
const initial=$("initial");
const initialPlay=$("initialPlay");
const playBtn=$("playBtn");
const centerPlay=$("centerPlay");
const back10=$("back10");
const forward10=$("forward10");
const progress=$("progress");
const volume=$("volume");
const muteBtn=$("muteBtn");
const timeCurrent=$("timeCurrent");
const timeTotal=$("timeTotal");
const timeMode=$("timeMode");
const settingsBtn=$("settingsBtn");
const settingsMenu=$("settingsMenu");
const menuMain=$("menuMain");
const submenu=$("submenu");
const loading=$("loading");
const error=$("error");
const errorText=$("errorText");
const errorClose=$("errorClose");
const urlInput=$("urlInput");
const loadBtn=$("loadBtn");
const history=$("history");
const movieTitle=$("movieTitle");

let hls=null;
let currentUrl="";
let currentType="";
let locked=false;
let timeModeIndex=0;
let hideTimer=null;
let longPressTimer=null;
let lastTap=0;
let clickTimer=null;
let soundMode="normal";
let mirror=false;

function format(sec,full=false){
 sec=Number(sec)||0;
 sec=Math.max(0,Math.floor(sec));
 const h=Math.floor(sec/3600);
 const m=Math.floor(sec%3600/60);
 const s=sec%60;
 return full
  ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
  : h>0
   ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
   : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function showLoading(v=true){loading.classList.toggle("show",v)}
function showError(msg){
 showLoading(false);
 errorText.textContent=msg;
 error.classList.add("show");
}
function hideError(){error.classList.remove("show")}

function sourceType(url){
 const u=url.toLowerCase().split("?")[0];
 if(u.includes(".m3u8"))return"hls";
 if(/\.(mp4|webm|ogg|ogv|mov)(\?|#|$)/i.test(url))return"video";
 if(/youtube\.com|youtu\.be/i.test(url))return"youtube";
 if(/\/embed\/|player\./i.test(url))return"iframe";
 return"video";
}

function videoName(url){
 try{
  const u=new URL(url);
  let n=decodeURIComponent(u.pathname.split("/").filter(Boolean).pop()||u.hostname);
  return n.replace(/\.(mp4|m3u8|webm|ogg|ogv|mov)$/i,"").replace(/[_-]+/g," ").trim();
 }catch{return url}
}

function destroyHls(){
 if(hls){
  try{hls.destroy()}catch(e){}
  hls=null;
 }
}

function clearSource(){
 destroyHls();
 try{video.pause()}catch(e){}
 video.removeAttribute("src");
 video.load();
 iframe.src="about:blank";
 iframe.style.display="none";
 video.style.display="block";
}

function loadHls(url){
 showLoading(true);

 if(video.canPlayType("application/vnd.apple.mpegurl")){
  video.src=url;
  video.load();
  return;
 }

 if(typeof Hls==="undefined"||!Hls.isSupported()){
  showError("Este navegador no permite reproducir HLS.");
  return;
 }

 hls=new Hls({
  enableWorker:true,
  lowLatencyMode:false,
  backBufferLength:60,
  maxBufferLength:30,
  capLevelToPlayerSize:true
 });

 hls.attachMedia(video);

 hls.on(Hls.Events.MEDIA_ATTACHED,()=>{
  if(hls)hls.loadSource(url);
 });

 hls.on(Hls.Events.MANIFEST_PARSED,()=>{
  showLoading(false);
  buildQualityMenu();
 });

 hls.on(Hls.Events.ERROR,(e,d)=>{
  if(!d.fatal)return;

  if(d.type===Hls.ErrorTypes.MEDIA_ERROR){
   try{hls.recoverMediaError()}catch(e){
    showError("No se pudo decodificar esta transmisión HLS.");
   }
  }else if(d.type===Hls.ErrorTypes.NETWORK_ERROR){
   try{hls.startLoad()}catch(e){
    showError("No se pudo obtener la transmisión.");
   }
  }else{
   showError("La transmisión HLS no pudo cargarse.");
  }
 });
}

function youtubeEmbed(url){
 try{
  const u=new URL(url);
  let id=u.hostname.includes("youtu.be")
   ?u.pathname.slice(1).split("/")[0]
   :u.searchParams.get("v");

  if(u.pathname.includes("/embed/"))
   id=u.pathname.split("/embed/")[1].split("/")[0];

  return id
   ?"https://www.youtube.com/embed/"+encodeURIComponent(id)+"?rel=0&modestbranding=1"
   :null;
 }catch{return null}
}

function loadVideo(url){
 url=String(url||"").trim();
 if(!url)return showError("Escribe una URL.");

 hideError();
 clearSource();

 currentUrl=url;
 currentType=sourceType(url);
 movieTitle.textContent=videoName(url);
 saveHistory(url);

 if(currentType==="youtube"){
  const yt=youtubeEmbed(url);
  if(!yt)return showError("URL de YouTube no válida.");
  video.style.display="none";
  iframe.style.display="block";
  iframe.src=yt;
  initial.classList.add("hidden");
  return;
 }

 if(currentType==="iframe"){
  video.style.display="none";
  iframe.style.display="block";
  iframe.src=url;
  initial.classList.add("hidden");
  return;
 }

 video.style.display="block";
 iframe.style.display="none";
 initial.classList.remove("hidden");

 if(currentType==="hls")loadHls(url);
 else{
  showLoading(true);
  video.src=url;
  video.load();
 }
}

async function play(){
 if(!currentUrl)return showError("Primero carga una película.");
 if(currentType==="youtube"||currentType==="iframe")return;

 hideError();

 try{
  await video.play();
  initial.classList.add("hidden");
  updatePlay();
 }catch(e){
  showError("El navegador no pudo iniciar la reproducción.");
 }
}

function pause(){
 video.pause();
 updatePlay();
}

function updatePlay(){
 const playing=!video.paused;
 playBtn.textContent=playing?"❚❚":"▶";
 centerPlay.textContent=playing?"❚❚":"▶";
 initial.classList.toggle("hidden",playing);
}

function seek(sec){
 if(!Number.isFinite(video.duration))return;
 video.currentTime=Math.max(0,Math.min(video.duration,video.currentTime+sec));
 showControls();
}

function showControls(){
 if(locked)return;
 player.classList.add("show-controls");
 clearTimeout(hideTimer);
 hideTimer=setTimeout(()=>{
  if(!settingsMenu.classList.contains("show"))
   player.classList.remove("show-controls");
 },3500);
}

function updateProgress(){
 const d=video.duration||0;
 const c=video.currentTime||0;

 timeCurrent.textContent=format(c);
 timeTotal.textContent=format(d);

 progress.value=d?(c/d)*1000:0;

 if(timeModeIndex===0)timeMode.textContent=format(c,true);
 if(timeModeIndex===1)timeMode.textContent=format(Math.max(0,d-c),true);
 if(timeModeIndex===2)timeMode.textContent=format(d,true);
}

function changeTimeMode(){
 timeModeIndex=(timeModeIndex+1)%3;
 updateProgress();
}

progress.addEventListener("input",()=>{
 if(video.duration)
  video.currentTime=(progress.value/1000)*video.duration;
});

volume.addEventListener("input",()=>{
 video.volume=Number(volume.value);
 video.muted=video.volume===0;
 updateMute();
});

function updateMute(){
 muteBtn.textContent=video.muted||video.volume===0?"🔇":"🔊";
 volume.value=video.muted?0:video.volume;
}

muteBtn.onclick=()=>{
 video.muted=!video.muted;
 if(!video.muted&&video.volume===0)video.volume=.8;
 updateMute();
};

playBtn.onclick=()=>video.paused?play():pause();
centerPlay.onclick=()=>video.paused?play():pause();
initialPlay.onclick=play;
back10.onclick=()=>seek(-10);
forward10.onclick=()=>seek(10);
timeMode.onclick=changeTimeMode;

video.addEventListener("loadstart",()=>currentUrl&&showLoading(true));
video.addEventListener("loadedmetadata",()=>{
 showLoading(false);
 updateProgress();
});
video.addEventListener("canplay",()=>showLoading(false));
video.addEventListener("playing",()=>{
 showLoading(false);
 updatePlay();
});
video.addEventListener("pause",updatePlay);
video.addEventListener("play",updatePlay);
video.addEventListener("timeupdate",updateProgress);
video.addEventListener("durationchange",updateProgress);
video.addEventListener("waiting",()=>showLoading(true));
video.addEventListener("playing",()=>showLoading(false));

video.addEventListener("error",()=>{
 if(!currentUrl)return;
 const e=video.error;
 if(e&&e.code===MediaError.MEDIA_ERR_DECODE)
  showError("El navegador no puede decodificar este vídeo.");
 else if(e&&e.code===MediaError.MEDIA_ERR_NETWORK)
  showError("No se pudo obtener el vídeo desde el servidor.");
 else
  showError("La fuente no pudo ser reproducida.");
});

settingsBtn.onclick=e=>{
 e.stopPropagation();
 settingsMenu.classList.toggle("show");
 player.classList.add("show-controls");
};

document.querySelectorAll("[data-menu]").forEach(btn=>{
 btn.onclick=()=>openSubmenu(btn.dataset.menu);
});

function openSubmenu(type){
 menuMain.style.display="none";
 submenu.classList.add("show");

 const back=`<div class="sub-head"><button id="backMenu">‹</button><span>${{
  quality:"Calidad",
  speed:"Velocidad",
  aspect:"Relación de aspecto",
  sound:"Sonido",
  mirror:"Modo espejo"
 }[type]}</span></div>`;

 let html=back;

 if(type==="quality"){
  const qualities=getQualities();
  html+=`<div class="sub-option active" data-q="-1">Automática</div>`;
  qualities.forEach(q=>{
   html+=`<div class="sub-option" data-q="${q}">${q}p</div>`;
  });
 }

 if(type==="speed"){
  [
   [.25,"Muy lento"],
   [.5,"Lento"],
   [.75,"Más lento"],
   [1,"Normal"],
   [1.25,"Rápido"],
   [1.5,"Más rápido"],
   [2,"Muy rápido"]
  ].forEach(x=>{
   html+=`<div class="sub-option ${video.playbackRate===x[0]?"active":""}" data-speed="${x[0]}">${x[1]}</div>`;
  });
 }

 if(type==="aspect"){
  [
   ["contain","16:9"],
   ["43","4:3"],
   ["cover","Expandir"],
   ["fill","Estirar"]
  ].forEach(x=>{
   html+=`<div class="sub-option" data-aspect="${x[0]}">${x[1]}</div>`;
  });
 }

 if(type==="sound"){
  [
   ["normal","Normal"],
   ["bass","Aumento de bajos"],
   ["surround","Sonido envolvente"],
   ["spatial","Sonido espacial"]
  ].forEach(x=>{
   html+=`<div class="sub-option ${soundMode===x[0]?"active":""}" data-sound="${x[0]}">${x[1]}</div>`;
  });
 }

 if(type==="mirror"){
  html+=`<div class="sub-option ${!mirror?"active":""}" data-mirror="off">Desactivado</div>`;
  html+=`<div class="sub-option ${mirror?"active":""}" data-mirror="on">Activado</div>`;
 }

 submenu.innerHTML=html;

 $("backMenu").onclick=closeSubmenu;

 submenu.querySelectorAll("[data-q]").forEach(el=>{
  el.onclick=()=>{
   const q=Number(el.dataset.q);
   if(hls){
    if(q===-1)hls.currentLevel=-1;
    else{
     const i=hls.levels.findIndex(x=>Number(x.height)===q);
     if(i>=0)hls.currentLevel=i;
    }
   }
   $("qualityValue").textContent=q===-1?"Auto":q+"p";
   closeSubmenu();
  };
 });

 submenu.querySelectorAll("[data-speed]").forEach(el=>{
  el.onclick=()=>{
   video.playbackRate=Number(el.dataset.speed);
   $("speedValue").textContent=el.textContent;
   closeSubmenu();
  };
 });

 submenu.querySelectorAll("[data-aspect]").forEach(el=>{
  el.onclick=()=>{
   const a=el.dataset.aspect;
   video.style.objectFit=a==="43"?"contain":a==="cover"?"cover":a==="fill"?"fill":"contain";
   if(a==="43")video.style.aspectRatio="4/3";
   else video.style.aspectRatio="16/9";
   $("aspectValue").textContent=el.textContent;
   closeSubmenu();
  };
 });

 submenu.querySelectorAll("[data-sound]").forEach(el=>{
  el.onclick=()=>{
   soundMode=el.dataset.sound;
   $("soundValue").textContent=el.textContent;
   applySoundMode();
   closeSubmenu();
  };
 });

 submenu.querySelectorAll("[data-mirror]").forEach(el=>{
  el.onclick=()=>{
   mirror=el.dataset.mirror==="on";
   video.style.transform=mirror?"scaleX(-1)":"scaleX(1)";

   closeSubmenu();

 });

function applySoundMode(){
 /*
  El navegador no permite crear un verdadero
  ecualizador multibanda con HTMLMediaElement
  sin Web Audio API.

  Aquí se usa Web Audio cuando está disponible.
  No se toca "muted".
 */
 if(soundMode==="normal"){
  resetAudio();
  return;
 }

 if(!audioContext){
  try{
   audioContext=new(window.AudioContext||window.webkitAudioContext)();
   sourceNode=audioContext.createMediaElementSource(video);
   gainNode=audioContext.createGain();
   bassFilter=audioContext.createBiquadFilter();
   sourceNode.connect(bassFilter);
   bassFilter.connect(gainNode);
   gainNode.connect(audioContext.destination);
  }catch(e){
   return;
  }
 }

 if(audioContext.state==="suspended")
  audioContext.resume();

 if(soundMode==="bass"){
  bassFilter.type="lowshelf";
  bassFilter.frequency.value=180;
  bassFilter.gain.value=7;
  gainNode.gain.value=1;
 }

 if(soundMode==="surround"){
  bassFilter.type="lowshelf";
  bassFilter.frequency.value=150;
  bassFilter.gain.value=3;
  gainNode.gain.value=1.05;
 }

 if(soundMode==="spatial"){
  bassFilter.type="peaking";
  bassFilter.frequency.value=1200;
  bassFilter.Q.value=.8;
  bassFilter.gain.value=3;
  gainNode.gain.value=1;
 }
}

let audioContext=null;
let sourceNode=null;
let gainNode=null;
let bassFilter=null;

function resetAudio(){
 if(bassFilter){
  bassFilter.type="lowshelf";
  bassFilter.frequency.value=180;
  bassFilter.gain.value=0;
 }
 if(gainNode)gainNode.gain.value=1;
}

player.addEventListener("click",e=>{
 if(locked)return;

 if(
  e.target.closest(".controls")||
  e.target.closest(".settings")||
  e.target.closest(".settings-menu")||
  e.target.closest(".center-controls")
 )return;

 const now=Date.now();

 if(now-lastTap<300){
  clearTimeout(clickTimer);

  const r=player.getBoundingClientRect();
  const x=e.clientX-r.left;

  if(x<r.width/2)seek(-10);
  else seek(10);

  lastTap=0;
  return;
 }

 lastTap=now;

 clickTimer=setTimeout(()=>{
  showControls();
 },310);
});

document.addEventListener("keydown",e=>{
 if(e.target===urlInput)return;
 if(currentType==="youtube"||currentType==="iframe")return;

 switch(e.key.toLowerCase()){
  case" ":
  case"k":
   e.preventDefault();
   video.paused?play():pause();
   break;

  case"arrowleft":
  case"j":
   e.preventDefault();
   seek(-10);
   break;

  case"arrowright":
  case"l":
   e.preventDefault();
   seek(10);
   break;

  case"arrowup":
   e.preventDefault();
   video.volume=Math.min(1,video.volume+.05);
   video.muted=false;
   updateMute();
   break;

  case"arrowdown":
   e.preventDefault();
   video.volume=Math.max(0,video.volume-.05);
   updateMute();
   break;

  case"m":
   video.muted=!video.muted;
   updateMute();
   break;

  case"f":
   e.preventDefault();
   $("fullscreenBtn").click();
   break;
 }
});

function getHistory(){
 try{
  const x=JSON.parse(localStorage.getItem("jeissonHistory")||"[]");
  return Array.isArray(x)?x:[];
 }catch{return[]}
}

function saveHistory(url){
 let h=getHistory().filter(x=>x.url!==url);
 h.unshift({url,name:videoName(url)});
 try{
  localStorage.setItem("jeissonHistory",JSON.stringify(h.slice(0,10)));
 }catch(e){}
 renderHistory();
}

function renderHistory(){
 history.innerHTML="";
 getHistory().forEach(x=>{
  const row=document.createElement("div");
  row.className="history-item";

  const name=document.createElement("span");
  name.className="history-name";
  name.textContent=x.name||videoName(x.url);

  const btn=document.createElement("button");
  btn.className="history-play";
  btn.textContent="▶";
  btn.onclick=()=>loadVideo(x.url);

  row.append(name,btn);
  history.appendChild(row);
 });
}

async function loadJsonTitle(){
 /*
  Busca metadata.json en la misma carpeta.
  Se aceptan:
  {"title":"Película"}
  {"nombre":"Película"}
  {"name":"Película"}
  {"pelicula":"Película"}
  {"movie":"Película"}
 */
 try{
  const r=await fetch("metadata.json",{cache:"no-store"});
  if(!r.ok)return;

  const data=await r.json();

  const title=
   data.title||
   data.nombre||
   data.name||
   data.pelicula||
   data.movie;

  if(title)
   movieTitle.textContent=title;
 }catch(e){}
}

const params=new URLSearchParams(location.search);
const initialUrl=params.get("v")||params.get("url");

renderHistory();
updateMute();
updateProgress();
loadJsonTitle();

if(initialUrl){
 try{
  loadVideo(decodeURIComponent(initialUrl));
 }catch{
  loadVideo(initialUrl);
 }
}

});
