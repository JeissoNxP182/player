<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de catálogo - JeissoNxP</title>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #140326;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #a855f7;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 24px;
      background: #a855f7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #estado {
      margin-top: 25px;
      white-space: pre-line;
      text-align: left;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
      background: #1e0735;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>Generador de catálogo</h1>

  <p>
    Genera automáticamente el archivo
    <strong>catalogo-index.json</strong>
  </p>

  <button id="generarBtn">
    Generar índice
  </button>

  <div id="estado">
    Listo para comenzar.
  </div>

<script>
"use strict";

const BASE_URL = "https://jeissonxp182.github.io/player/";

const REPOSITORIOS = {
  sagas: "sagas.json",
  peliculas: "peliculas.json",
  series: "series.json",
  anime: "anime.json",
  videos: "videos.json"
};

const boton = document.getElementById("generarBtn");
const estado = document.getElementById("estado");

function escribir(texto) {
  estado.textContent += "\n" + texto;
}

function descargarJSON(nombre, datos) {
  const contenido = JSON.stringify(datos, null, 2);
  const blob = new Blob([contenido], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");

  enlace.href = url;
  enlace.download = nombre;
  enlace.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function recorrerCatalogo(datos, archivo, indice, ruta = "") {
  if (!datos || typeof datos !== "object") return;

  if (Array.isArray(datos)) {
    datos.forEach((item, posicion) => {
      recorrerCatalogo(
        item,
        archivo,
        indice,
        `${ruta}[${posicion}]`
      );
    });

    return;
  }

  if (datos.id !== undefined && datos.id !== null) {
    const id = String(datos.id).trim();

    if (id) {
      if (!indice[id]) {
        indice[id] = {
          archivo,
          ruta
        };
      }
    }
  }

  for (const [clave, valor] of Object.entries(datos)) {
    if (clave === "id") continue;

    if (valor && typeof valor === "object") {
      recorrerCatalogo(
        valor,
        archivo,
        indice,
        ruta ? `${ruta}.${clave}` : clave
      );
    }
  }
}

async function cargarJSON(nombre) {
  const respuesta = await fetch(
    BASE_URL + nombre,
    {
      cache: "no-store"
    }
  );

  if (!respuesta.ok) {
    throw new Error(
      `${nombre}: HTTP ${respuesta.status}`
    );
  }

  return respuesta.json();
}

async function generarIndice() {
  boton.disabled = true;

  estado.textContent = "Generando índice...";

  const indice = {};
  let archivosCorrectos = 0;
  let archivosFallidos = 0;

  for (const [tipo, archivo] of Object.entries(REPOSITORIOS)) {
    try {
      escribir(`\nLeyendo ${archivo}...`);

      const datos = await cargarJSON(archivo);

      const antes = Object.keys(indice).length;

      recorrerCatalogo(
        datos,
        archivo,
        indice,
        tipo
      );

      const despues = Object.keys(indice).length;

      escribir(
        `✓ ${archivo}: ${despues - antes} IDs encontrados`
      );

      archivosCorrectos++;

    } catch (error) {
      archivosFallidos++;

      escribir(
        `✗ ${archivo}: ${error.message}`
      );
    }
  }

  const resultado = {
    version: 1,
    generado: new Date().toISOString(),
    total: Object.keys(indice).length,
    ids: indice
  };

  escribir(
    `\nTotal de IDs: ${resultado.total}`
  );

  escribir(
    `Archivos correctos: ${archivosCorrectos}`
  );

  escribir(
    `Archivos con error: ${archivosFallidos}`
  );

  descargarJSON(
    "catalogo-index.json",
    resultado
  );

  escribir(
    "\n✓ catalogo-index.json generado correctamente."
  );

  boton.disabled = false;
}

boton.addEventListener(
  "click",
  generarIndice
);
</script>

</body>
</html>
