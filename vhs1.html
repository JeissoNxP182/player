<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Película</title>
  
  <!-- Plyr.js (Estilos y Reproductor) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <!-- Google Cast SDK (Transmitir a la TV) -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    :root {
      --plyr-color-main: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .player-container {
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .plyr {
      height: 100%;
      width: 100%;
    }

    .seek-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .seek-feedback.left { left: 10%; }
    .seek-feedback.right { right: 10%; }
    .seek-feedback.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="player-container" id="playerWrapper">
    <!-- Indicadores de Salto (-10s / +10s) -->
    <div class="seek-feedback left" id="feedbackLeft">⏮ -10s</div>
    <div class="seek-feedback right" id="feedbackRight">+10s ⏭</div>

    <!-- Etiqueta nativa de Video -->
    <video id="player" playsinline controls preload="metadata"></video>
  </div>

  <script>
    // =========================================================
    // ⚙️ CONFIGURACIÓN DE TU PELÍCULA
    // =========================================================
    
    // PEGA AQUÍ EL LINK DIRECTO DE ARCHIVE.ORG QUE COPIASTE
    const LINK_VIDEO = "https://archive.org/download/vhs-1_202607/2012%20-%20VHS%20Las%20cr%C3%B3nicas%20del%20miedo.mp4"; 
    
    // Opcional: Link de la portada o poster
    const LINK_POSTER = "https://m.media-amazon.com/images/S/pv-target-images/2b1354e4eb010e86e07d4536dfa06322d07dfe41e38e51427b16a0387732467f.png";

    // =========================================================
    // REPRODUCTOR PLYR.JS
    // =========================================================

    document.addEventListener('DOMContentLoaded', () => {
      const videoElement = document.getElementById('player');
      const wrapper = document.getElementById('playerWrapper');
      const feedbackLeft = document.getElementById('feedbackLeft');
      const feedbackRight = document.getElementById('feedbackRight');

      if (LINK_POSTER) {
        videoElement.setAttribute('poster', LINK_POSTER);
      }

      if (LINK_VIDEO) {
        videoElement.src = LINK_VIDEO;
      }

      const plyrInstance = new Plyr(videoElement, {
        autoplay: false,
        controls: [
          'play-large', 'restart', 'play', 'progress', 'current-time', 
          'duration', 'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
        ],
        tooltips: { controls: true, seek: true },
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
      });

      // Doble Clic / Doble Toque (-10s izquierda / +10s derecha)
      let lastTap = 0;

      function showFeedback(element) {
        element.classList.add('show');
        setTimeout(() => element.classList.remove('show'), 500);
      }

      wrapper.addEventListener('click', (e) => {
        if (e.target.closest('.plyr__controls')) return;

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;

        if (tapLength < 300 && tapLength > 0) {
          const rect = wrapper.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const width = rect.width;
          const percentage = (clickX / width) * 100;

          if (plyrInstance) {
            if (percentage <= 35) {
              plyrInstance.rewind(10);
              showFeedback(feedbackLeft);
            } else if (percentage >= 65) {
              plyrInstance.forward(10);
              showFeedback(feedbackRight);
            }
          }
        }
        lastTap = currentTime;
      });

      // Inicialización de Google Cast (Transmitir a la TV)
      window.__onGCastApiAvailable = function(isAvailable) {
        if (isAvailable) {
          cast.framework.CastContext.getInstance().setOptions({
            receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
          });
        }
      };
    });
  </script>
</body>
</html>
