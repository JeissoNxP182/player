<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Película</title>
  
  <!-- Plyr.js -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

  <!-- Google Cast SDK -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    :root {
      --plyr-color-main: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0b0c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .player-container {
      width: 100%;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      position: relative;
    }

    .plyr {
      height: 100%;
      width: 100%;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 11, 12, 0.95);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      font-size: 15px;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .seek-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    .seek-feedback.left { left: 10%; }
    .seek-feedback.right { right: 10%; }
    .seek-feedback.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="player-container" id="playerWrapper">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner" id="spinner"></div>
      <p id="loadingText">Obteniendo enlace directo con la API...</p>
    </div>

    <div class="seek-feedback left" id="feedbackLeft">⏮ -10s</div>
    <div class="seek-feedback right" id="feedbackRight">+10s ⏭</div>

    <video id="player" playsinline controls preload="metadata"></video>
  </div>

  <script>
    // =========================================================
    // ⚙️ CONFIGURACIÓN DE TU CUENTA Y PELÍCULA
    // =========================================================
    
    const API_LOGIN = "e321bcab62b1cf179cf7"; // Tu usuario de API de Streamtape
    const API_KEY = "AAjvzj6wypuX3Mq";     // Tu contraseña/Key de API de Streamtape
    const STREAMTAPE_ID = "ZJqVe14JA9CKq9"; 
    const LINK_POSTER = "https://m.media-amazon.com/images/S/pv-target-images/2b1354e4eb010e86e07d4536dfa06322d07dfe41e38e51427b16a0387732467f.png";

    // =========================================================
    // LÓGICA CON API OFICIAL
    // =========================================================

    document.addEventListener('DOMContentLoaded', async () => {
      const videoElement = document.getElementById('player');
      const wrapper = document.getElementById('playerWrapper');
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');
      const spinner = document.getElementById('spinner');
      const feedbackLeft = document.getElementById('feedbackLeft');
      const feedbackRight = document.getElementById('feedbackRight');

      if (LINK_POSTER) {
        videoElement.setAttribute('poster', LINK_POSTER);
      }

      let plyrInstance = null;

      function initPlyr() {
        plyrInstance = new Plyr(videoElement, {
          autoplay: false,
          controls: [
            'play-large', 'restart', 'play', 'progress', 'current-time', 
            'duration', 'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
          ],
          tooltips: { controls: true, seek: true },
          speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
        });
      }

      async function consultarApiStreamtape(fileId) {
  const apiUrl = `https://api.streamtape.com/file/dnl?file=${fileId}&login=${API_LOGIN}&key=${API_KEY}`;
  
  // Lista de proxies de respaldo para saltar la restricción CORS de la API
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(apiUrl)}`
  ];

  for (const proxy of proxies) {
    try {
      const response = await fetch(proxy);
      if (!response.ok) continue;

      const data = await response.json();

      // Si Streamtape responde con éxito y trae la URL del MP4
      if (data && data.status === 200 && data.result && data.result.url) {
        return data.result.url;
      }
    } catch (e) {
      console.warn("Error con un proxy, intentando el siguiente...", e);
    }
  }

  return null;
      }
      
      }

      let freshUrl = await consultarApiStreamtape(STREAMTAPE_ID);

      if (freshUrl) {
        videoElement.src = freshUrl;
        initPlyr();
        loadingOverlay.style.opacity = "0";
        setTimeout(() => loadingOverlay.style.display = "none", 300);
      } else {
        spinner.style.display = "none";
        loadingText.innerHTML = "No se pudo obtener el enlace vía API.<br>Verifica tu API Login, API Key y la ID del video.";
      }

      // Doble Clic / Doble Toque (-10s / +10s)
      let lastTap = 0;

      function showFeedback(element) {
        element.classList.add('show');
        setTimeout(() => element.classList.remove('show'), 500);
      }

      wrapper.addEventListener('click', (e) => {
        if (e.target.closest('.plyr__controls')) return;

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;

        if (tapLength < 300 && tapLength > 0) {
          const rect = wrapper.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const width = rect.width;
          const percentage = (clickX / width) * 100;

          if (plyrInstance) {
            if (percentage <= 35) {
              plyrInstance.rewind(10);
              showFeedback(feedbackLeft);
            } else if (percentage >= 65) {
              plyrInstance.forward(10);
              showFeedback(feedbackRight);
            }
          }
        }
        lastTap = currentTime;
      });

      // Google Cast
      window.__onGCastApiAvailable = function(isAvailable) {
        if (isAvailable) {
          cast.framework.CastContext.getInstance().setOptions({
            receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
            autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
          });
        }
      };
    });
  </script>
</body>
</html>
