<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V/H/S/1 - Ver Película</title>
  
  <!-- Video.js CSS Core -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <!-- Google Cast SDK -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    :root {
      --vlc-purple: #8a2be2;
      --vlc-purple-dark: #5a189a;
      --vlc-purple-glow: rgba(138, 43, 226, 0.4);
      --vlc-bg: #0d0d11;
      --vlc-text: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--vlc-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--vlc-text);
    }

    .player-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* ESTILOS VLC PURPLE */
    .video-js {
      width: 100%;
      height: 100%;
      font-family: inherit;
    }

    .vjs-theme-vlc {
      color: var(--vlc-text);
    }

    /* Barra de control inferior */
    .vjs-theme-vlc .vjs-control-bar {
      background: linear-gradient(180deg, transparent 0%, rgba(13, 13, 17, 0.95) 100%);
      height: 48px;
      padding: 0 10px;
    }

    .vjs-theme-vlc .vjs-button:hover {
      color: #fff;
      text-shadow: 0 0 10px var(--vlc-purple);
    }

    /* Botón central morado */
    .vjs-theme-vlc .vjs-big-play-button {
      background-color: rgba(90, 24, 154, 0.8) !important;
      border: 2px solid var(--vlc-purple) !important;
      border-radius: 50% !important;
      width: 70px !important;
      height: 70px !important;
      line-height: 66px !important;
      margin-left: -35px !important;
      margin-top: -35px !important;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 20px var(--vlc-purple-glow);
    }

    .vjs-theme-vlc:hover .vjs-big-play-button {
      transform: scale(1.1);
      background-color: var(--vlc-purple) !important;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.8);
    }

    /* Barra de progreso */
    .vjs-theme-vlc .vjs-play-progress {
      background-color: var(--vlc-purple) !important;
      box-shadow: 0 0 10px var(--vlc-purple);
    }

    .vjs-theme-vlc .vjs-slider {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .vjs-vlc-btn {
      font-size: 13px !important;
      font-weight: bold;
      display: flex !important;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .vjs-menu-button-popup .vjs-menu .vjs-menu-content {
      background-color: rgba(20, 18, 28, 0.95) !important;
      border: 1px solid var(--vlc-purple);
      border-radius: 6px;
      padding: 5px 0;
    }

    .vjs-menu-item.vjs-selected, .vjs-menu-item:hover {
      background-color: var(--vlc-purple) !important;
      color: #fff !important;
    }

    /* Feedback de salto (+10s / -10s) */
    .seek-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(138, 43, 226, 0.85);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 10;
      box-shadow: 0 0 15px var(--vlc-purple-glow);
    }

    .seek-feedback.left { left: 10%; }
    .seek-feedback.right { right: 10%; }
    .seek-feedback.show { opacity: 1; transform: translateY(-50%) scale(1.05); }

    .toast-msg {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(20, 18, 28, 0.9);
      border: 1px solid var(--vlc-purple);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .toast-msg.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="player-wrapper" id="playerWrapper">
    <div class="seek-feedback left" id="feedbackLeft">⏮ -10s</div>
    <div class="seek-feedback right" id="feedbackRight">+10s ⏭</div>
    <div class="toast-msg" id="toastMsg">Cargando...</div>

    <!-- AQUÍ CONFIGURAS TU PORTADA (poster) Y TU VIDEO (src) -->
    <video 
      id="vlcPlayer" 
      class="video-js vjs-theme-vlc vjs-big-play-centered" 
      controls 
      preload="metadata" 
      playsinline
      poster="https://m.media-amazon.com/images/S/pv-target-images/2b1354e4eb010e86e07d4536dfa06322d07dfe41e38e51427b16a0387732467f.png">
      
      <!-- Si es MP4 pones type="video/mp4", si es m3u8 pones type="application/x-mpegURL" -->
      <source src="https://archive.org/download/vhs-1_202607/2012%20-%20VHS%20Las%20cr%C3%B3nicas%20del%20miedo.mp4" type="video/mp4">
    </video>
  </div>

  <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const wrapper = document.getElementById('playerWrapper');
      const toast = document.getElementById('toastMsg');
      const feedbackLeft = document.getElementById('feedbackLeft');
      const feedbackRight = document.getElementById('feedbackRight');

      function showToast(text, duration = 2000) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
      }

      const player = videojs('vlcPlayer', {
        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
        responsive: true,
        fluid: false,
        controlBar: {
          children: [
            'playToggle',
            'volumePanel',
            'currentTimeDisplay',
            'timeDivider',
            'durationDisplay',
            'progressControl',
            'playbackRateMenuButton',
            'pictureInPictureToggle',
            'fullscreenToggle'
          ]
        }
      });

      player.ready(() => {
        const controlBar = player.controlBar;

        // Botón +10s
        const forwardBtn = document.createElement('button');
        forwardBtn.className = 'vjs-control vjs-button vjs-vlc-btn';
        forwardBtn.innerHTML = '<span>+10s</span>';
        forwardBtn.onclick = () => {
          player.currentTime(player.currentTime() + 10);
          showFeedback(feedbackRight);
        };
        controlBar.el().insertBefore(forwardBtn, controlBar.playToggle.el().nextSibling);

        // Botón -10s
        const rewindBtn = document.createElement('button');
        rewindBtn.className = 'vjs-control vjs-button vjs-vlc-btn';
        rewindBtn.innerHTML = '<span>-10s</span>';
        rewindBtn.onclick = () => {
          player.currentTime(player.currentTime() - 10);
          showFeedback(feedbackLeft);
        };
        controlBar.el().insertBefore(rewindBtn, controlBar.playToggle.el());

        // Copiar Link
        const copyBtn = document.createElement('button');
        copyBtn.className = 'vjs-control vjs-button vjs-vlc-btn';
        copyBtn.innerHTML = '🔗';
        copyBtn.onclick = () => {
          const currentSrc = player.currentSrc();
          if (currentSrc) {
            navigator.clipboard.writeText(currentSrc);
            showToast("¡Enlace copiado!");
          }
        };
        controlBar.el().insertBefore(copyBtn, controlBar.fullscreenToggle.el());
      });

      // Doble Toque en pantalla (-10s / +10s)
      let lastTap = 0;
      function showFeedback(element) {
        element.classList.add('show');
        setTimeout(() => element.classList.remove('show'), 500);
      }

      wrapper.addEventListener('click', (e) => {
        if (e.target.closest('.vjs-control-bar')) return;
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          const rect = wrapper.getBoundingClientRect();
          const percentage = ((e.clientX - rect.left) / rect.width) * 100;
          if (percentage <= 35) {
            player.currentTime(player.currentTime() - 10);
            showFeedback(feedbackLeft);
          } else if (percentage >= 65) {
            player.currentTime(player.currentTime() + 10);
            showFeedback(feedbackRight);
          }
        }
        lastTap = currentTime;
      });
    });
  </script>
</body>
</html>
