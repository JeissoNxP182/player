<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Película Aleatoria</title>
  <style>
    body {
      background-color: #0f0f11;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1c1c24;
      border-radius: 12px;
      padding: 20px;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #2a2a36;
    }
    img {
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 8px;
    }
    h2 { margin: 15px 0 5px 0; font-size: 1.3rem; }
    p { color: #a0a0b0; font-size: 0.9rem; margin-bottom: 15px; }
    .btn {
      background: #e50914;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
      margin: 5px;
    }
    .btn:hover { background: #b80710; }
    .btn-play { background: #28a745; }
    .btn-play:hover { background: #218838; }
  </style>
</head>
<body>

  <div class="card" id="movieCard">
    <img id="poster" src="" alt="Portada" style="display:none;">
    <h2 id="title">¿Qué vemos hoy?</h2>
    <p id="info">Haz clic en el botón para seleccionar una película al azar.</p>
    <button class="btn" onclick="obtenerPeliAleatoria()">🎲 Sorpréndeme</button>
    <a id="watchLink" href="#" class="btn btn-play" style="display:none;">▶ Reproducir</a>
  </div>

  <script>
    const JSON_URL = 'peliculas.json';
    let peliculasLista = [];

    // Cargar JSON existente
    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {
        data.forEach(saga => {
          if (saga.peliculas) {
            peliculasLista.push(...saga.peliculas);
          }
        });
      })
      .catch(err => console.error('Error cargando películas:', err));

    function obtenerPeliAleatoria() {
      if (peliculasLista.length === 0) return;
      
      const peli = peliculasLista[Math.floor(Math.random() * peliculasLista.length)];
      
      document.getElementById('poster').src = peli.portada;
      document.getElementById('poster').style.display = 'block';
      document.getElementById('title').innerText = peli.titulo;
      document.getElementById('info').innerText = `${peli.ano || ''} • ${peli.duracion || ''}\n\n${peli.sinopsis || ''}`;
      
      const watchBtn = document.getElementById('watchLink');
      watchBtn.href = peli.url;
      watchBtn.style.display = 'inline-block';
    }
  </script>
</body>
</html>
