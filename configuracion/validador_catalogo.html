<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔍 Validador de catálogo | JeissoNxP</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0d0d;color:#eee;font-family:Arial,sans-serif;padding:20px}.c{max-width:900px;margin:auto}h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#aaa}.actions{text-align:center;margin:20px 0}button{background:#fff;color:#111;border:0;border-radius:10px;padding:12px 18px;font-weight:bold}.bar{height:8px;background:#292929;border-radius:9px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#eee}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.card,.panel{background:#171717;border:1px solid #292929;border-radius:12px;padding:14px;margin:10px 0}.card strong{display:block;font-size:22px;margin-top:5px}.ok{color:#70df87}.warn{color:#ffd166}.bad{color:#ff6b6b}.muted,.small{color:#aaa}.item{padding:8px 0;border-bottom:1px solid #292929;line-height:1.4}.item:last-child{border:0}</style></head><body><div class="c"><h1>🔍 Validador de catálogo</h1><p class="sub">JeissoNxP · revisa tus JSON sin modificar ningún archivo</p><div class="actions"><button id="run">▶ Ejecutar validación</button><div class="bar"><i id="bar"></i></div><div id="status" class="small">Pulsa el botón para comenzar.</div></div><div id="summary" class="summary"></div><div id="results"></div></div><script>
'use strict';
const FILES={peliculas:'datos/peliculas.json',series:'datos/series.json',anime:'datos/anime.json',videos:'datos/videos.json',sagas:'datos/sagas.json',indice:'configuracion/catalogo-index.json'};
const S={problems:[],warnings:[],ids:new Map(),urls:new Map(),totals:{}};const $=id=>document.getElementById(id);const txt=v=>v==null?'':String(v).trim();const validUrl=v=>/^https?:\/\//i.test(txt(v));
function problem(type,file,msg){S.problems.push({type,file,msg})}function warning(file,msg){S.warnings.push({file,msg})}
function idCheck(id,file,path){id=txt(id);if(!id)return false;if(S.ids.has(id)){const a=S.ids.get(id);problem('ID duplicado',file,`"${id}" también aparece en ${a.file} (${a.path}).`);return true}S.ids.set(id,{file,path});return false}
function urlCheck(url,file,path){url=txt(url);if(!url)return;if(S.urls.has(url)){const a=S.urls.get(url);warning(file,`URL duplicada en ${path}; también aparece en ${a.file} (${a.path}).`)}else S.urls.set(url,{file,path})}
function item(x,file,path,needUrl=true){if(!x||typeof x!=='object'||Array.isArray(x))return 0;let n=0;if(txt(x.id)){idCheck(x.id,file,path);n++}else problem('ID faltante',file,`${path} no tiene "id".`);if(!txt(x.titulo))problem('Título faltante',file,`${path} no tiene "titulo".`);if(needUrl&&!validUrl(x.url))problem('URL inválida',file,`${path} no tiene una URL http/https válida.`);if(x.url)urlCheck(x.url,file,path);return n}
function generic(data,file,path='raíz'){if(Array.isArray(data))return data.reduce((n,x,i)=>n+generic(x,file,`${path}[${i}]`),0);if(!data||typeof data!=='object')return 0;let n=0;if('id'in data)n+=item(data,file,path,true);for(const[k,v]of Object.entries(data)){if(['id','titulo','url'].includes(k))continue;if(v&&typeof v==='object')n+=generic(v,file,`${path}.${k}`)}return n}
function sagas(data,file){if(!Array.isArray(data)){problem('Estructura',file,'El JSON de sagas debería ser un array.');return 0}let n=0;data.forEach((g,i)=>{const p=`saga[${i}]`;if(!txt(g?.saga))warning(file,`${p} no tiene nombre de saga.`);if(!Array.isArray(g?.peliculas)){problem('Estructura',file,`${p} no contiene un array "peliculas".`);return}g.peliculas.forEach((x,j)=>n+=item(x,file,`${p}.peliculas[${j}]`,true))});return n}
function series(data,file){if(!Array.isArray(data)){problem('Estructura',file,'El JSON debería ser un array.');return 0}let n=0;data.forEach((s,i)=>{const p=`serie[${i}]`;if(txt(s?.id)){idCheck(s.id,file,p);n++}else problem('ID faltante',file,`${p} no tiene "id".`);if(!txt(s?.titulo))problem('Título faltante',file,`${p} no tiene "titulo".`);if(!Array.isArray(s?.temporadas)){warning(file,`${p} no contiene "temporadas" como array.`);return}s.temporadas.forEach((t,ti)=>{if(!Array.isArray(t?.episodios)){warning(file,`${p}.temporadas[${ti}] no contiene "episodios" como array.`);return}t.episodios.forEach((e,ei)=>n+=item(e,file,`${p}.temporadas[${ti}].episodios[${ei}]`,true))})});return n}
function indexCheck(data,file){if(!data||typeof data!=='object'||!data.ids||typeof data.ids!=='object'){problem('Índice inválido',file,'No se encontró el objeto "ids".');return}S.totals.indice=Object.keys(data.ids).length;for(const[id,r]of Object.entries(data.ids)){if(!r||typeof r!=='object')problem('Referencia inválida',file,`"${id}" no tiene una referencia válida.`);else if(!txt(r.archivo))problem('Archivo faltante',file,`"${id}" no tiene "archivo".`)}}
async function load(f){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}
function summary(){const a=[['Problemas',S.problems.length,S.problems.length?'bad':'ok'],['Advertencias',S.warnings.length,S.warnings.length?'warn':'ok'],['IDs únicos',S.ids.size,'' ],['URLs revisadas',S.urls.size,'']];$('summary').innerHTML=a.map(x=>`<div class="card"><span class="muted">${x[0]}</span><strong class="${x[2]}">${x[1]}</strong></div>`).join('')}
function panel(title,cls,list){if(!list.length)return'';return`<div class="panel"><h2 class="${cls}">${title} (${list.length})</h2>${list.map(x=>`<div class="item"><b>${x.file}</b><br>${x.msg}</div>`).join('')}</div>`}
function results(){let h='';for(const[k,v]of Object.entries(S.totals))if(k!=='indice')h+=`<div class="panel"><h2>${k}.json</h2><div class="small">Elementos multimedia encontrados: <b>${v}</b></div></div>`;h+=panel('❌ Problemas que conviene corregir','bad',S.problems);h+=panel('⚠️ Advertencias para revisar','warn',S.warnings);if(!S.problems.length&&!S.warnings.length)h+='<div class="panel"><h2 class="ok">✅ Catálogo limpio</h2>La validación no encontró problemas en los elementos revisados.</div>';$('results').innerHTML=h}
async function run(){const b=$('run');b.disabled=true;S.problems=[];S.warnings=[];S.ids.clear();S.urls.clear();S.totals={};$('summary').innerHTML='';$('results').innerHTML='';const entries=Object.entries(FILES);for(let i=0;i<entries.length;i++){const[k,f]=entries[i];$('status').textContent=`Revisando ${f}...`;try{const d=await load(f);S.totals[k]=k==='sagas'?sagas(d,f):k==='series'||k==='anime'?series(d,f):k==='indice'?(indexCheck(d,f),S.totals.indice):generic(d,f)}catch(e){problem('Archivo no disponible',f,`No se pudo leer: ${e.message}`)}$('bar').style.width=`${Math.round((i+1)/entries.length*100)}%`}summary();results();$('status').textContent='✅ Validación terminada.';b.disabled=false}$('run').onclick=run;
</script></body></html>
