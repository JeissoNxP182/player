<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor Púrpura Móvil</title>

  <!-- HLS.js para reproducción de .m3u8 en móvil/web -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --purple-main: #9d4edd;
      --purple-accent: #c77dff;
      --purple-dark: #240046;
      --purple-bg: #0b0214;
      --purple-panel: rgba(28, 10, 48, 0.95);
      --text-light: #f7f0f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--purple-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR PARA COPIAR / PEGAR ENLACES */
    .url-bar-container {
      width: 100%;
      padding: 8px 12px;
      background: var(--purple-dark);
      border-bottom: 1px solid rgba(199, 125, 255, 0.2);
      display: flex;
      gap: 8px;
      z-index: 100;
      flex-shrink: 0;
    }

    .url-input {
      flex-grow: 1;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(199, 125, 255, 0.4);
      border-radius: 8px;
      padding: 0 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .url-input:focus {
      border-color: var(--purple-accent);
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-load {
      height: 40px;
      padding: 0 16px;
      background: var(--purple-main);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-load:active {
      transform: scale(0.96);
    }

    /* CONTENEDOR DEL VIDEO */
    .player-container {
      flex-grow: 1;
      width: 100%;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* BOTÓN PLAY CENTRADO */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(157, 78, 221, 0.9);
      border: 2px solid var(--purple-accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 12;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.6);
    }

    .center-play-btn svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .player-container.is-playing .center-play-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* NOTIFICACIÓN TOAST */
    .toast-msg {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--purple-panel);
      border: 1px solid var(--purple-accent);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      text-align: center;
      max-width: 90%;
    }

    .toast-msg.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- CONTENEDOR MÓVIL SUPERIOR -->
  <div class="url-bar-container">
    <input type="text" id="urlInput" class="url-input" placeholder="Pega tu enlace (.m3u8 o .mp4)..." />
    <button id="btnLoad" class="btn-load">Cargar</button>
  </div>

  <!-- CONTENEDOR REPRODUCTOR -->
  <div class="player-container" id="playerContainer">
    <video id="mainVideo" controls preload="metadata" playsinline webkit-playsinline></video>

    <button class="center-play-btn" id="centerPlayBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div class="toast-msg" id="toastMsg">Cargando...</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('mainVideo');
      const urlInput = document.getElementById('urlInput');
      const btnLoad = document.getElementById('btnLoad');
      const centerPlayBtn = document.getElementById('centerPlayBtn');
      const playerContainer = document.getElementById('playerContainer');
      const toastMsg = document.getElementById('toastMsg');

      let hlsInstance = null;

      function showToast(msg) {
        toastMsg.textContent = msg;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 3000);
      }

      function togglePlay() {
        if (video.paused) {
          video.play().catch(e => showToast('Pulsa Play para iniciar'));
        } else {
          video.pause();
        }
      }

      centerPlayBtn.addEventListener('click', togglePlay);

      video.addEventListener('play', () => playerContainer.classList.add('is-playing'));
      video.addEventListener('pause', () => playerContainer.classList.remove('is-playing'));

      function loadVideo(rawUrl) {
        if (!rawUrl) {
          showToast('Pega un enlace válido');
          return;
        }

        // Limpiar estados previos
        video.pause();
        video.removeAttribute('src');
        video.load();

        if (hlsInstance) {
          hlsInstance.destroy();
          hlsInstance = null;
        }

        showToast('Conectando al servidor...');

        // 1. Detección nativa para Safari / iOS o móviles con soporte directo de HLS
        if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = rawUrl;
          video.play().catch(() => showToast('Toca Play para reproducir'));
          return;
        }

        // 2. Carga por HLS.js con configuración limpia
        if (Hls.isSupported()) {
          hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            xhrSetup: function(xhr, url) {
              // Permite el paso directo de tokens sin bloquear peticiones cruzadas
              xhr.withCredentials = false;
            }
          });

          hlsInstance.loadSource(rawUrl);
          hlsInstance.attachMedia(video);

          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            showToast('Vídeo listo');
            video.play().catch(() => showToast('Toca Play para iniciar'));
          });

          hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  showToast('Error de red, reintentando...');
                  hlsInstance.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  showToast('Restaurando formato de vídeo...');
                  hlsInstance.recoverMediaError();
                  break;
                default:
                  showToast('El servidor bloqueó la conexión directa');
                  hlsInstance.destroy();
                  break;
              }
            }
          });
        } else {
          // Enlace MP4 directo
          video.src = rawUrl;
          video.play().catch(() => showToast('Toca Play para iniciar'));
        }
      }

      btnLoad.addEventListener('click', () => loadVideo(urlInput.value.trim()));
      
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadVideo(urlInput.value.trim());
      });
    });
  </script>
</body>
</html>
