<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colección de Películas - JeissoNxP182</title>
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-dark: #3b0764;
      --purple-deep: #0f031c;
      --silver-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #cbd5e1 100%);
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--purple-deep);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      margin-top: 10px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    /* BARRA DE BÚSQUEDA */
    .search-box {
      margin-top: 15px;
      width: 100%;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-box input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid rgba(168, 85, 247, 0.4);
      background: rgba(15, 3, 28, 0.8);
      color: #f8fafc;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .search-box input:focus {
      border-color: var(--purple-main);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      background: rgba(20, 3, 38, 0.95);
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ESTILO DE LAS CARPETAS (SAGAS) */
    details.folder {
      background: rgba(30, 9, 56, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    details.folder[open] {
      border-color: var(--purple-main);
      box-shadow: 0 4px 25px rgba(168, 85, 247, 0.15);
    }

    summary.folder-title {
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
      background: rgba(20, 3, 38, 0.6);
      user-select: none;
    }

    summary.folder-title::-webkit-details-marker {
      display: none;
    }

    .folder-icon {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arrow-icon {
      transition: transform 0.25s ease;
      fill: var(--purple-main);
    }

    details[open] .arrow-icon {
      transform: rotate(180deg);
    }

    /* CUADRÍCULA HORIZONTAL 16:9 */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      padding: 18px;
    }

    .movie-card {
      position: relative;
      background: rgba(20, 3, 38, 0.8);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #f8fafc;
      border: 1px solid rgba(168, 85, 247, 0.2);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: var(--purple-main);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
    }

    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f031c;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: relative;
      z-index: 2;
    }

    .no-poster {
      position: absolute;
      font-size: 32px;
      opacity: 0.4;
      z-index: 1;
    }

    .card-info {
      padding: 10px 8px;
      background: rgba(15, 3, 28, 0.95);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Colección de Películas</h1>
    <p class="subtitle">JeissoNxP182</p>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar película..." onkeyup="filterMovies()">
    </div>
  </header>

  <div class="container" id="catalogContainer">
    <!-- El catálogo se cargará aquí desde el JSON -->
  </div>

  <script>
    // ⬇️ REEMPLAZA ÚNICAMENTE LO QUE ESTÁ ENTRE COMILLAS POR TU ENLACE RAW DE GITHUB ⬇️
    const JSON_URL = 'https://raw.githubusercontent.com/JeissoNxP182/Peliculas/refs/heads/main/peliculas.json';

    let movieData = [];

    async function loadCatalog() {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '<p style="text-align:center; opacity:0.5; margin-top:20px;">Cargando catálogo...</p>';

      try {
        const response = await fetch(JSON_URL);
        if (!response.ok) throw new Error('Error al cargar JSON');
        movieData = await response.json();
        renderCatalog(movieData);
      } catch (error) {
        console.error(error);
        container.innerHTML = `<p style="text-align:center; color:#ef4444; margin-top:20px;">Error al cargar el catálogo. Verifica la dirección JSON_URL.</p>`;
      }
    }

    function renderCatalog(data) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      data.forEach(folder => {
        if (!folder.peliculas || folder.peliculas.length === 0) return;

        const detailsEl = document.createElement('details');
        detailsEl.className = 'folder';
        if (folder.abierta) detailsEl.setAttribute('open', 'true');

        detailsEl.innerHTML = `
          <summary class="folder-title">
            <div class="folder-icon">
              📁 <span>${folder.saga}</span>
            </div>
            <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </summary>
          <div class="movie-grid">
            ${folder.peliculas.map(movie => `
              <a href="${movie.url}" class="movie-card">
                <div class="poster-wrapper">
                  <img src="${movie.portada}" alt="${movie.titulo}" onerror="this.style.display='none'">
                  <span class="no-poster">🎬</span>
                </div>
                <div class="card-info">
                  <span>${movie.titulo}</span>
                </div>
              </a>
            `).join('')}
          </div>
        `;
        container.appendChild(detailsEl);
      });
    }

    function filterMovies() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase().trim();

      if (filter === '') {
        renderCatalog(movieData);
        return;
      }

      const filteredData = movieData.map(folder => {
        const matchingMovies = folder.peliculas.filter(movie => 
          movie.titulo.toLowerCase().includes(filter)
        );
        return { ...folder, peliculas: matchingMovies, abierta: true };
      }).filter(folder => folder.peliculas.length > 0);

      renderCatalog(filteredData);
    }

    window.onload = loadCatalog;
  </script>

</body>
</html>
