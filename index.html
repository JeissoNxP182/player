<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeissoNxP | Películas, Series, Vídeos & TV</title>
  <!-- METADATOS PARA COMPARTIR EN REDES SOCIALES -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="JeissoNxP | Películas, Series, Vídeos y TV 👽">
  <meta property="og:description" content="Mi Librería Personal">
  <meta id="ogImageMeta" property="og:image" content="https://img.magnific.com/fotos-premium/mujer-hombre-mascaras-monstruo-viendo-pelicula-palomitas-maiz-juntos_266732-44847.jpg?semt=ais_hybrid&w=740&q=80">
  <meta property="og:url" content="https://jeissonxp182.github.io/player/">

  <!-- TARJETAS PARA X (TWITTER) Y DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JeissoNxP | Películas, Series, Vídeos y TV 👽">
  <meta name="twitter:description" content="Mi Librería Personal">
  <meta id="twitterImageMeta" name="twitter:image" content="https://img.magnific.com/fotos-premium/mujer-hombre-mascaras-monstruo-viendo-pelicula-palomitas-maiz-juntos_266732-44847.jpg?semt=ais_hybrid&w=740&q=80">
  
  <style>
    :root {
      --bg-dark: #09070f;
      --card-bg: #130f1e;
      --card-hover: #1c162e;
      --accent-purple: #a855f7;
      --accent-glow: #7e22ce;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-purple: rgba(168, 85, 247, 0.25);
      --gold-fav: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* HEADER */
    header {
      padding: 25px 5% 15px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-purple);
      background: rgba(9, 7, 15, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .alien-emoji {
      font-size: 2.2rem;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.7));
    }
    
    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 600;
    }

    /* CONTROLES DE NAVEGACIÓN Y FILTROS */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 800px;
    }

    .nav-select, .filter-select {
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-purple);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-select:focus, .nav-select:hover,
    .filter-select:focus, .filter-select:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .nav-select option, .filter-select option {
      background: #120d1f;
      color: #ffffff;
    }

    /* BUSCADOR */
    .search-box {
      width: 100%;
      max-width: 550px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-purple);
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
    }
    
    /* CONTENEDOR PRINCIPAL */
    main {
      padding: 30px 5%;
    }

    .saga-section {
      margin-bottom: 25px;
      background: rgba(19, 15, 30, 0.4);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      overflow: hidden;
    }

    /* CABECERA ACORDEÓN DE SAGA */
    .saga-header {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: rgba(28, 22, 46, 0.6);
      user-select: none;
      transition: background 0.2s ease;
    }

    .saga-header:hover {
      background: rgba(126, 34, 206, 0.25);
    }

    .saga-title-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .folder-icon {
      font-size: 1.4rem;
    }

    .arrow-icon {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--accent-purple);
    }

    .saga-section.collapsed .arrow-icon {
      transform: rotate(-90deg);
    }

    .saga-content {
      padding: 20px;
      transition: all 0.3s ease;
    }

    .saga-section.collapsed .saga-content {
      display: none;
    }

    /* GRID HORIZONTAL (16:9) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
      box-shadow: 0 10px 25px rgba(126, 34, 206, 0.35);
      background: var(--card-hover);
    }

    /* BOTÓN FAVORITO EN LA TARJETA */
    .card-fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(9, 7, 15, 0.75);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      z-index: 5;
      transition: all 0.2s ease;
    }

    .card-fav-btn:hover {
      transform: scale(1.15);
      background: rgba(168, 85, 247, 0.4);
    }

    .card-fav-btn.active {
      color: var(--gold-fav);
      border-color: var(--gold-fav);
      text-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
    }

    /* MARCO 16:9 HORIZONTAL */
    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      font-weight: 600;
    }

    /* MODAL CINEMÁTICO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #120d1f;
      border: 1px solid var(--border-purple);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(126, 34, 206, 0.3);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-details {
      padding: 25px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover {
      background: var(--accent-purple);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      color: #ffffff;
      border: 1px solid var(--border-purple);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-description {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    /* BOTONES ACCIÓN MODAL */
    .modal-actions {
      display: flex;
      gap: 12px;
    }

    .btn-play {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      display: block;
      cursor: pointer;
      border: none;
    }

    .btn-play:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    .btn-fav-modal {
      background: rgba(28, 22, 46, 0.8);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-fav-modal:hover {
      border-color: var(--gold-fav);
      background: rgba(234, 179, 8, 0.15);
    }

    .btn-fav-modal.active {
      border-color: var(--gold-fav);
      color: var(--gold-fav);
      background: rgba(234, 179, 8, 0.2);
    }

    .clear-history-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .clear-history-btn:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
      .modal-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header id="mainHeader">
    <div class="brand">
      <div class="brand-title">
        <span class="alien-emoji">👽</span>
        <h1>JeissoNxP</h1>
      </div>
      <p>películas, series y vídeos</p>
    </div>
    
    <div class="controls-row">
      <select class="nav-select" id="sectionSelect" onchange="switchSection(this.value)">
        <option value="sagas" selected>📁 Sagas</option>
        <option value="peliculas">🎭 Películas</option>
        <option value="series">👀 Series</option>
        <option value="anime">🇯🇵 Anime</option>
        <option value="videos">📽️ Videos</option>
        <option value="tv">📺 TV Live</option>
        <option value="favoritos">⭐ Mi Lista</option>
        <option value="historial">🕒 Continuar Viendo</option>
      </select>

      <!-- OPCIÓN 4: SELECCIÓN DE ORDENAMIENTO Y FILTRO -->
      <select class="filter-select" id="sortSelect" onchange="filterCatalog()">
        <option value="default">🔀 Orden Predeterminado</option>
        <option value="az">🔤 Título (A - Z)</option>
        <option value="za">🔤 Título (Z - A)</option>
        <option value="newest">📅 Más Recientes</option>
        <option value="oldest">📅 Más Antiguos</option>
      </select>
    </div>
  
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar título, año o saga..." oninput="filterCatalog()">
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Se cargan dinámicamente -->
  </main>

  <!-- MODAL CINEMÁTICO -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Portada">
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-tags" id="modalTagsContainer">
          <span id="modalYear" class="tag"></span>
          <span id="modalDuration" class="tag"></span>
          <span id="modalDirector" class="tag" style="display:none;"></span>
          <span id="modalTotalCap" class="tag" style="display:none;"></span>
        </div>
        <p id="modalSinopsis" class="modal-description"></p>
        
        <div class="modal-actions">
          <button id="modalPlayBtn" class="btn-play" onclick="launchPlayer()">▶ REPRODUCIR AHORA</button>
          <button id="modalFavBtn" class="btn-fav-modal" onclick="toggleFavoriteFromModal()">⭐ Mi Lista</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const REPOSITORIOS_URLS = {
      sagas: "https://jeissonxp182.github.io/player/sagas.json",
      peliculas: "https://jeissonxp182.github.io/player/peliculas.json",
      series: "https://jeissonxp182.github.io/player/series.json",
      anime: "https://jeissonxp182.github.io/player/anime.json",
      videos: "https://jeissonxp182.github.io/player/videos.json",
      tv: "https://iptv-org.github.io/iptv/index.m3u"
    };

    let LOCAL_CATALOG = {
      sagas: [],
      peliculas: [],
      series: [],
      anime: [],
      videos: [],
      tv: [],
      favoritos: [],
      historial: []
    };

    let currentSectionKey = 'sagas';
    let targetHtmlUrl = '';
    let currentSerieData = null;
    let currentSeasonData = null;
    let currentActiveItem = null; // Para control de favoritos e historial en modal

    // --- OPCIÓN 3: GESTIÓN DE FAVORITOS EN LOCALSTORAGE ---
    function getFavoritesStorage() {
      return JSON.parse(localStorage.getItem('jeissonxp_favorites') || '[]');
    }

    function isFavorite(id) {
      if (!id) return false;
      const favs = getFavoritesStorage();
      return favs.some(item => item.id === id || item.idEpisodio === id);
    }

    function toggleFavorite(item, event) {
      if (event) event.stopPropagation();
      let favs = getFavoritesStorage();
      const itemId = item.id || item.idEpisodio;
      
      if (!itemId) return;

      const index = favs.findIndex(i => (i.id === itemId || i.idEpisodio === itemId));
      if (index >= 0) {
        favs.splice(index, 1);
      } else {
        favs.push(item);
      }

      localStorage.setItem('jeissonxp_favorites', JSON.stringify(favs));

      // Si estamos viendo la sección de favoritos, refrescar catálogo
      if (currentSectionKey === 'favoritos') {
        loadSection('favoritos');
      } else {
        filterCatalog();
      }

      // Actualizar modal si está abierto
      if (currentActiveItem && (currentActiveItem.id === itemId || currentActiveItem.idEpisodio === itemId)) {
        updateModalFavButton();
      }
    }

    function toggleFavoriteFromModal() {
      if (currentActiveItem) {
        toggleFavorite(currentActiveItem);
      }
    }

    function updateModalFavButton() {
      const favBtn = document.getElementById('modalFavBtn');
      if (!currentActiveItem) {
        favBtn.style.display = 'none';
        return;
      }
      favBtn.style.display = 'flex';
      const active = isFavorite(currentActiveItem.id || currentActiveItem.idEpisodio);
      if (active) {
        favBtn.classList.add('active');
        favBtn.innerHTML = '★ En Mi Lista';
      } else {
        favBtn.classList.remove('active');
        favBtn.innerHTML = '☆ + Mi Lista';
      }
    }

    // --- OPCIÓN 2: GESTIÓN DE HISTORIAL ("CONTINUAR VIENDO") ---
    function getHistoryStorage() {
      return JSON.parse(localStorage.getItem('jeissonxp_history') || '[]');
    }

    function saveToHistory(item) {
      if (!item) return;
      let history = getHistoryStorage();
      const itemId = item.id || item.idEpisodio;

      // Filtrar elemento previo duplicado
      history = history.filter(i => (i.id !== itemId && i.idEpisodio !== itemId));

      // Agregar al inicio con timestamp
      const historyItem = {
        ...item,
        vistoEl: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
      };

      history.unshift(historyItem);
      // Mantener máximo 30 elementos en historial
      if (history.length > 30) history.pop();

      localStorage.setItem('jeissonxp_history', JSON.stringify(history));
    }

    function clearHistory() {
      if (confirm("¿Deseas borrar todo tu historial de reproducción?")) {
        localStorage.removeItem('jeissonxp_history');
        loadSection('historial');
      }
    }

    function formatDuration(dur) {
      if (!dur) return '';
      return dur.replace(/(\d+h):?(\d+m)/, '$1:$2');
    }

    function updateSocialMeta(items) {
      let firstImage = '';
      if (items && items.length > 0) {
        const item = items[0];
        if (item.portada) firstImage = item.portada;
        else if (item.poster) firstImage = item.poster;
        else if (item.miniatura) firstImage = item.miniatura;
        else if (item.peliculas && item.peliculas.length > 0) {
          firstImage = item.peliculas[0].portada || item.peliculas[0].poster || item.peliculas[0].miniatura || '';
        }
      }

      if (firstImage) {
        document.getElementById('ogImageMeta').setAttribute('content', firstImage);
        document.getElementById('twitterImageMeta').setAttribute('content', firstImage);
      }
    }

    async function cargarSeccionRemota(sectionKey) {
      const container = document.getElementById('catalogContainer');
      
      // Manejo especial de Favoritos e Historial (LocalStorage)
      if (sectionKey === 'favoritos') {
        const favs = getFavoritesStorage();
        LOCAL_CATALOG.favoritos = favs;
        renderCatalog(favs);
        return favs;
      }

      if (sectionKey === 'historial') {
        const hist = getHistoryStorage();
        LOCAL_CATALOG.historial = hist;
        renderCatalog(hist);
        return hist;
      }

      if (LOCAL_CATALOG[sectionKey] && LOCAL_CATALOG[sectionKey].length > 0) {
        renderCatalog(LOCAL_CATALOG[sectionKey]);
        updateSocialMeta(LOCAL_CATALOG[sectionKey]);
        return LOCAL_CATALOG[sectionKey];
      }

      container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Cargando contenido...</p>';

      try {
        const respuesta = await fetch(REPOSITORIOS_URLS[sectionKey]);
        if (!respuesta.ok) throw new Error("No se pudo conectar con el repositorio");
        
        let data;
        if (sectionKey === 'tv') {
          const textoM3U = await respuesta.text();
          data = parsearM3U(textoM3U);
        } else {
          data = await respuesta.json();
        }

        LOCAL_CATALOG[sectionKey] = data;
        renderCatalog(data);
        updateSocialMeta(data);
        return data;
      } catch (error) {
        console.error("Error al cargar la sección:", error);
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Próximamente más contenido en esta sección 🚀 (O error de conexión)</p>';
        return null;
      }
    }

    function parsearM3U(contenido) {
      const lineas = contenido.split('\n');
      const canales = [];
      let currentChannel = {};

      for (let i = 0; i < lineas.length; i++) {
        let linea = lineas[i].trim();

        if (linea.startsWith('#EXTINF:')) {
          const parts = linea.split(',');
          const titulo = parts[parts.length - 1] || "Canal sin nombre";
          
          let logoMatch = linea.match(/tvg-logo="([^"]+)"/);
          let portada = logoMatch ? logoMatch[1] : '';

          currentChannel = {
            id: 'tv_' + Math.random().toString(36).substring(2, 9),
            titulo: titulo,
            portada: portada,
            ano: "En Directo",
            duracion: "LIVE",
            sinopsis: "Transmisión de televisión en vivo."
          };
        } else if (linea && !linea.startsWith('#')) {
          currentChannel.urlVideo = linea;
          if (currentChannel.titulo) {
            canales.push(currentChannel);
            currentChannel = {};
          }
        }
      }
      return canales;
    }

    function loadSection(sectionKey) {
      currentSectionKey = sectionKey;
      document.getElementById('sectionSelect').value = sectionKey;
      return cargarSeccionRemota(sectionKey);
    }

    function switchSection(sectionKey) {
      document.getElementById('searchInput').value = '';
      loadSection(sectionKey);
    }

    // --- GESTIÓN DE ENLACES DIRECTOS DESDE LA URL ---
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('peli') || urlParams.get('episodio') || urlParams.get('id');

      if (targetId) {
        const secciones = ['sagas', 'peliculas', 'series', 'anime', 'videos'];
        let encontrado = false;

        for (const sec of secciones) {
          const data = await loadSection(sec);
          if (!data) continue;

          if (sec === 'sagas') {
            for (const saga of data) {
              if (saga.peliculas) {
                const item = saga.peliculas.find(p => p.id === targetId);
                if (item) {
                  openModal(item);
                  encontrado = true;
                  break;
                }
              }
            }
          } else if (sec === 'series' || sec === 'anime') {
            for (const serie of data) {
              if (serie.id === targetId) {
                openSeriesModal(serie);
                encontrado = true;
                break;
              }
              if (serie.temporadas) {
                for (const temp of serie.temporadas) {
                  if (temp.episodios) {
                    const ep = temp.episodios.find(e => e.idEpisodio === targetId || e.id === targetId);
                    if (ep) {
                      currentSerieData = serie;
                      openEpisodeDetailsModal(ep, temp);
                      encontrado = true;
                      break;
                    }
                  }
                }
              }
              if (encontrado) break;
            }
          } else {
            const item = data.find(p => p.id === targetId);
            if (item) {
              openModal(item);
              encontrado = true;
              break;
            }
          }

          if (encontrado) break;
        }

        if (!encontrado) {
          console.warn("No se encontró ningún elemento con el ID especificado:", targetId);
          loadSection('sagas');
        }
      } else {
        loadSection('sagas');
      }
    });

    function createCardElement(item) {
      const formattedDur = formatDuration(item.duracion);
      const card = document.createElement('div');
      card.className = 'card';
      
      const itemId = item.id || item.idEpisodio;
      const favActive = isFavorite(itemId);

      if (currentSectionKey === 'series' || currentSectionKey === 'anime') {
        card.onclick = () => openSeriesModal(item);
      } else if (item.temporadas) { // Si viene desde Favoritos o Historial y es Serie
        card.onclick = () => openSeriesModal(item);
      } else {
        card.onclick = () => openModal(item);
      }

      card.innerHTML = `
        <button class="card-fav-btn ${favActive ? 'active' : ''}" title="${favActive ? 'Quitar de Mi Lista' : 'Agregar a Mi Lista'}">
          ${favActive ? '★' : '☆'}
        </button>
        <div class="poster-wrapper">
          <img src="${item.miniatura || item.portada || item.poster || item.imagen || ''}" alt="${item.titulo}" loading="lazy">
        </div>
        <div class="card-info">
          <div class="card-title">${item.titulo}</div>
          <div class="card-meta">
            ${item.ano ? item.ano : ''} 
            ${formattedDur ? '• ' + formattedDur : ''}
            ${item.vistoEl ? '<br><span style="color: var(--accent-purple); font-size:0.75rem;">🕒 Visto: ' + item.vistoEl + '</span>' : ''}
          </div>
        </div>
      `;

      // Evento para el botón de favorito de la tarjeta
      const favBtn = card.querySelector('.card-fav-btn');
      favBtn.onclick = (e) => toggleFavorite(item, e);

      return card;
    }

    function renderCatalog(items) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      if (currentSectionKey === 'historial' && items && items.length > 0) {
        const clearBtn = document.createElement('button');
        clearBtn.className = 'clear-history-btn';
        clearBtn.innerHTML = '🗑️ Limpiar Historial de Reproducción';
        clearBtn.onclick = clearHistory;
        container.appendChild(clearBtn);
      }

      if (!items || items.length === 0) {
        if (currentSectionKey === 'favoritos') {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Tu lista de favoritos está vacía. Guarda películas o series con la estrella ⭐.</p>';
        } else if (currentSectionKey === 'historial') {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Aún no has reproducido contenido recientemente 🕒.</p>';
        } else {
          container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Próximamente más contenido en esta sección 🚀</p>';
        }
        return;
      }

      let folderIcon = '📁';
      if (currentSectionKey === 'peliculas') folderIcon = '🎭';
      if (currentSectionKey === 'videos') folderIcon = '📽️';
      if (currentSectionKey === 'series') folderIcon = '👀';
      if (currentSectionKey === 'anime') folderIcon = '🇯🇵';
      if (currentSectionKey === 'tv') folderIcon = '📺';
      if (currentSectionKey === 'favoritos') folderIcon = '⭐';
      if (currentSectionKey === 'historial') folderIcon = '🕒';

      const esEstructuraSagas = items.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        items.forEach(saga => {
          if (!saga.peliculas || saga.peliculas.length === 0) return;

          const sagaSection = document.createElement('div');
          sagaSection.className = 'saga-section';
          if (!saga.abierta) {
            sagaSection.classList.add('collapsed');
          }

          const sagaHeader = document.createElement('div');
          sagaHeader.className = 'saga-header';
          sagaHeader.onclick = () => sagaSection.classList.toggle('collapsed');

          sagaHeader.innerHTML = `
            <div class="saga-title-content">
              <span class="folder-icon">${folderIcon}</span>
              <span>${saga.saga}</span>
            </div>
            <span class="arrow-icon">▼</span>
          `;

          sagaSection.appendChild(sagaHeader);

          const sagaContent = document.createElement('div');
          sagaContent.className = 'saga-content';

          const grid = document.createElement('div');
          grid.className = 'grid-container';

          saga.peliculas.forEach(peli => {
            grid.appendChild(createCardElement(peli));
          });

          sagaContent.appendChild(grid);
          sagaSection.appendChild(sagaContent);
          container.appendChild(sagaSection);
        });
      } else {
        const grid = document.createElement('div');
        grid.className = 'grid-container';

        items.forEach(item => {
          grid.appendChild(createCardElement(item));
        });

        container.appendChild(grid);
      }
    }

    // --- OPCIÓN 4: FILTRADO AVANZADO Y ORDENAMIENTO EN TIEMPO REAL ---
    function sortItems(itemsList, sortOption) {
      if (!sortOption || sortOption === 'default') return itemsList;

      return [...itemsList].sort((a, b) => {
        const titleA = (a.titulo || '').toLowerCase();
        const titleB = (b.titulo || '').toLowerCase();
        const yearA = parseInt(a.ano) || 0;
        const yearB = parseInt(b.ano) || 0;

        if (sortOption === 'az') return titleA.localeCompare(titleB);
        if (sortOption === 'za') return titleB.localeCompare(titleA);
        if (sortOption === 'newest') return yearB - yearA;
        if (sortOption === 'oldest') return yearA - yearB;
        return 0;
      });
    }

    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortOption = document.getElementById('sortSelect').value;
      const items = LOCAL_CATALOG[currentSectionKey] || [];

      const esEstructuraSagas = items.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        const filtered = items.map(saga => {
          const matchesSaga = saga.saga ? saga.saga.toLowerCase().includes(query) : false;
          let filteredPelis = saga.peliculas.filter(peli => {
            const matchesTitle = peli.titulo ? peli.titulo.toLowerCase().includes(query) : false;
            const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
            return matchesTitle || matchesYear || matchesSaga;
          });

          filteredPelis = sortItems(filteredPelis, sortOption);
          return { ...saga, peliculas: filteredPelis };
        }).filter(saga => saga.peliculas.length > 0);

        renderCatalog(filtered);
      } else {
        let filtered = items.filter(item => {
          const matchesTitle = item.titulo ? item.titulo.toLowerCase().includes(query) : false;
          const matchesYear = item.ano ? item.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear;
        });

        filtered = sortItems(filtered, sortOption);
        renderCatalog(filtered);
      }
    }

    function openModal(peli) {
      currentActiveItem = peli;
      const formattedDur = formatDuration(peli.duracion);

      document.getElementById('modalImg').src = peli.miniatura || peli.portada || peli.poster || peli.imagen || '';
      document.getElementById('modalTitle').innerText = peli.titulo || 'Sin título';
      document.getElementById('modalYear').innerHTML = `📅 ${peli.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      
      const directorTag = document.getElementById('modalDirector');
      if (peli.director) {
        directorTag.innerHTML = `🎥 ${peli.director}`;
        directorTag.style.display = 'flex';
      } else {
        directorTag.style.display = 'none';
      }

      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible.';

      const tempContainer = document.getElementById('modalTemporadasContainer');
      if (tempContainer) tempContainer.style.display = 'none';
      document.getElementById('modalPlayBtn').style.display = 'block';

      updateModalFavButton();

      if (peli.id) {
        targetHtmlUrl = `reproductor.html?peli=${peli.id}`;
        history.replaceState(null, '', `?peli=${peli.id}`);
      } else if (peli.url_html && peli.url_html.includes('reproductor.html')) {
        targetHtmlUrl = peli.url_html;
      } else {
        const videoSrc = peli.urlVideo || peli.url_video || peli.video || peli.url || peli.enlace || peli.url_html || '';
        targetHtmlUrl = `reproductor.html?url=${encodeURIComponent(videoSrc)}&titulo=${encodeURIComponent(peli.titulo || 'Reproductor')}`;
      }

      document.getElementById('movieModal').style.display = 'flex';
    }

    function openSeriesModal(serie) {
      currentSerieData = serie;
      currentActiveItem = serie;
      currentSeasonData = null;
      const mainPoster = serie.miniatura || serie.poster || serie.portada || serie.imagen || '';
      const totalTemporadasCount = serie.temporadas ? serie.temporadas.length : 0;
      
      document.getElementById('modalImg').src = mainPoster;
      document.getElementById('modalTitle').innerText = serie.titulo || 'Sin título';
      document.getElementById('modalYear').innerHTML = `📅 ${serie.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `📁 ${totalTemporadasCount} temporada${totalTemporadasCount === 1 ? '' : 's'}`;
      
      if (serie.id) {
        history.replaceState(null, '', `?id=${serie.id}`);
      }

      const directorTag = document.getElementById('modalDirector');
      if (serie.director) {
        directorTag.innerHTML = `🎥 ${serie.director}`;
        directorTag.style.display = 'flex';
      } else {
        directorTag.style.display = 'none';
      }

      let totalCapsCount = 0;
      if (serie.temporadas) {
        serie.temporadas.forEach(t => {
          if (t.episodios) totalCapsCount += t.episodios.length;
        });
      }
      const totalCapTag = document.getElementById('modalTotalCap');
      if (totalCapsCount > 0) {
        totalCapTag.innerHTML = `🎬 ${totalCapsCount} caps totales`;
        totalCapTag.style.display = 'flex';
      } else {
        totalCapTag.style.display = 'none';
      }

      document.getElementById('modalSinopsis').innerText = serie.sinopsis || 'Sin descripción disponible general.';
      document.getElementById('modalPlayBtn').style.display = 'none';

      updateModalFavButton();

      let tempContainer = document.getElementById('modalTemporadasContainer');
      if (!tempContainer) {
        tempContainer = document.createElement('div');
        tempContainer.id = 'modalTemporadasContainer';
        tempContainer.style.marginTop = '20px';
        document.querySelector('.modal-details').appendChild(tempContainer);
      }

      tempContainer.style.display = 'block';
      tempContainer.innerHTML = ''; 

      if (serie.temporadas && serie.temporadas.length > 0) {
        serie.temporadas.forEach(temp => {
          const seasonBtn = document.createElement('button');
          seasonBtn.style.cssText = "display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 18px; margin-bottom: 10px; background: rgba(28, 22, 46, 0.7); border: 1px solid var(--border-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;";
          
          seasonBtn.onmouseover = () => {
            seasonBtn.style.background = 'rgba(126, 34, 206, 0.3)';
            seasonBtn.style.borderColor = 'var(--accent-purple)';
          };
          seasonBtn.onmouseout = () => {
            seasonBtn.style.background = 'rgba(28, 22, 46, 0.7)';
            seasonBtn.style.borderColor = 'var(--border-purple)';
          };

          const numCapsEnTemporada = temp.episodios ? temp.episodios.length : 0;
          seasonBtn.innerHTML = `📁 Temporada ${temp.numeroTemporada} <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal; margin-left:8px;">(${numCapsEnTemporada} cap${numCapsEnTemporada === 1 ? '' : 's'})</span> <span style="color:var(--accent-purple); font-size:1.1rem;">➔</span>`;

          seasonBtn.onclick = () => openSeasonEpisodesView(temp);

          tempContainer.appendChild(seasonBtn);
        });
      } else {
        tempContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No hay temporadas registradas aún.</p>`;
      }

      document.getElementById('movieModal').style.display = 'flex';
    }

    function openSeasonEpisodesView(temp) {
      currentSeasonData = temp;
      const seasonPoster = temp.miniatura || temp.imagen || temp.portada || temp.poster || currentSerieData.miniatura || currentSerieData.portada || currentSerieData.poster || '';

      document.getElementById('modalImg').src = seasonPoster;
      document.getElementById('modalTitle').innerText = `${currentSerieData.titulo} - Temporada ${temp.numeroTemporada}`;
      document.getElementById('modalYear').innerHTML = `📅 T${temp.numeroTemporada} (${temp.ano || currentSerieData.ano || 'S/A'})`;
      
      const numCaps = temp.episodios ? temp.episodios.length : 0;
      document.getElementById('modalDuration').innerHTML = `🎬 ${numCaps} episodio${numCaps === 1 ? '' : 's'}`;
      document.getElementById('modalDirector').style.display = 'none';
      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = temp.sinopsis || `Selecciona un capítulo de la temporada ${temp.numeroTemporada} para ver sus detalles.`;
      document.getElementById('modalPlayBtn').style.display = 'none';

      let tempContainer = document.getElementById('modalTemporadasContainer');
      tempContainer.innerHTML = '';

      const backBtn = document.createElement('button');
      backBtn.style.cssText = "display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4)); border: 1px solid var(--accent-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);";
      
      backBtn.onmouseover = () => {
        backBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(126, 34, 206, 0.6))';
      };
      backBtn.onmouseout = () => {
        backBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4))';
      };

      backBtn.innerHTML = `⬅️ Volver a los detalles de la serie`;
      backBtn.onclick = () => openSeriesModal(currentSerieData);
      tempContainer.appendChild(backBtn);

      const epsListDiv = document.createElement('div');
      epsListDiv.style.cssText = "display: flex; flex-direction: column; gap: 8px;";

      if (temp.episodios && temp.episodios.length > 0) {
        temp.episodios.forEach(ep => {
          const epBtn = document.createElement('button');
          epBtn.style.cssText = "display: block; width: 100%; text-align: left; background: rgba(13, 10, 20, 0.8); border: 1px solid var(--border-purple); color: var(--text-main); padding: 12px 15px; cursor: pointer; border-radius: 8px; font-size: 0.95rem; font-weight: 600; transition: all 0.2s;";
          
          epBtn.onmouseover = () => {
            epBtn.style.background = 'rgba(168, 85, 247, 0.25)';
            epBtn.style.borderColor = 'var(--accent-purple)';
          };
          epBtn.onmouseout = () => {
            epBtn.style.background = 'rgba(13, 10, 20, 0.8)';
            epBtn.style.borderColor = 'var(--border-purple)';
          };
          
          const numEpFormatted = String(ep.numeroEpisodio).padStart(2, '0');
          epBtn.innerHTML = `▶️ EP ${numEpFormatted} - ${ep.titulo} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal; float:right;">${ep.duracion || ''}</span>`;
          
          epBtn.onclick = () => openEpisodeDetailsModal(ep, temp);

          epsListDiv.appendChild(epBtn);
        });
      } else {
        epsListDiv.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 15px;">No hay capítulos registrados para esta temporada aún.</p>`;
      }

      tempContainer.appendChild(epsListDiv);
    }

    function openEpisodeDetailsModal(ep, temp) {
      currentActiveItem = ep;
      const epPoster = ep.miniatura || ep.imagen || ep.img || ep.portada || ep.poster || temp.miniatura || temp.imagen || temp.portada || temp.poster || (currentSerieData && currentSerieData.miniatura) || '';
      
      const formattedDur = formatDuration(ep.duracion);
      const numEpFormatted = String(ep.numeroEpisodio).padStart(2, '0');

      document.getElementById('modalImg').src = epPoster;
      document.getElementById('modalTitle').innerText = `${currentSerieData ? currentSerieData.titulo : ''} - T${temp.numeroTemporada} EP ${numEpFormatted}: ${ep.titulo}`;
      document.getElementById('modalYear').innerHTML = `📅 ${ep.ano || temp.ano || (currentSerieData ? currentSerieData.ano : 'S/A')}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      
      document.getElementById('modalDirector').style.display = 'none';
      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = ep.sinopsis || 'Sin descripción disponible para este episodio.';

      updateModalFavButton();

      let tempContainer = document.getElementById('modalTemporadasContainer');
      tempContainer.innerHTML = '';

      const backToSeasonBtn = document.createElement('button');
      backToSeasonBtn.style.cssText = "display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4)); border: 1px solid var(--accent-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);";
      
      backToSeasonBtn.onmouseover = () => {
        backToSeasonBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(126, 34, 206, 0.6))';
      };
      backToSeasonBtn.onmouseout = () => {
        backToSeasonBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4))';
      };

      backToSeasonBtn.innerHTML = `⬅️ Volver a la lista de episodios`;
      backToSeasonBtn.onclick = () => openSeasonEpisodesView(temp);
      tempContainer.appendChild(backToSeasonBtn);

      const playEpBtn = document.createElement('button');
      playEpBtn.className = 'btn-play';
      playEpBtn.innerHTML = `▶ REPRODUCIR AHORA`;
      
      const epId = ep.idEpisodio || ep.id;
      if (epId) {
        history.replaceState(null, '', `?episodio=${epId}`);
      }

      playEpBtn.onclick = () => {
        saveToHistory(ep);
        if (epId) {
          targetHtmlUrl = `reproductor.html?episodio=${epId}`;
        } else {
          const epVideoSrc = ep.urlVideo || ep.url_video || ep.video || ep.url || ep.enlace || '';
          targetHtmlUrl = `reproductor.html?url=${encodeURIComponent(epVideoSrc)}&titulo=${encodeURIComponent((currentSerieData ? currentSerieData.titulo : '') + " - T" + temp.numeroTemporada + " Ep " + ep.numeroEpisodio)}`;
        }
        launchPlayer();
      };
      
      tempContainer.appendChild(playEpBtn);
      
      document.getElementById('movieModal').style.display = 'flex';
    }

    function launchPlayer() {
      if (!targetHtmlUrl) return;

      // Guardar en historial al hacer clic en reproducir
      if (currentActiveItem) {
        saveToHistory(currentActiveItem);
      }

      if (currentSectionKey === 'tv' && targetHtmlUrl.includes('http://') && !targetHtmlUrl.includes('https://')) {
        const abrirAfuera = confirm("Este canal utiliza un protocolo HTTP no cifrado. Los navegadores web suelen bloquearlo internamente por seguridad.\n\n¿Deseas abrirlo de todas formas en una pestaña independiente?");
        if (abrirAfuera) {
          const urlMatch = targetHtmlUrl.match(/video=([^&]+)/);
          if (urlMatch && urlMatch[1]) {
            window.open(decodeURIComponent(urlMatch[1]), '_blank');
          }
        }
        return;
      }

      window.location.href = targetHtmlUrl;
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
      const tempContainer = document.getElementById('modalTemporadasContainer');
      if (tempContainer) tempContainer.style.display = 'block';
      currentSerieData = null;
      currentSeasonData = null;
      currentActiveItem = null;
      history.replaceState(null, '', window.location.pathname);
    }
  </script>
