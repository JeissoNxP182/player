<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Películas - JeissoNxP182</title>
  <style>
    :root {
      --purple-main: #a855f7;
      --purple-dark: #3b0764;
      --purple-deep: #0f031c;
      --silver-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #cbd5e1 100%);
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--purple-deep);
      color: var(--text-color);
      min-height: 100vh;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      margin-top: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ESTILO DE LAS CARPETAS (SAGAS) */
    details.folder {
      background: rgba(30, 9, 56, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 14px;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    details.folder[open] {
      border-color: var(--purple-main);
      box-shadow: 0 4px 25px rgba(168, 85, 247, 0.15);
    }

    summary.folder-title {
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
      background: rgba(20, 3, 38, 0.6);
      user-select: none;
    }

    summary.folder-title::-webkit-details-marker {
      display: none;
    }

    .folder-icon {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arrow-icon {
      transition: transform 0.25s ease;
      fill: var(--purple-main);
    }

    details[open] .arrow-icon {
      transform: rotate(180deg);
    }

    /* 1. CUADRÍCULA UN POCO MÁS ANCHA PARA PORTADAS HORIZONTALES */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Aumentamos el ancho mínimo */
      gap: 16px;
      padding: 18px;
    }

    /* TARJETA DE CADA PELÍCULA */
    .movie-card {
      position: relative;
      background: rgba(20, 3, 38, 0.8);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #f8fafc;
      border: 1px solid rgba(168, 85, 247, 0.2);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: translateY(-6px) scale(1.03);
      border-color: var(--purple-main);
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.35);
    }

    /* CONTENEDOR 16:9 HORIZONTAL */
    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0f031c; /* Fondo oscuro ajustado al tema */
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* ¡Clave! Muestra la imagen ENTERA sin cortar nada */
      position: relative;
      z-index: 2; /* Pone la imagen por encima del icono para ocultarlo */
    }

    /* SILUETA/ICONO SOLO SI NO HAY IMAGEN */
    .no-poster {
      position: absolute;
      font-size: 32px;
      opacity: 0.4;
      z-index: 1; /* Queda detrás de la imagen */
    }

    /* TÍTULO DE LA PELÍCULA BAJO EL PÓSTER */
    .card-info {
      padding: 10px 8px;
      background: rgba(15, 3, 28, 0.95);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>Mis Peliculas</h1>
    <p class="subtitle">JeissoNxP182</p>
  </header>

  <div class="container">

</body>
</html>
