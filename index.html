<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeissoNxP | Películas, Series y Vídeos</title>
  <style>
    :root {
      --bg-dark: #09070f;
      --card-bg: #130f1e;
      --card-hover: #1c162e;
      --accent-purple: #a855f7;
      --accent-glow: #7e22ce;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-purple: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* HEADER */
    header {
      padding: 25px 5% 15px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-purple);
      background: rgba(9, 7, 15, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 600;
    }

    /* BOTONES DE NAVEGACIÓN */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 5px;
    }

    .nav-btn {
      background: rgba(19, 15, 30, 0.8);
      color: var(--text-main);
      border: 1px solid var(--border-purple);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    /* BUSCADOR */
    .search-box {
      width: 100%;
      max-width: 550px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-purple);
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      padding: 30px 5%;
    }

    .saga-section {
      margin-bottom: 25px;
      background: rgba(19, 15, 30, 0.4);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      overflow: hidden;
    }

    /* CABECERA ACORDEÓN DE SAGA */
    .saga-header {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: rgba(28, 22, 46, 0.6);
      user-select: none;
      transition: background 0.2s ease;
    }

    .saga-header:hover {
      background: rgba(126, 34, 206, 0.25);
    }

    .saga-title-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .folder-icon {
      font-size: 1.4rem;
    }

    .arrow-icon {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--accent-purple);
    }

    .saga-section.collapsed .arrow-icon {
      transform: rotate(-90deg);
    }

    .saga-content {
      padding: 20px;
      transition: all 0.3s ease;
    }

    .saga-section.collapsed .saga-content {
      display: none;
    }

    /* GRID HORIZONTAL (16:9) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
      box-shadow: 0 10px 25px rgba(126, 34, 206, 0.35);
      background: var(--card-hover);
    }

    /* MARCO 16:9 HORIZONTAL */
    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Encaja exacta sin cortarse */
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      font-weight: 600;
    }

    /* MODAL CINEMÁTICO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #120d1f;
      border: 1px solid var(--border-purple);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(126, 34, 206, 0.3);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Sin imagen cortada en el modal */
    }

    .modal-details {
      padding: 25px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover {
      background: var(--accent-purple);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-tags {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      color: #ffffff;
      border: 1px solid var(--border-purple);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-description {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      display: block;
    }

    .btn-play:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>JeissoNxP</h1>
      <p>películas, series y vídeos</p>
    </div>

        <div class="nav-dropdown-container">
      <select class="nav-select" id="sectionSelect">
        <option value="sagas" selected>📁 Sagas</option>
        <option value="peliculas">🎬 Películas</option>
        <option value="series">📺 Series</option>
        <option value="anime">⛩️ Anime</option>
        <option value="videos">📹 Videos</option>
      </select>
        </div>
  
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar título, año o saga..." oninput="filterCatalog()">
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Se cargan dinámicamente las películas -->
  </main>

  <!-- MODAL -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Portada">
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-tags">
          <span id="modalYear" class="tag"></span>
          <span id="modalDuration" class="tag"></span>
        </div>
        <p id="modalSinopsis" class="modal-description"></p>
        <a id="modalPlayBtn" href="#" class="btn-play">▶ REPRODUCIR AHORA</a>
      </div>
    </div>
  </div>

  <script>
    const JSON_URLS = [
      'https://jeissonxp182.github.io/peliculas/vhs.json',
      'https://jeissonxp182.github.io/peliculas/invicto.json'
    ];

    let allSagasData = [];

    // Helper para formato de duración: "01h34m" -> "01h:34m"
    function formatDuration(dur) {
      if (!dur) return '';
      return dur.replace(/(\d+h)(\d+m)/, '$1:$2');
    }

    Promise.all(JSON_URLS.map(url => fetch(url).then(res => res.json())))
      .then(resultados => {
        allSagasData = resultados.flat();
        renderCatalog(allSagasData);
      })
      .catch(err => {
        console.error('Error cargando JSONs:', err);
        document.getElementById('catalogContainer').innerHTML = 
          '<p style="text-align:center; color:var(--accent-purple); font-weight:bold; margin-top:40px;">Error al conectar con los catálogos.</p>';
      });

    function renderCatalog(sagas) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      let hasContent = false;

      sagas.forEach((saga, index) => {
        if (!saga.peliculas || saga.peliculas.length === 0) return;

        hasContent = true;
        
        const sagaSection = document.createElement('div');
        sagaSection.className = 'saga-section';

        // Cabecera Acordeón
        const sagaHeader = document.createElement('div');
        sagaHeader.className = 'saga-header';
        sagaHeader.onclick = () => sagaSection.classList.toggle('collapsed');

        sagaHeader.innerHTML = `
          <div class="saga-title-content">
            <span class="folder-icon">📁</span>
            <span>${saga.saga}</span>
          </div>
          <span class="arrow-icon">▼</span>
        `;

        sagaSection.appendChild(sagaHeader);

        // Contenido desplegable
        const sagaContent = document.createElement('div');
        sagaContent.className = 'saga-content';

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        saga.peliculas.forEach(peli => {
          const formattedDur = formatDuration(peli.duracion);

          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(peli);

          card.innerHTML = `
            <div class="poster-wrapper">
              <img src="${peli.portada}" alt="${peli.titulo}" loading="lazy">
            </div>
            <div class="card-info">
              <div class="card-title">${peli.titulo}</div>
              <div class="card-meta">${peli.ano || ''} ${formattedDur ? '• ' + formattedDur : ''}</div>
            </div>
          `;

          grid.appendChild(card);
        });

        sagaContent.appendChild(grid);
        sagaSection.appendChild(sagaContent);
        container.appendChild(sagaSection);
      });

      if (!hasContent) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No se encontraron títulos.</p>';
      }
    }

    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!query) {
        renderCatalog(allSagasData);
        return;
      }

      const filtered = allSagasData.map(saga => {
        const matchesSaga = saga.saga.toLowerCase().includes(query);
        const filteredPelis = saga.peliculas.filter(peli => {
          const matchesTitle = peli.titulo.toLowerCase().includes(query);
          const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear || matchesSaga;
        });

        return { ...saga, peliculas: filteredPelis };
      }).filter(saga => saga.peliculas.length > 0);

      renderCatalog(filtered);
    }

    function openModal(peli) {
      const formattedDur = formatDuration(peli.duracion);

      document.getElementById('modalImg').src = peli.portada;
      document.getElementById('modalTitle').innerText = peli.titulo;
      document.getElementById('modalYear').innerHTML = `📅 ${peli.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible.';
      document.getElementById('modalPlayBtn').href = peli.url;

      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
    }
  </script>
</body>
</html>
