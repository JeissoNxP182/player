<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Púrpura</title>

  <!-- Video.js Base CSS -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <!-- FontAwesome Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Google Cast SDK (Transmitir) -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <style>
    :root {
      --purple-main: #9d4edd;
      --purple-accent: #c77dff;
      --purple-dark: #240046;
      --purple-bg: #10002b;
      --purple-card: #1e0036;
      --text-light: #f7f0f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--purple-bg);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRA SUPERIOR PARA CUALQUIER LINK (.mp4 / .m3u8) */
    .url-bar-container {
      width: 100%;
      height: 56px;
      background: var(--purple-card);
      border-bottom: 1px solid var(--purple-dark);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 10px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .url-bar-container label {
      font-size: 14px;
      font-weight: 600;
      color: var(--purple-accent);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .url-input {
      flex-grow: 1;
      height: 38px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(199, 125, 255, 0.25);
      border-radius: 8px;
      padding: 0 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .url-input:focus {
      border-color: var(--purple-main);
      box-shadow: 0 0 12px rgba(157, 78, 221, 0.4);
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-load {
      height: 38px;
      padding: 0 18px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
      border: 1px solid var(--purple-accent);
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-load:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 15px rgba(199, 125, 255, 0.5);
    }

    /* CONTENEDOR DEL REPRODUCTOR */
    .player-area {
      flex-grow: 1;
      width: 100%;
      position: relative;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-js {
      width: 100% !important;
      height: 100% !important;
      font-family: inherit;
    }

    /* ESTILIZACIÓN PÚRPURA DE VIDEO.JS */
    .video-js .vjs-control-bar {
      background: linear-gradient(0deg, rgba(16, 0, 43, 0.95) 0%, rgba(16, 0, 43, 0.6) 70%, transparent 100%) !important;
      height: 52px !important;
      padding: 0 8px;
    }

    .video-js .vjs-button {
      color: var(--text-light) !important;
      transition: color 0.2s ease, transform 0.1s ease;
    }

    .video-js .vjs-button:hover {
      color: var(--purple-accent) !important;
      text-shadow: 0 0 8px var(--purple-main);
    }

    /* Botón central Play personalizado con Poster */
    .video-js .vjs-big-play-button {
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.85), rgba(36, 0, 70, 0.85)) !important;
      border: 2px solid var(--purple-accent) !important;
      border-radius: 50% !important;
      width: 80px !important;
      height: 80px !important;
      line-height: 76px !important;
      margin-left: -40px !important;
      margin-top: -40px !important;
      box-shadow: 0 0 25px rgba(157, 78, 221, 0.6) !important;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
    }

    .video-js:hover .vjs-big-play-button {
      transform: scale(1.15);
      background: linear-gradient(135deg, var(--purple-main), var(--purple-dark)) !important;
      box-shadow: 0 0 40px rgba(199, 125, 255, 0.9) !important;
    }

    /* Barra de progreso púrpura */
    .video-js .vjs-play-progress {
      background-color: var(--purple-accent) !important;
      box-shadow: 0 0 10px var(--purple-main);
    }

    .video-js .vjs-load-progress {
      background: rgba(255, 255, 255, 0.2) !important;
    }

    .video-js .vjs-slider {
      background-color: rgba(255, 255, 255, 0.15) !important;
      border-radius: 4px;
    }

    /* Menús de velocidad y calidad */
    .video-js .vjs-menu-button-popup .vjs-menu .vjs-menu-content {
      background-color: var(--purple-card) !important;
      border: 1px solid var(--purple-main);
      border-radius: 8px;
      padding: 6px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .video-js .vjs-menu-item {
      color: var(--text-light) !important;
      font-size: 13px !important;
    }

    .video-js .vjs-menu-item.vjs-selected, 
    .video-js .vjs-menu-item:hover {
      background-color: var(--purple-main) !important;
      color: #fff !important;
    }

    /* ANIMACIÓN FLOTANTE (+10s / -10s) */
    .tap-feedback {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(157, 78, 221, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      box-shadow: 0 0 20px rgba(199, 125, 255, 0.6);
    }

    .tap-feedback i {
      font-size: 20px;
      margin-bottom: 2px;
    }

    .tap-feedback.left { left: 15%; }
    .tap-feedback.right { right: 15%; }

    .tap-feedback.show {
      opacity: 1;
      transform: translateY(-50%) scale(1.1);
    }

    /* NOTIFICACIÓN TOAST */
    .toast-alert {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--purple-card);
      border: 1px solid var(--purple-accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 120;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .toast-alert.show { opacity: 1; }

    /* BOTÓN DEDICADO TRANSMITIR Y COMPARTIR */
    .vjs-custom-icon {
      cursor: pointer;
      display: flex !important;
      align-items: center;
      justify-content: center;
      font-size: 15px !important;
    }
  </style>
</head>
<body>

  <!-- BARRA DE ENLACES SUPERA (.MP4 Y .M3U8) -->
  <div class="url-bar-container">
    <label for="urlInput"><i class="fa-solid fa-link"></i> URL Video:</label>
    <input type="text" id="urlInput" class="url-input" placeholder="Pega el enlace .mp4 o .m3u8 aquí..." />
    <button id="btnLoad" class="btn-load"><i class="fa-solid fa-play"></i> Cargar</button>
  </div>

  <!-- ZONA DEL REPRODUCTOR -->
  <div class="player-area" id="playerArea">
    <div class="tap-feedback left" id="feedbackRewind">
      <i class="fa-solid fa-rotate-left"></i>
      <span>-10s</span>
    </div>
    <div class="tap-feedback right" id="feedbackForward">
      <i class="fa-solid fa-rotate-right"></i>
      <span>+10s</span>
    </div>
    <div class="toast-alert" id="toastAlert">¡Mensaje!</div>

    <!-- VIDEO REPRODUCTOR (NO AUTOPLAY + PORTADA CONFIGURABLE) -->
    <video 
      id="purplePlayer" 
      class="video-js vjs-big-play-centered" 
      controls 
      preload="metadata" 
      playsinline
      poster="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80">
      
      <!-- CAMBIA AQUÍ EL LINK DE TU VIDEO DEFAULT -->
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
    </video>
  </div>

  <!-- VIDEO.JS + HLS / QUALITY PLUGIN -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-contrib-quality-levels@4.0.0/dist/videojs-contrib-quality-levels.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-hls-quality-selector@2.0.0/dist/videojs-hls-quality-selector.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const playerArea = document.getElementById('playerArea');
      const toast = document.getElementById('toastAlert');
      const feedbackRewind = document.getElementById('feedbackRewind');
      const feedbackForward = document.getElementById('feedbackForward');
      const urlInput = document.getElementById('urlInput');
      const btnLoad = document.getElementById('btnLoad');

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      // Inicializar Video.js
      const player = videojs('purplePlayer', {
        autoplay: false, // Requisito 3: No inicia automáticamente
        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2], // Requisito 9: Velocidades
        responsive: true,
        fluid: false,
        controlBar: {
          children: [
            'playToggle', // Requisito 12: Play/Pause con ícono
            'volumePanel', // Requisito 6: Volumen y Mute con ícono
            'currentTimeDisplay',
            'timeDivider',
            'durationDisplay',
            'progressControl',
            'playbackRateMenuButton', // Requisito 9: Selector de velocidad
            'pictureInPictureToggle', // Requisito 8: PiP
            'fullscreenToggle' // Requisito 7: Maximizar
          ]
        }
      });

      // Plugin de selector de calidad para HLS (.m3u8)
      if (typeof player.hlsQualitySelector === 'function') {
        player.hlsQualitySelector({ displayCurrentQuality: true }); // Requisito 10
      }

      // Requisito 5: Cargar links .mp4 y .m3u8
      function loadSource(url) {
        if (!url) return;
        let mimeType = 'video/mp4';
        if (url.toLowerCase().includes('.m3u8')) {
          mimeType = 'application/x-mpegURL';
        }
        player.src({ src: url, type: mimeType });
        player.play().catch(() => {});
        showToast("Cargando video...");
      }

      btnLoad.addEventListener('click', () => loadSource(urlInput.value.trim()));
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') loadSource(urlInput.value.trim());
      });

      player.ready(() => {
        const controlBar = player.controlBar;

        // Requisito 4: Botón de Transmitir (Chromecast)
        const castBtn = document.createElement('button');
        castBtn.className = 'vjs-control vjs-button vjs-custom-icon';
        castBtn.innerHTML = '<i class="fa-solid fa-tv"></i>';
        castBtn.title = "Transmitir pantalla";
        castBtn.onclick = () => {
          if (window.chrome && window.chrome.cast) {
            const sessionRequest = new chrome.cast.SessionRequest(chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID);
            chrome.cast.requestSession((session) => {
              const currentSrc = player.currentSrc();
              const mediaInfo = new chrome.cast.media.MediaInfo(currentSrc, 'video/mp4');
              const request = new chrome.cast.media.LoadRequest(mediaInfo);
              session.loadMedia(request);
            }, (err) => console.log('Error Cast:', err));
          } else {
            showToast("Transmitir no soportado en este navegador");
          }
        };
        controlBar.el().insertBefore(castBtn, controlBar.fullscreenToggle.el());

        // Requisito 11: Botón para copiar/compartir el enlace
        const shareBtn = document.createElement('button');
        shareBtn.className = 'vjs-control vjs-button vjs-custom-icon';
        shareBtn.innerHTML = '<i class="fa-solid fa-share-nodes"></i>';
        shareBtn.title = "Copiar enlace del video";
        shareBtn.onclick = () => {
          const currentSrc = player.currentSrc() || window.location.href;
          navigator.clipboard.writeText(currentSrc);
          showToast("¡Enlace copiado al portapapeles!");
        };
        controlBar.el().insertBefore(shareBtn, castBtn);
      });

      // Requisito 2: Doble clic/tap (Adelantar / Atrasar 10s)
      let lastTap = 0;
      function triggerFeedback(elem) {
        elem.classList.add('show');
        setTimeout(() => elem.classList.remove('show'), 400);
      }

      playerArea.addEventListener('click', (e) => {
        // Ignorar clics dentro de la barra de controles
        if (e.target.closest('.vjs-control-bar') || e.target.closest('.url-bar-container')) return;

        const now = new Date().getTime();
        const timespan = now - lastTap;

        if (timespan < 300 && timespan > 0) {
          const rect = playerArea.getBoundingClientRect();
          const clickX = e.clientX - rect.left;
          const ratio = clickX / rect.width;

          if (ratio < 0.4) {
            // Lado izquierdo: -10s
            player.currentTime(Math.max(0, player.currentTime() - 10));
            triggerFeedback(feedbackRewind);
          } else if (ratio > 0.6) {
            // Lado derecho: +10s
            player.currentTime(Math.min(player.duration() || 0, player.currentTime() + 10));
            triggerFeedback(feedbackForward);
          }
        }
        lastTap = now;
      });
    });
  </script>
</body>
</html>
