<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeissoNxP | Películas, Series y Vídeos</title>
  
  <!-- METADATOS PARA COMPARTIR EN REDES SOCIALES -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="JeissoNxP | Películas, Series y Vídeos 👽">
  <meta property="og:description" content="Mi Librería Personal">
  <meta id="ogImageMeta" property="og:image" content="">
  <meta property="og:url" content="https://jeissonxp182.github.io/player/">

  <!-- TARJETAS PARA X (TWITTER) Y DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JeissoNxP | Películas, Series y Vídeos 👽">
  <meta name="twitter:description" content="Mi Librería Personal">
  <meta id="twitterImageMeta" name="twitter:image" content="">
  
  <style>
    :root {
      --bg-dark: #09070f;
      --card-bg: #130f1e;
      --card-hover: #1c162e;
      --accent-purple: #a855f7;
      --accent-glow: #7e22ce;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-purple: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* HEADER */
    header {
      padding: 25px 5% 15px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-purple);
      background: rgba(9, 7, 15, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .alien-emoji {
      font-size: 2.2rem;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.7));
    }
    
    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 600;
    }

    /* DESPLEGABLE DE SECCIONES */
    .nav-select {
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-purple);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-select:focus, .nav-select:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .nav-select option {
      background: #120d1f;
      color: #ffffff;
    }

    /* BUSCADOR */
    .search-box {
      width: 100%;
      max-width: 550px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-purple);
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
    }

    /* BARRA DE FILTROS TV LIVE */
    .tv-filters-container {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 750px;
      margin-top: 5px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(19, 15, 30, 0.9);
      border: 1px solid var(--border-purple);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .filter-group label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-select {
      background: transparent;
      color: var(--text-main);
      border: none;
      outline: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .filter-select option {
      background: #120d1f;
      color: #ffffff;
    }
    
    /* CONTENEDOR PRINCIPAL */
    main {
      padding: 30px 5%;
    }

    .saga-section {
      margin-bottom: 25px;
      background: rgba(19, 15, 30, 0.4);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      overflow: hidden;
    }

    /* CABECERA ACORDEÓN DE SAGA */
    .saga-header {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: rgba(28, 22, 46, 0.6);
      user-select: none;
      transition: background 0.2s ease;
    }

    .saga-header:hover {
      background: rgba(126, 34, 206, 0.25);
    }

    .saga-title-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .folder-icon {
      font-size: 1.4rem;
    }

    .arrow-icon {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--accent-purple);
    }

    .saga-section.collapsed .arrow-icon {
      transform: rotate(-90deg);
    }

    .saga-content {
      padding: 20px;
      transition: all 0.3s ease;
    }

    .saga-section.collapsed .saga-content {
      display: none;
    }

    /* GRID HORIZONTAL (16:9) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
      box-shadow: 0 10px 25px rgba(126, 34, 206, 0.35);
      background: var(--card-hover);
    }

    /* MARCO 16:9 HORIZONTAL */
    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #0d0a14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      font-weight: 600;
    }

    /* MODAL CINEMÁTICO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #120d1f;
      border: 1px solid var(--border-purple);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(126, 34, 206, 0.3);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
    }

    .modal-details {
      padding: 25px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover {
      background: var(--accent-purple);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      color: #ffffff;
      border: 1px solid var(--border-purple);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-description {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      display: block;
      cursor: pointer;
      border: none;
    }

    .btn-play:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      }
    }
  </style>
</head>
<body>

  <header id="mainHeader">
    <div class="brand">
      <div class="brand-title">
        <span class="alien-emoji">👽</span>
        <h1>JeissoNxP</h1>
      </div>
      <p>películas, series y vídeos</p>
    </div>
    
    <div class="nav-dropdown-container">
      <select class="nav-select" id="sectionSelect" onchange="switchSection(this.value)">
        <option value="sagas" selected>📁 Sagas</option>
        <option value="peliculas">🎭 Películas</option>
        <option value="series">👀 Series</option>
        <option value="anime">🇯🇵 Anime</option>
        <option value="videos">📽️ Videos</option>
        <option value="tv">📺 TV Live</option>
      </select>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar título, año o canal..." oninput="filterCatalog()">
    </div>

    <!-- BARRA DE FILTROS TV LIVE -->
    <div id="tvFiltersBar" class="tv-filters-container">
      <div class="filter-group">
        <label for="filterCountry">🌎 País:</label>
        <select id="filterCountry" class="filter-select" onchange="filterCatalog()">
          <option value="ALL">Todos los países</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterLanguage">🗣️ Idioma:</label>
        <select id="filterLanguage" class="filter-select" onchange="filterCatalog()">
          <option value="ALL">Todos los idiomas</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="filterCategory">🏷️ Categoría:</label>
        <select id="filterCategory" class="filter-select" onchange="filterCatalog()">
          <option value="ALL">Todas las categorías</option>
        </select>
      </div>
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Se cargan dinámicamente -->
  </main>

  <!-- MODAL -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Portada" referrerpolicy="no-referrer">
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-tags" id="modalTagsContainer">
          <span id="modalYear" class="tag"></span>
          <span id="modalDuration" class="tag"></span>
          <span id="modalDirector" class="tag" style="display:none;"></span>
          <span id="modalTotalCap" class="tag" style="display:none;"></span>
        </div>
        <p id="modalSinopsis" class="modal-description"></p>
        <button id="modalPlayBtn" class="btn-play" onclick="launchPlayer()">▶ REPRODUCIR AHORA</button>
      </div>
    </div>
  </div>

  <script>
    const REPOSITORIOS_URLS = {
      sagas: "https://jeissonxp182.github.io/player/sagas.json",
      peliculas: "https://jeissonxp182.github.io/player/peliculas.json",
      series: "https://jeissonxp182.github.io/player/series.json",
      anime: "https://jeissonxp182.github.io/player/anime.json",
      videos: "https://jeissonxp182.github.io/player/videos.json",
      tv: "https://jeissonxp182.github.io/player/canales.json"
    };

    const PAISES_EXCLUIDOS = [
      'irak', 'iraq', 'afganistán', 'afghanistan', 'suiza', 'switzerland', 'polonia', 'poland', 
      'alemania', 'germany', 'irán', 'iran', 'turquía', 'turkey', 'rusia', 'russia', 'china', 
      'india', 'arabia', 'pakistán', 'pakistan', 'egipto', 'egypt', 'francia', 'france', 
      'italia', 'italy', 'grecia', 'greece', 'rumania', 'romania', 'ucrania', 'ukraine'
    ];

    let LOCAL_CATALOG = {
      sagas: [],
      peliculas: [],
      series: [],
      anime: [],
      videos: [],
      tv: []
    };

    let currentSectionKey = 'sagas';
    let targetHtmlUrl = '';
    let currentSerieData = null;
    let currentSeasonData = null;

    // Función auxiliar para extraer el primer atributo existente
    function getAttr(obj, keys, defaultVal = '') {
      if (!obj) return defaultVal;
      for (let k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
          return String(obj[k]).trim();
        }
      }
      return defaultVal;
    }

    // Genera una imagen SVG con las iniciales del canal cuando el logo no existe o falla al cargar
    function generateFallbackLogo(title) {
      const cleanText = (title || 'TV').substring(0, 10).toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="169" viewBox="0 0 300 169">
        <rect width="100%" height="100%" fill="#130f1e"/>
        <circle cx="150" cy="85" r="45" fill="#7e22ce" opacity="0.25"/>
        <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle" fill="#a855f7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold">${cleanText}</text>
      </svg>`;
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function formatDuration(dur) {
      if (!dur) return '';
      return dur.replace(/(\d+h):?(\d+m)/, '$1:$2');
    }

    function updateSocialMeta(items) {
      let firstImage = '';
      if (items && items.length > 0) {
        const item = items[0];
        firstImage = item.portada || item.poster || item.miniatura || '';
        if (!firstImage && item.peliculas && item.peliculas.length > 0) {
          firstImage = item.peliculas[0].portada || item.peliculas[0].poster || item.peliculas[0].miniatura || '';
        }
      }

      if (firstImage) {
        document.getElementById('ogImageMeta').setAttribute('content', firstImage);
        document.getElementById('twitterImageMeta').setAttribute('content', firstImage);
      }
    }

    function populateTvDropdowns(channels) {
      const countrySelect = document.getElementById('filterCountry');
      const languageSelect = document.getElementById('filterLanguage');
      const categorySelect = document.getElementById('filterCategory');

      if (!countrySelect || !languageSelect || !categorySelect) return;

      const countries = new Set();
      const languages = new Set();
      const categories = new Set();

      channels.forEach(ch => {
        if (ch.pais) countries.add(ch.pais.trim());
        if (ch.idioma) languages.add(ch.idioma.trim());
        if (ch.categoria) categories.add(ch.categoria.trim());
      });

      const selCountry = countrySelect.value;
      const selLang = languageSelect.value;
      const selCat = categorySelect.value;

      countrySelect.innerHTML = '<option value="ALL">Todos los países</option>';
      Array.from(countries).sort().forEach(c => {
        countrySelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      languageSelect.innerHTML = '<option value="ALL">Todos los idiomas</option>';
      Array.from(languages).sort().forEach(l => {
        languageSelect.innerHTML += `<option value="${l}">${l}</option>`;
      });

      categorySelect.innerHTML = '<option value="ALL">Todas las categorías</option>';
      Array.from(categories).sort().forEach(cat => {
        categorySelect.innerHTML += `<option value="${cat}">${cat}</option>`;
      });

      if (countries.has(selCountry)) countrySelect.value = selCountry;
      if (languages.has(selLang)) languageSelect.value = selLang;
      if (categories.has(selCat)) categorySelect.value = selCat;
    }

    async function cargarSeccionRemota(sectionKey) {
      const container = document.getElementById('catalogContainer');
      const tvFiltersBar = document.getElementById('tvFiltersBar');

      if (tvFiltersBar) {
        tvFiltersBar.style.display = (sectionKey === 'tv') ? 'flex' : 'none';
      }

      if (LOCAL_CATALOG[sectionKey] && LOCAL_CATALOG[sectionKey].length > 0) {
        if (sectionKey === 'tv') populateTvDropdowns(LOCAL_CATALOG.tv);
        filterCatalog();
        updateSocialMeta(LOCAL_CATALOG[sectionKey]);
        return LOCAL_CATALOG[sectionKey];
      }

      container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Cargando contenido...</p>';

      try {
        const respuesta = await fetch(REPOSITORIOS_URLS[sectionKey]);
        if (!respuesta.ok) throw new Error("No se pudo conectar con el repositorio");
        
        let data = await respuesta.json();

        if (sectionKey === 'tv') {
          let canalesProcesados = data.map((ch, idx) => {
            const nombre = getAttr(ch, ['nombre', 'titulo', 'title', 'name', 'tvg-name', 'tvg_name', 'label'], `Canal ${idx + 1}`);
            const logo = getAttr(ch, ['logo', 'tvg-logo', 'tvg_logo', 'logo_url', 'stream_icon', 'icon', 'image', 'portada', 'poster', 'miniatura', 'img']);
            const url = getAttr(ch, ['urlVideo', 'url_video', 'url', 'link', 'stream', 'enlace', 'src', 'manifest_url', 'file']);
            let pais = getAttr(ch, ['pais', 'country', 'tvg-country', 'tvg_country', 'pais_origen', 'region']);
            let idioma = getAttr(ch, ['idioma', 'language', 'lang', 'tvg-language']);
            let categoria = getAttr(ch, ['categoria', 'category', 'group', 'group-title', 'group_title', 'grupo', 'genre'], 'General');

            if (!pais) {
              const lowerText = `${nombre} ${categoria}`.toLowerCase();
              if (lowerText.includes('colombia')) pais = 'Colombia';
              else if (lowerText.includes('mexico') || lowerText.includes('méxico')) pais = 'México';
              else if (lowerText.includes('argentina')) pais = 'Argentina';
              else if (lowerText.includes('chile')) pais = 'Chile';
              else if (lowerText.includes('peru') || lowerText.includes('perú')) pais = 'Perú';
              else if (lowerText.includes('españa') || lowerText.includes('spain')) pais = 'España';
              else if (lowerText.includes('usa') || lowerText.includes('eeuu') || lowerText.includes('states')) pais = 'EE. UU.';
              else pais = 'Internacional';
            }

            if (!idioma) {
              const lowerText = `${nombre} ${categoria} ${pais}`.toLowerCase();
              if (lowerText.includes('english') || lowerText.includes('inglés') || pais === 'EE. UU.') {
                idioma = 'Inglés';
              } else {
                idioma = 'Español';
              }
            }

            return {
              id: ch.id || `tv-${idx}`,
              titulo: nombre,
              portada: logo,
              pais: pais.trim(),
              idioma: idioma.trim(),
              categoria: categoria.trim(),
              ano: `${pais} • ${categoria}`,
              duracion: 'EN VIVO',
              sinopsis: `Transmisión en vivo de ${nombre}. Categoría: ${categoria} | Idioma: ${idioma} | País: ${pais}`,
              urlVideo: url
            };
          });

          // Filtrar canales no deseados de la lista
          data = canalesProcesados.filter(ch => {
            const todoTexto = `${ch.titulo} ${ch.pais} ${ch.categoria}`.toLowerCase();
            return !PAISES_EXCLUIDOS.some(p => todoTexto.includes(p));
          });

          populateTvDropdowns(data);
        }

        LOCAL_CATALOG[sectionKey] = data;
        filterCatalog();
        updateSocialMeta(data);
        return data;
      } catch (error) {
        console.error("Error al cargar la sección:", error);
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">Error de conexión o archivo no disponible 🚀</p>';
        return null;
      }
    }

    function loadSection(sectionKey) {
      currentSectionKey = sectionKey;
      document.getElementById('sectionSelect').value = sectionKey;
      return cargarSeccionRemota(sectionKey);
    }

    function switchSection(sectionKey) {
      document.getElementById('searchInput').value = '';
      loadSection(sectionKey);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('peli') || urlParams.get('episodio') || urlParams.get('id');

      if (targetId) {
        const secciones = ['sagas', 'peliculas', 'series', 'anime', 'videos', 'tv'];
        let encontrado = false;

        for (const sec of secciones) {
          const data = await loadSection(sec);
          if (!data) continue;

          if (sec === 'sagas') {
            for (const saga of data) {
              if (saga.peliculas) {
                const item = saga.peliculas.find(p => p.id === targetId);
                if (item) {
                  openModal(item);
                  encontrado = true;
                  break;
                }
              }
            }
          } else if (sec === 'series' || sec === 'anime') {
            for (const serie of data) {
              if (serie.id === targetId) {
                openSeriesModal(serie);
                encontrado = true;
                break;
              }
              if (serie.temporadas) {
                for (const temp of serie.temporadas) {
                  if (temp.episodios) {
                    const ep = temp.episodios.find(e => e.idEpisodio === targetId || e.id === targetId);
                    if (ep) {
                      currentSerieData = serie;
                      openEpisodeDetailsModal(ep, temp);
                      encontrado = true;
                      break;
                    }
                  }
                }
              }
              if (encontrado) break;
            }
          } else {
            const item = data.find(p => p.id === targetId);
            if (item) {
              openModal(item);
              encontrado = true;
              break;
            }
          }

          if (encontrado) break;
        }

        if (!encontrado) loadSection('sagas');
      } else {
        loadSection('sagas');
      }
    });

    function createCardElement(item) {
      const formattedDur = formatDuration(item.duracion);
      const card = document.createElement('div');
      card.className = 'card';
      
      if (currentSectionKey === 'series' || currentSectionKey === 'anime') {
        card.onclick = () => openSeriesModal(item);
      } else {
        card.onclick = () => openModal(item);
      }

      const imgSrc = item.portada || item.miniatura || item.poster || item.imagen || '';
      const fallbackImg = generateFallbackLogo(item.titulo);

      card.innerHTML = `
        <div class="poster-wrapper">
          <img src="${imgSrc || fallbackImg}" 
               alt="${item.titulo}" 
               loading="lazy" 
               referrerpolicy="no-referrer"
               onerror="this.onerror=null; this.src='${fallbackImg}';">
        </div>
        <div class="card-info">
          <div class="card-title">${item.titulo}</div>
          <div class="card-meta">${item.ano || ''} ${formattedDur ? '• ' + formattedDur : ''}</div>
        </div>
      `;

      return card;
    }

    function renderCatalog(items) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">No se encontraron contenidos en esta sección o filtro 🚀</p>';
        return;
      }

      let folderIcon = '📁';
      if (currentSectionKey === 'peliculas') folderIcon = '🎭';
      if (currentSectionKey === 'videos') folderIcon = '📽️';
      if (currentSectionKey === 'series') folderIcon = '👀';
      if (currentSectionKey === 'anime') folderIcon = '🇯🇵';
      if (currentSectionKey === 'tv') folderIcon = '📺';

      const esEstructuraSagas = items.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        items.forEach(saga => {
          if (!saga.peliculas || saga.peliculas.length === 0) return;

          const sagaSection = document.createElement('div');
          sagaSection.className = 'saga-section';
          if (!saga.abierta) {
            sagaSection.classList.add('collapsed');
          }

          const sagaHeader = document.createElement('div');
          sagaHeader.className = 'saga-header';
          sagaHeader.onclick = () => sagaSection.classList.toggle('collapsed');

          sagaHeader.innerHTML = `
            <div class="saga-title-content">
              <span class="folder-icon">${folderIcon}</span>
              <span>${saga.saga}</span>
            </div>
            <span class="arrow-icon">▼</span>
          `;

          sagaSection.appendChild(sagaHeader);

          const sagaContent = document.createElement('div');
          sagaContent.className = 'saga-content';

          const grid = document.createElement('div');
          grid.className = 'grid-container';

          saga.peliculas.forEach(peli => {
            grid.appendChild(createCardElement(peli));
          });

          sagaContent.appendChild(grid);
          sagaSection.appendChild(sagaContent);
          container.appendChild(sagaSection);
        });
      } else {
        const grid = document.createElement('div');
        grid.className = 'grid-container';

        items.forEach(item => {
          grid.appendChild(createCardElement(item));
        });

        container.appendChild(grid);
      }
    }

    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const items = LOCAL_CATALOG[currentSectionKey] || [];

      if (currentSectionKey === 'tv') {
        const countryVal = document.getElementById('filterCountry').value;
        const langVal = document.getElementById('filterLanguage').value;
        const catVal = document.getElementById('filterCategory').value;

        const filtered = items.filter(ch => {
          const matchCountry = (countryVal === 'ALL' || (ch.pais && ch.pais.trim() === countryVal));
          const matchLang = (langVal === 'ALL' || (ch.idioma && ch.idioma.trim() === langVal));
          const matchCat = (catVal === 'ALL' || (ch.categoria && ch.categoria.trim() === catVal));
          const matchQuery = !query || 
                             (ch.titulo && ch.titulo.toLowerCase().includes(query)) || 
                             (ch.pais && ch.pais.toLowerCase().includes(query)) ||
                             (ch.categoria && ch.categoria.toLowerCase().includes(query));

          return matchCountry && matchLang && matchCat && matchQuery;
        });

        renderCatalog(filtered);
        return;
      }

      if (!query) {
        renderCatalog(items);
        return;
      }

      const esEstructuraSagas = items.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        const filtered = items.map(saga => {
          const matchesSaga = saga.saga ? saga.saga.toLowerCase().includes(query) : false;
          const filteredPelis = saga.peliculas.filter(peli => {
            const matchesTitle = peli.titulo ? peli.titulo.toLowerCase().includes(query) : false;
            const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
            return matchesTitle || matchesYear || matchesSaga;
          });

          return { ...saga, peliculas: filteredPelis };
        }).filter(saga => saga.peliculas.length > 0);

        renderCatalog(filtered);
      } else {
        const filtered = items.filter(item => {
          const matchesTitle = item.titulo ? item.titulo.toLowerCase().includes(query) : false;
          const matchesYear = item.ano ? item.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear;
        });

        renderCatalog(filtered);
      }
    }

    function openModal(peli) {
      const formattedDur = formatDuration(peli.duracion);
      const fallbackImg = generateFallbackLogo(peli.titulo);

      const modalImg = document.getElementById('modalImg');
      modalImg.onerror = () => { modalImg.src = fallbackImg; };
      modalImg.src = peli.portada || peli.miniatura || peli.poster || peli.imagen || fallbackImg;

      document.getElementById('modalTitle').innerText = peli.titulo || 'Sin título';
      document.getElementById('modalYear').innerHTML = `📅 ${peli.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      
      const directorTag = document.getElementById('modalDirector');
      if (peli.director) {
        directorTag.innerHTML = `🎥 ${peli.director}`;
        directorTag.style.display = 'flex';
      } else {
        directorTag.style.display = 'none';
      }

      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible.';

      const tempContainer = document.getElementById('modalTemporadasContainer');
      if (tempContainer) tempContainer.style.display = 'none';
      document.getElementById('modalPlayBtn').style.display = 'block';

      if (currentSectionKey === 'tv') {
        const rawUrl = peli.urlVideo || peli.url_video || peli.video || peli.url || peli.enlace || '';
        targetHtmlUrl = `reproductor.html?url=${encodeURIComponent(rawUrl)}&titulo=${encodeURIComponent(peli.titulo || 'Canal TV')}`;
      } else if (peli.id) {
        targetHtmlUrl = `reproductor.html?peli=${peli.id}`;
        history.replaceState(null, '', `?peli=${peli.id}`);
      } else {
        const videoSrc = peli.urlVideo || peli.url_video || peli.video || peli.url || peli.enlace || peli.url_html || '';
        targetHtmlUrl = `reproductor.html?url=${encodeURIComponent(videoSrc)}&titulo=${encodeURIComponent(peli.titulo || 'Reproductor')}`;
      }

      document.getElementById('movieModal').style.display = 'flex';
    }

    function openSeriesModal(serie) {
      currentSerieData = serie;
      currentSeasonData = null;
      const mainPoster = serie.miniatura || serie.poster || serie.portada || serie.imagen || generateFallbackLogo(serie.titulo);
      const totalTemporadasCount = serie.temporadas ? serie.temporadas.length : 0;
      
      document.getElementById('modalImg').src = mainPoster;
      document.getElementById('modalTitle').innerText = serie.titulo || 'Sin título';
      document.getElementById('modalYear').innerHTML = `📅 ${serie.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `📁 ${totalTemporadasCount} temporada${totalTemporadasCount === 1 ? '' : 's'}`;
      
      if (serie.id) {
        history.replaceState(null, '', `?id=${serie.id}`);
      }

      const directorTag = document.getElementById('modalDirector');
      if (serie.director) {
        directorTag.innerHTML = `🎥 ${serie.director}`;
        directorTag.style.display = 'flex';
      } else {
        directorTag.style.display = 'none';
      }

      let totalCapsCount = 0;
      if (serie.temporadas) {
        serie.temporadas.forEach(t => {
          if (t.episodios) totalCapsCount += t.episodios.length;
        });
      }
      const totalCapTag = document.getElementById('modalTotalCap');
      if (totalCapsCount > 0) {
        totalCapTag.innerHTML = `🎬 ${totalCapsCount} caps totales`;
        totalCapTag.style.display = 'flex';
      } else {
        totalCapTag.style.display = 'none';
      }

      document.getElementById('modalSinopsis').innerText = serie.sinopsis || 'Sin descripción disponible general.';
      document.getElementById('modalPlayBtn').style.display = 'none';

      let tempContainer = document.getElementById('modalTemporadasContainer');
      if (!tempContainer) {
        tempContainer = document.createElement('div');
        tempContainer.id = 'modalTemporadasContainer';
        tempContainer.style.marginTop = '20px';
        document.querySelector('.modal-details').appendChild(tempContainer);
      }

      tempContainer.style.display = 'block';
      tempContainer.innerHTML = ''; 

      if (serie.temporadas && serie.temporadas.length > 0) {
        serie.temporadas.forEach(temp => {
          const seasonBtn = document.createElement('button');
          seasonBtn.style.cssText = "display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 18px; margin-bottom: 10px; background: rgba(28, 22, 46, 0.7); border: 1px solid var(--border-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s;";
          
          seasonBtn.onmouseover = () => {
            seasonBtn.style.background = 'rgba(126, 34, 206, 0.3)';
            seasonBtn.style.borderColor = 'var(--accent-purple)';
          };
          seasonBtn.onmouseout = () => {
            seasonBtn.style.background = 'rgba(28, 22, 46, 0.7)';
            seasonBtn.style.borderColor = 'var(--border-purple)';
          };

          const numCapsEnTemporada = temp.episodios ? temp.episodios.length : 0;
          seasonBtn.innerHTML = `📁 Temporada ${temp.numeroTemporada} <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal; margin-left:8px;">(${numCapsEnTemporada} cap${numCapsEnTemporada === 1 ? '' : 's'})</span> <span style="color:var(--accent-purple); font-size:1.1rem;">➔</span>`;

          seasonBtn.onclick = () => openSeasonEpisodesView(temp);

          tempContainer.appendChild(seasonBtn);
        });
      } else {
        tempContainer.innerHTML = `<p style="color: var(--text-muted); text-align: center;">No hay temporadas registradas aún.</p>`;
      }

      document.getElementById('movieModal').style.display = 'flex';
    }

    function openSeasonEpisodesView(temp) {
      currentSeasonData = temp;
      const seasonPoster = temp.miniatura || temp.imagen || temp.portada || temp.poster || currentSerieData.miniatura || currentSerieData.portada || currentSerieData.poster || '';

      document.getElementById('modalImg').src = seasonPoster || generateFallbackLogo(currentSerieData.titulo);
      document.getElementById('modalTitle').innerText = `${currentSerieData.titulo} - Temporada ${temp.numeroTemporada}`;
      document.getElementById('modalYear').innerHTML = `📅 T${temp.numeroTemporada} (${temp.ano || currentSerieData.ano || 'S/A'})`;
      
      const numCaps = temp.episodios ? temp.episodios.length : 0;
      document.getElementById('modalDuration').innerHTML = `🎬 ${numCaps} episodio${numCaps === 1 ? '' : 's'}`;
      document.getElementById('modalDirector').style.display = 'none';
      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = temp.sinopsis || `Selecciona un capítulo de la temporada ${temp.numeroTemporada} para ver sus detalles.`;
      document.getElementById('modalPlayBtn').style.display = 'none';

      let tempContainer = document.getElementById('modalTemporadasContainer');
      tempContainer.innerHTML = '';

      const backBtn = document.createElement('button');
      backBtn.style.cssText = "display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4)); border: 1px solid var(--accent-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);";
      
      backBtn.onmouseover = () => {
        backBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(126, 34, 206, 0.6))';
      };
      backBtn.onmouseout = () => {
        backBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4))';
      };

      backBtn.innerHTML = `⬅️ Volver a los detalles de la serie`;
      backBtn.onclick = () => openSeriesModal(currentSerieData);
      tempContainer.appendChild(backBtn);

      const epsListDiv = document.createElement('div');
      epsListDiv.style.cssText = "display: flex; flex-direction: column; gap: 8px;";

      if (temp.episodios && temp.episodios.length > 0) {
        temp.episodios.forEach(ep => {
          const epBtn = document.createElement('button');
          epBtn.style.cssText = "display: block; width: 100%; text-align: left; background: rgba(13, 10, 20, 0.8); border: 1px solid var(--border-purple); color: var(--text-main); padding: 12px 15px; cursor: pointer; border-radius: 8px; font-size: 0.95rem; font-weight: 600; transition: all 0.2s;";
          
          epBtn.onmouseover = () => {
            epBtn.style.background = 'rgba(168, 85, 247, 0.25)';
            epBtn.style.borderColor = 'var(--accent-purple)';
          };
          epBtn.onmouseout = () => {
            epBtn.style.background = 'rgba(13, 10, 20, 0.8)';
            epBtn.style.borderColor = 'var(--border-purple)';
          };
          
          const numEpFormatted = String(ep.numeroEpisodio).padStart(2, '0');
          epBtn.innerHTML = `▶️ EP ${numEpFormatted} - ${ep.titulo} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal; float:right;">${ep.duracion || ''}</span>`;
          
          epBtn.onclick = () => openEpisodeDetailsModal(ep, temp);

          epsListDiv.appendChild(epBtn);
        });
      } else {
        epsListDiv.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 15px;">No hay capítulos registrados para esta temporada aún.</p>`;
      }

      tempContainer.appendChild(epsListDiv);
    }

    function openEpisodeDetailsModal(ep, temp) {
      const epPoster = ep.miniatura || ep.imagen || ep.img || ep.portada || ep.poster || temp.miniatura || temp.imagen || temp.portada || temp.poster || (currentSerieData && currentSerieData.miniatura) || '';
      
      const formattedDur = formatDuration(ep.duracion);
      const numEpFormatted = String(ep.numeroEpisodio).padStart(2, '0');

      document.getElementById('modalImg').src = epPoster || generateFallbackLogo(ep.titulo);
      document.getElementById('modalTitle').innerText = `${currentSerieData ? currentSerieData.titulo : ''} - T${temp.numeroTemporada} EP ${numEpFormatted}: ${ep.titulo}`;
      document.getElementById('modalYear').innerHTML = `📅 ${ep.ano || temp.ano || (currentSerieData ? currentSerieData.ano : 'S/A')}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      
      document.getElementById('modalDirector').style.display = 'none';
      document.getElementById('modalTotalCap').style.display = 'none';
      document.getElementById('modalSinopsis').innerText = ep.sinopsis || 'Sin descripción disponible para este episodio.';

      let tempContainer = document.getElementById('modalTemporadasContainer');
      tempContainer.innerHTML = '';

      const backToSeasonBtn = document.createElement('button');
      backToSeasonBtn.style.cssText = "display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; margin-bottom: 18px; background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4)); border: 1px solid var(--accent-purple); border-radius: 10px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(126, 34, 206, 0.3);";
      
      backToSeasonBtn.onmouseover = () => {
        backToSeasonBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.5), rgba(126, 34, 206, 0.6))';
      };
      backToSeasonBtn.onmouseout = () => {
        backToSeasonBtn.style.background = 'linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(126, 34, 206, 0.4))';
      };

      backToSeasonBtn.innerHTML = `⬅️ Volver a la lista de episodios`;
      backToSeasonBtn.onclick = () => openSeasonEpisodesView(temp);
      tempContainer.appendChild(backToSeasonBtn);

      const playEpBtn = document.createElement('button');
      playEpBtn.className = 'btn-play';
      playEpBtn.innerHTML = `▶ REPRODUCIR AHORA`;
      
      const epId = ep.idEpisodio || ep.id;
      if (epId) {
        history.replaceState(null, '', `?episodio=${epId}`);
      }

      playEpBtn.onclick = () => {
        if (epId) {
          targetHtmlUrl = `reproductor.html?episodio=${epId}`;
        } else {
          const epVideoSrc = ep.urlVideo || ep.url_video || ep.video || ep.url || ep.enlace || '';
          targetHtmlUrl = `reproductor.html?url=${encodeURIComponent(epVideoSrc)}&titulo=${encodeURIComponent((currentSerieData ? currentSerieData.titulo : '') + " - T" + temp.numeroTemporada + " Ep " + ep.numeroEpisodio)}`;
        }
        launchPlayer();
      };
      
      tempContainer.appendChild(playEpBtn);
      
      document.getElementById('movieModal').style.display = 'flex';
    }

    function launchPlayer() {
      if (!targetHtmlUrl) return;
      window.location.href = targetHtmlUrl;
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
      const tempContainer = document.getElementById('modalTemporadasContainer');
      if (tempContainer) tempContainer.style.display = 'block';
      currentSerieData = null;
      currentSeasonData = null;
      history.replaceState(null, '', window.location.pathname);
    }
  </script>
</body>
</html>
