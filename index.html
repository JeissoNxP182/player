<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Peliculas</title>
  <style>
    :root {
      --bg-dark: #09070f;
      --card-bg: #130f1e;
      --card-hover: #1c162e;
      --accent-purple: #a855f7;
      --accent-glow: #7e22ce;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-purple: rgba(168, 85, 247, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(126, 34, 206, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* HEADER & SEARCH */
    header {
      padding: 30px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--border-purple);
      background: rgba(9, 7, 15, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      width: 100%;
      max-width: 550px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 14px 22px;
      border-radius: 30px;
      border: 1px solid var(--border-purple);
      background: rgba(19, 15, 30, 0.8);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
      background: var(--card-bg);
    }

    /* CATALOG CONTAINER */
    main {
      padding: 40px 5%;
    }

    .saga-section {
      margin-bottom: 50px;
    }

    .saga-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 25px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .saga-title::before {
      content: '';
      width: 5px;
      height: 24px;
      background: linear-gradient(to bottom, var(--accent-purple), var(--accent-glow));
      border-radius: 3px;
      display: inline-block;
    }

    /* GRID & CARDS */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent-purple);
      box-shadow: 0 12px 30px rgba(126, 34, 206, 0.35);
      background: var(--card-hover);
    }

    .poster-wrapper {
      width: 100%;
      height: 280px;
      overflow: hidden;
      position: relative;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-info {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* CINEMATIC MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.88);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #120d1f;
      border: 1px solid var(--border-purple);
      border-radius: 18px;
      max-width: 800px;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(126, 34, 206, 0.25);
      display: flex;
      flex-direction: row;
      max-height: 85vh;
    }

    .modal-banner {
      width: 40%;
      min-width: 250px;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-details {
      width: 60%;
      padding: 30px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover {
      background: var(--accent-purple);
      transform: scale(1.1);
    }

    .modal-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .modal-tags {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-purple);
      border: 1px solid var(--border-purple);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .modal-description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .btn-play {
      margin-top: auto;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(168, 85, 247, 0.6);
      filter: brightness(1.1);
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 768px) {
      .modal-content {
        flex-direction: column;
        max-height: 90vh;
      }
      .modal-banner {
        width: 100%;
        height: 220px;
      }
      .modal-details {
        width: 100%;
        padding: 20px;
      }
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 15px;
      }
      .poster-wrapper {
        height: 210px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🍿 STREAMVERSE</h1>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, año o saga..." oninput="filterCatalog()">
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Carga dinámica de películas -->
  </main>

  <!-- MODAL DE DETALLES -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Portada">
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-tags">
          <span id="modalYear" class="tag"></span>
          <span id="modalDuration" class="tag"></span>
        </div>
        <p id="modalSinopsis" class="modal-description"></p>
        <a id="modalPlayBtn" href="#" class="btn-play">▶ REPRODUCIR AHORA</a>
      </div>
    </div>
  </div>

  <script>
    // URLs de tus archivos JSON
    const JSON_URLS = [
      'https://jeissonxp182.github.io/peliculas/vhs.json',
      'https://jeissonxp182.github.io/peliculas/invicto.json'
    ];

    let allSagasData = [];

    // Cargar los archivos JSON simultáneamente
    Promise.all(JSON_URLS.map(url => fetch(url).then(res => res.json())))
      .then(resultados => {
        allSagasData = resultados.flat();
        renderCatalog(allSagasData);
      })
      .catch(err => {
        console.error('Error cargando los JSONs:', err);
        document.getElementById('catalogContainer').innerHTML = 
          '<p style="text-align:center; color:var(--accent-purple); font-weight:bold; margin-top:50px;"> Hubo un inconveniente al cargar las películas. Revisa tu conexión.</p>';
      });

    // Renderizar las sagas y películas en el DOM
    function renderCatalog(sagas) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      let hasContent = false;

      sagas.forEach(saga => {
        if (!saga.peliculas || saga.peliculas.length === 0) return;

        hasContent = true;
        const sagaSection = document.createElement('div');
        sagaSection.className = 'saga-section';

        const sagaTitle = document.createElement('h2');
        sagaTitle.className = 'saga-title';
        sagaTitle.innerText = saga.saga;
        sagaSection.appendChild(sagaTitle);

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        saga.peliculas.forEach(peli => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(peli);

          card.innerHTML = `
            <div class="poster-wrapper">
              <img src="${peli.portada}" alt="${peli.titulo}" loading="lazy">
            </div>
            <div class="card-info">
              <div class="card-title">${peli.titulo}</div>
              <div class="card-meta">${peli.ano || ''} ${peli.duracion ? '• ' + peli.duracion : ''}</div>
            </div>
          `;

          grid.appendChild(card);
        });

        sagaSection.appendChild(grid);
        container.appendChild(sagaSection);
      });

      if (!hasContent) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">No se encontraron películas para tu búsqueda.</p>';
      }
    }

    // Buscador interactivo
    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!query) {
        renderCatalog(allSagasData);
        return;
      }

      const filtered = allSagasData.map(saga => {
        const matchesSaga = saga.saga.toLowerCase().includes(query);
        const filteredPelis = saga.peliculas.filter(peli => {
          const matchesTitle = peli.titulo.toLowerCase().includes(query);
          const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear || matchesSaga;
        });

        return { ...saga, peliculas: filteredPelis };
      }).filter(saga => saga.peliculas.length > 0);

      renderCatalog(filtered);
    }

    // Lógica del Modal
    function openModal(peli) {
      document.getElementById('modalImg').src = peli.portada;
      document.getElementById('modalTitle').innerText = peli.titulo;
      document.getElementById('modalYear').innerText = peli.ano ? `Año: ${peli.ano}` : 'S/A';
      document.getElementById('modalDuration').innerText = peli.duracion ? `Duración: ${peli.duracion}` : 'N/A';
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible para esta película.';
      document.getElementById('modalPlayBtn').href = peli.url;

      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
    }
  </script>
</body>
</html>
