<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cine en Casa</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent: #e50914;
      --text-main: #ffffff;
      --text-muted: #c5c6c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    /* Header y Buscador */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--accent);
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #333;
      background-color: #121212;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    /* Contenedor de Sagas */
    .saga-section {
      margin-bottom: 40px;
    }

    .saga-title {
      font-size: 1.6rem;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      padding-left: 10px;
    }

    /* Grid de Tarjetas */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .card-content {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-btn {
      margin-top: auto;
      background-color: var(--accent);
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .card-btn:hover {
      background-color: #b80710;
    }

    /* Modal de Detalles / Sinopsis */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background-color: #181a1b;
      max-width: 600px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      font-size: 1.5rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .modal-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .modal-sinopsis {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #ddd;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-play-btn {
      flex: 1;
      background-color: var(--accent);
      color: white;
      text-align: center;
      padding: 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Mi Videoteca</h1>
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por título, año o saga..." oninput="filterMovies()">
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Carga dinámica de películas -->
  </main>

  <!-- Modal para ver Detalles / Sinopsis -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-body">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div id="modalMeta" class="modal-meta"></div>
        <p id="modalSinopsis" class="modal-sinopsis"></p>
        <div class="modal-actions">
          <a id="modalPlayBtn" href="#" class="modal-play-btn">▶ Ver Película</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const JSON_URLS = [
      'https://jeissonxp182.github.io/peliculas/vhs.json',
      'https://jeissonxp182.github.io/peliculas/invicto.json'
    ];

    let allSagasData = [];

    // Cargar los archivos JSON
    Promise.all(JSON_URLS.map(url => fetch(url).then(res => res.json())))
      .then(resultados => {
        allSagasData = resultados.flat();
        renderCatalog(allSagasData);
      })
      .catch(err => {
        console.error('Error cargando las películas:', err);
        document.getElementById('catalogContainer').innerHTML = 
          '<p style="text-align:center; color:var(--accent);">Error al cargar el catálogo de películas.</p>';
      });

    // Renderizar Catálogo
    function renderCatalog(sagas) {
      const container = document.getElementById('catalogContainer');
      container.innerHTML = '';

      let foundAny = false;

      sagas.forEach(saga => {
        if (!saga.peliculas || saga.peliculas.length === 0) return;

        foundAny = true;
        const sagaSection = document.createElement('div');
        sagaSection.className = 'saga-section';

        const sagaTitle = document.createElement('h2');
        sagaTitle.className = 'saga-title';
        sagaTitle.innerText = saga.saga;
        sagaSection.appendChild(sagaTitle);

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        saga.peliculas.forEach(peli => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openModal(peli);

          card.innerHTML = `
            <img src="${peli.portada}" alt="${peli.titulo}" loading="lazy">
            <div class="card-content">
              <div class="card-title">${peli.titulo}</div>
              <div class="card-meta">${peli.ano || ''} ${peli.duracion ? '• ' + peli.duracion : ''}</div>
              <a href="${peli.url}" class="card-btn" onclick="event.stopPropagation()">▶ Ver</a>
            </div>
          `;

          grid.appendChild(card);
        });

        sagaSection.appendChild(grid);
        container.appendChild(sagaSection);
      });

      if (!foundAny) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top: 40px;">No se encontraron películas.</p>';
      }
    }

    // Filtro de Búsqueda
    function filterMovies() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!query) {
        renderCatalog(allSagasData);
        return;
      }

      const filteredSagas = allSagasData.map(saga => {
        const matchesSagaName = saga.saga.toLowerCase().includes(query);
        
        const filteredPelis = saga.peliculas.filter(peli => {
          const matchesTitle = peli.titulo.toLowerCase().includes(query);
          const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear || matchesSagaName;
        });

        return {
          ...saga,
          peliculas: filteredPelis
        };
      }).filter(saga => saga.peliculas.length > 0);

      renderCatalog(filteredSagas);
    }

    // Funciones para el Modal de Detalles (Sinopsis, Duración, Año)
    function openModal(peli) {
      document.getElementById('modalTitle').innerText = peli.titulo;
      document.getElementById('modalMeta').innerText = `${peli.ano || ''} ${peli.duracion ? '• ' + peli.duracion : ''}`;
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible.';
      document.getElementById('modalPlayBtn').href = peli.url;

      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
    }
  </script>

</body>
</html>
