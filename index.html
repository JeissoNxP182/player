<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor JeissoNxP182</title>

  <!-- HLS.js para listas .m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --purple-main: #a855f7;
      --purple-dark: #3b0764;
      --purple-deep: #140326;
      --silver-gradient: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 50%, #cbd5e1 100%);
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--purple-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* REPRODUCTOR - CONTENEDOR PRINCIPAL */
    .player-wrapper {
      width: 100%;
      height: 60vh;
      max-height: 70vh;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
      contain: content;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* MARCA PERSONAL Y TITULO */
    .brand-watermark {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 8px rgba(168, 85, 247, 0.4);
      z-index: 25;
      pointer-events: none;
    }

    /* CAPA DE CONTROLES OVERLAY */
    .controls-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 2, 20, 0.55);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s cubic-bezier(0, 0, 0.2, 1);
      will-change: opacity;
      z-index: 20;
    }

    .controls-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* FILA SUPERIOR CONTROLES (DERECHA) */
    .top-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* CONTROLES CENTRALES (ATRASAR - PLAY - ADELANTAR) */
    .center-controls {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 24px;
      z-index: 22;
    }

    .btn-center {
      background: rgba(20, 3, 38, 0.75);
      border: 1px solid rgba(168, 85, 247, 0.5);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      transition: transform 0.1s ease;
    }

    .btn-center:active {
      transform: scale(0.92);
    }

    .btn-center.play-main {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
      border-color: #cbd5e1;
    }

    /* FILA INFERIOR CONTROLES */
    .bottom-controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    /* BARRA DESLIZANTE Y BUFFER REAL */
    .scrubber-container {
      width: 100%;
      display: flex;
      align-items: center;
      position: relative;
    }

    .video-scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      z-index: 2;
      will-change: background;
    }

    .video-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid var(--purple-main);
      box-shadow: 0 0 8px var(--purple-main);
      cursor: pointer;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bottom-left, .bottom-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* CONTADOR UNIFICADO */
    .time-counter {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: 0.5px;
      font-family: monospace;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      transition: background 0.15s ease;
    }

    .time-counter:active {
      background: rgba(168, 85, 247, 0.4);
    }

    /* ESTILO GENERAL DE BOTONES / ICONOS */
    .icon-btn {
      background: none;
      border: none;
      color: #f8fafc;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .icon-btn:active {
      background: rgba(168, 85, 247, 0.3);
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* SLIDER DE VOLUMEN */
    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e2e8f0;
      box-shadow: 0 0 6px var(--purple-main);
      cursor: pointer;
    }

    /* MENU DESPLEGABLE DE OPCIONES (TUERCA) */
    .settings-panel {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(20, 3, 38, 0.96);
      border-top: 1px solid var(--purple-main);
      border-radius: 16px 16px 0 0;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 40;
      backdrop-filter: blur(10px);
    }

    .settings-panel.active { display: flex; }

    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #e2e8f0;
    }

    .settings-item select {
      background: #2e0854;
      color: #fff;
      border: 1px solid var(--purple-main);
      padding: 4px 8px;
      border-radius: 6px;
      outline: none;
      font-size: 12px;
    }

    /* BLOQUEO DE PANTALLA */
    .lock-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 50;
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 12px;
    }

    .lock-overlay.active { display: flex; }

    /* CONTENEDOR DE ENLACE DEBAJO DEL REPRODUCTOR */
    .url-section {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--purple-deep);
      flex-grow: 1;
    }

    .url-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex-grow: 1;
      height: 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      padding: 0 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .url-input:focus {
      border-color: var(--purple-main);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
    }

    .btn-load {
      height: 42px;
      padding: 0 18px;
      background: linear-gradient(135deg, var(--purple-main), var(--purple-dark));
      border: 1px solid #94a3b8;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .toast-msg {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 3, 38, 0.9);
      border: 1px solid #e2e8f0;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 11px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast-msg.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- MARCA DE AGUA -->
  <div class="player-wrapper" id="playerWrapper">
    <div class="brand-watermark">JeissoNxP182</div>

    <video id="mainVideo" preload="metadata" playsinline webkit-playsinline></video>

    <!-- CAPA DE CONTROLES GENERALES -->
    <div class="controls-overlay" id="controlsOverlay">
      
      <!-- ARRIBA A LA DERECHA -->
      <div class="top-controls">
        <button class="icon-btn" id="btnCast" title="Transmitir">
          <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        </button>

        <button class="icon-btn" id="btnPip" title="PiP (Vídeo pequeño)">
          <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 0H3V5h18v14z"/></svg>
        </button>

        <button class="icon-btn" id="btnSettings" title="Ajustes">
          <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5-3.5z"/></svg>
        </button>
      </div>

      <!-- TRES OPCIONES CENTRALES -->
      <div class="center-controls">
        <button class="btn-center" id="btnRewind" title="-10 Segundos">
          <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor;"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
        </button>

        <button class="btn-center play-main" id="btnCenterPlay" title="Pausar / Reproducir">
          <svg id="centerIconPlay" viewBox="0 0 24 24" style="width:34px;height:34px;fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>
          <svg id="centerIconPause" viewBox="0 0 24 24" style="width:34px;height:34px;fill:currentColor;display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <button class="btn-center" id="btnForward" title="+10 Segundos">
          <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:currentColor;"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.16-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
        </button>
      </div>

      <!-- ABAJO -->
      <div class="bottom-controls-wrapper">
        <!-- BARRA DESLIZANTE CON BUFFER REAL -->
        <div class="scrubber-container">
          <input type="range" class="video-scrubber" id="videoScrubber" min="0" max="100" value="0" step="0.05">
        </div>

        <div class="bottom-row">
          <!-- ABAJO A LA IZQUIERDA -->
          <div class="bottom-left">
            <button class="icon-btn" id="btnBottomPlay">
              <svg id="bottomIconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg id="bottomIconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <div class="volume-group">
              <button class="icon-btn" id="btnMute">
                <svg id="iconVolHigh" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <svg id="iconVolMute" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
            </div>

            <!-- CONTADOR DE TIEMPO ÚNICO MODO CONMUTABLE -->
            <div class="time-counter" id="timeDisplay" title="Clic para alternar modo de tiempo">0:00:00</div>
          </div>

          <!-- ABAJO A LA DERECHA -->
          <div class="bottom-right">
            <button class="icon-btn" id="btnCopyLink" title="Copiar Enlace">
              <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>

            <button class="icon-btn" id="btnDownload" title="Descargar Vídeo">
              <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>

            <button class="icon-btn" id="btnFullscreen" title="Maximizar">
              <svg id="iconFS" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              <svg id="iconExitFS" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- PANELS / MODALES -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-item">
        <span>Calidad</span>
        <select id="selectQuality">
          <option value="-1">Automática</option>
        </select>
      </div>

      <div class="settings-item">
        <span>Velocidad de reproducción</span>
        <select id="selectSpeed">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x (Normal)</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
      </div>

      <div class="settings-item" id="optLockScreen" style="cursor:pointer;">
        <span>Bloquear pantalla</span>
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
    </div>

    <!-- CAPA DE DESBLOQUEO -->
    <div class="lock-overlay" id="lockOverlay">
      <button class="icon-btn" id="btnUnlock" style="background:rgba(20,3,38,0.8); border:1px solid var(--purple-main);">
        <svg viewBox="0 0 24 24"><path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h1.9c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10z"/></svg>
      </button>
    </div>

    <div class="toast-msg" id="toastMsg">Mensaje</div>
  </div>

  <!-- SECCIÓN SUPERIOR DE CARGA (DEBAJO DEL REPRODUCTOR) -->
  <div class="url-section">
    <div class="url-title">Cargar Fuente de Vídeo (.mp4 / .m3u8)</div>
    <div class="input-wrapper">
      <input type="text" id="urlInput" class="url-input" placeholder="Pega tu URL de vídeo aquí..." />
      <button id="btnLoad" class="btn-load">Cargar</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('mainVideo');
      const playerWrapper = document.getElementById('playerWrapper');
      const controlsOverlay = document.getElementById('controlsOverlay');
      
      const btnCenterPlay = document.getElementById('btnCenterPlay');
      const centerIconPlay = document.getElementById('centerIconPlay');
      const centerIconPause = document.getElementById('centerIconPause');
      
      const btnBottomPlay = document.getElementById('btnBottomPlay');
      const bottomIconPlay = document.getElementById('bottomIconPlay');
      const bottomIconPause = document.getElementById('bottomIconPause');
      
      const btnRewind = document.getElementById('btnRewind');
      const btnForward = document.getElementById('btnForward');

      const btnMute = document.getElementById('btnMute');
      const iconVolHigh = document.getElementById('iconVolHigh');
      const iconVolMute = document.getElementById('iconVolMute');
      const volumeSlider = document.getElementById('volumeSlider');

      const videoScrubber = document.getElementById('videoScrubber');
      const timeDisplay = document.getElementById('timeDisplay');

      const btnSettings = document.getElementById('btnSettings');
      const settingsPanel = document.getElementById('settingsPanel');
      const selectSpeed = document.getElementById('selectSpeed');
      const selectQuality = document.getElementById('selectQuality');
      const optLockScreen = document.getElementById('optLockScreen');
      const lockOverlay = document.getElementById('lockOverlay');
      const btnUnlock = document.getElementById('btnUnlock');

      const btnCopyLink = document.getElementById('btnCopyLink');
      const btnDownload = document.getElementById('btnDownload');
      const btnFullscreen = document.getElementById('btnFullscreen');
      const iconFS = document.getElementById('iconFS');
      const iconExitFS = document.getElementById('iconExitFS');
      const btnPip = document.getElementById('btnPip');
      const btnCast = document.getElementById('btnCast');

      const urlInput = document.getElementById('urlInput');
      const btnLoad = document.getElementById('btnLoad');
      const toastMsg = document.getElementById('toastMsg');

      let hlsInstance = null;
      let currentUrl = '';
      let controlsTimer = null;
      let isSeeking = false;

      // MODOS DE TIEMPO: 0 = Transcurrido, 1 = Faltante, 2 = Total
      let timeMode = 0;

      function showToast(txt) {
        toastMsg.textContent = txt;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), 2000);
      }

      // DESVANECIDO CONFIGURADO A 10 SEGUNDOS
      function resetAutoHide() {
        clearTimeout(controlsTimer);
        if (!video.paused) {
          controlsTimer = setTimeout(() => {
            controlsOverlay.classList.remove('active');
            settingsPanel.classList.remove('active');
          }, 10000);
        }
      }

      function togglePlay() {
        if (video.paused) {
          video.play
