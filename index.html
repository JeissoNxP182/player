<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeissoNxP | Películas, Series y Vídeos</title>
  <!-- METADATOS PARA COMPARTIR EN REDES SOCIALES (Open Graph / WhatsApp / Facebook) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="JeissoNxP | Películas, Series y Vídeos 👽">
  <meta property="og:description" content="Mi Librería Personal">
  <meta property="og:image" content="https://img.magnific.com/fotos-premium/mujer-hombre-mascaras-monstruo-viendo-pelicula-palomitas-maiz-juntos_266732-44847.jpg?semt=ais_hybrid&w=740&q=80">
  <meta property="og:url" content="https://jeissonxp182.github.io/player/">

  <!-- TARJETAS PARA X (TWITTER) Y DISCORD -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JeissoNxP | Películas, Series y Vídeos 👽">
  <meta name="twitter:description" content="Mi Libreria Personal">
  <meta name="twitter:image" content="https://img.magnific.com/fotos-premium/mujer-hombre-mascaras-monstruo-viendo-pelicula-palomitas-maiz-juntos_266732-44847.jpg?semt=ais_hybrid&w=740&q=80">
  
  <style>
    :root {
      --bg-dark: #09070f;
      --card-bg: #130f1e;
      --card-hover: #1c162e;
      --accent-purple: #a855f7;
      --accent-glow: #7e22ce;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-purple: rgba(168, 85, 247, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* HEADER */
    header {
      padding: 25px 5% 15px 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-purple);
      background: rgba(9, 7, 15, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .alien-emoji {
      font-size: 2.2rem;
      line-height: 1;
      filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.7));
    }
    
    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 600;
    }

    /* DESPLEGABLE */
    .nav-select {
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      border: 1px solid var(--border-purple);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-select:focus, .nav-select:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
    }

    .nav-select option {
      background: #120d1f;
      color: #ffffff;
    }

    /* BUSCADOR */
    .search-box {
      width: 100%;
      max-width: 550px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-purple);
      background: rgba(19, 15, 30, 0.9);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
    }
    
    /* CONTENEDOR PRINCIPAL */
    main {
      padding: 30px 5%;
    }

    .saga-section {
      margin-bottom: 25px;
      background: rgba(19, 15, 30, 0.4);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      overflow: hidden;
    }

    /* CABECERA ACORDEÓN DE SAGA */
    .saga-header {
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 20px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: rgba(28, 22, 46, 0.6);
      user-select: none;
      transition: background 0.2s ease;
    }

    .saga-header:hover {
      background: rgba(126, 34, 206, 0.25);
    }

    .saga-title-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .folder-icon {
      font-size: 1.4rem;
    }

    .arrow-icon {
      font-size: 0.9rem;
      transition: transform 0.3s ease;
      color: var(--accent-purple);
    }

    .saga-section.collapsed .arrow-icon {
      transform: rotate(-90deg);
    }

    .saga-content {
      padding: 20px;
      transition: all 0.3s ease;
    }

    .saga-section.collapsed .saga-content {
      display: none;
    }

    /* GRID HORIZONTAL (16:9) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-purple);
      box-shadow: 0 10px 25px rgba(126, 34, 206, 0.35);
      background: var(--card-hover);
    }

    /* MARCO 16:9 HORIZONTAL */
    .poster-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.04);
    }

    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: auto;
      font-weight: 600;
    }

    /* MODAL CINEMÁTICO */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 3, 10, 0.9);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #120d1f;
      border: 1px solid var(--border-purple);
      border-radius: 16px;
      max-width: 650px;
      width: 100%;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(126, 34, 206, 0.3);
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    .modal-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .modal-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-details {
      padding: 25px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border-purple);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .modal-close:hover {
      background: var(--accent-purple);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .modal-tags {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
    }

    .tag {
      background: rgba(168, 85, 247, 0.15);
      color: #ffffff;
      border: 1px solid var(--border-purple);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-description {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-glow));
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: all 0.2s ease;
      display: block;
    }

    .btn-play:hover {
      filter: brightness(1.15);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-title">
        <span class="alien-emoji">👽</span>
        <h1>JeissoNxP</h1>
      </div>
      <p>películas, series y vídeos</p>
    </div>
    
    <div class="nav-dropdown-container">
      <select class="nav-select" id="sectionSelect">
        <option value="sagas" selected>📁 Sagas</option>
        <option value="peliculas">🎭 Películas</option>
        <option value="series">👀 Series</option>
        <option value="anime">🇯🇵 Anime</option>
        <option value="videos">📽️ Videos</option>
      </select>
    </div>
  
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar título, año o saga..." oninput="filterCatalog()">
    </div>
  </header>

  <main id="catalogContainer">
    <!-- Se cargan dinámicamente las películas -->
  </main>

  <!-- MODAL -->
  <div id="movieModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-banner">
        <img id="modalImg" src="" alt="Portada">
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="modal-title"></h2>
        <div class="modal-tags">
          <span id="modalYear" class="tag"></span>
          <span id="modalDuration" class="tag"></span>
        </div>
        <p id="modalSinopsis" class="modal-description"></p>
        <a id="modalPlayBtn" href="#" class="btn-play">▶ REPRODUCIR AHORA</a>
      </div>
    </div>
  </div>

  <script>
    // 📁 MAPPING DE TUS NUEVOS ARCHIVOS JSON UNIFICADOS
    const CATALOG_SOURCES = {
      sagas: 'https://jeissonxp182.github.io/peliculas/sagas.json',
      peliculas: 'https://jeissonxp182.github.io/peliculas/peliculas.json',
      series: 'https://jeissonxp182.github.io/peliculas/series.json',
      anime: 'https://jeissonxp182.github.io/peliculas/anime.json',
      videos: 'https://jeissonxp182.github.io/peliculas/videos.json'
    };

    let currentData = [];

    // Formateador de duración: "01h33m" -> "01h:33m"
    function formatDuration(dur) {
      if (!dur) return '';
      return dur.replace(/(\d+h)(\d+m)/, '$1:$2');
    }

    // Carga un archivo JSON evitando problemas de caché
    async function fetchJSONSafely(url) {
      try {
        const res = await fetch(`${url}?v=${Math.random()}`);
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (err) {
        console.warn('No se pudo leer el archivo:', url, err);
        return [];
      }
    }

    // Cargar la sección seleccionada desde el desplegable
    async function loadSection(sectionKey) {
      const url = CATALOG_SOURCES[sectionKey];
      const container = document.getElementById('catalogContainer');

      container.innerHTML = '<p style="text-align:center; color:var(--accent-purple); margin-top:50px;">Cargando contenido...</p>';

      if (!url) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px;">Próximamente más contenido en esta sección 🚀</p>';
        currentData = [];
        return;
      }

      currentData = await fetchJSONSafely(url);
      renderCatalog(currentData);
    }

    // Escuchar cambios en el selector
    document.getElementById('sectionSelect').addEventListener('change', (e) => {
      document.getElementById('searchInput').value = ''; // Limpiar la barra de búsqueda al cambiar
      loadSection(e.target.value);
    });

    // DETECTOR DE PARÁMETRO EN URL (REPRODUCTOR PROPIO HTML5)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const videoUrl = urlParams.get('url');

      if (videoUrl) {
        const finalVideoSrc = decodeURIComponent(videoUrl);
        const mainContainer = document.getElementById('catalogContainer');

        if (mainContainer) {
          mainContainer.innerHTML = `
            <div style="max-width: 1000px; margin: 20px auto; width: 100%;">
              <a href="index.html" style="display:inline-block; margin-bottom:15px; color:var(--accent-purple); text-decoration:none; font-weight:600; font-size:1rem;">← Volver al catálogo</a>
              
              <div style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-purple); box-shadow: 0 10px 30px rgba(126, 34, 206, 0.4);">
                <video controls autoplay style="width:100%; height:100%; outline:none; background:#000;">
                  <source src="${finalVideoSrc}" type="video/mp4">
                  Tu navegador no soporta el reproductor de video HTML5.
                </video>
              </div>
            </div>
          `;
        }
      } else {
        // Carga inicial normal del catálogo
        loadSection('sagas');
      }
    });

    // DIBUJAR TARJETA INDIVIDUAL
    function createCardElement(peli) {
      const formattedDur = formatDuration(peli.duracion);
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openModal(peli);

      card.innerHTML = `
        <div class="poster-wrapper">
          <img src="${peli.portada}" alt="${peli.titulo}" loading="lazy">
        </div>
        <div class="card-info">
          <div class="card-title">${peli.titulo}</div>
          <div class="card-meta">${peli.ano || ''} ${formattedDur ? '• ' + formattedDur : ''}</div>
        </div>
      `;

      return card;
    }

    // RENDERIZAR TODO EL CATÁLOGO (Maneja tanto sagas como items sueltos)
    function renderCatalog(items) {
      const container = document.getElementById('catalogContainer');
      const currentSection = document.getElementById('sectionSelect').value;
      container.innerHTML = '';

      if (!items || items.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px; font-size:1.1rem;">No hay títulos disponibles en esta sección aún 🎬</p>';
        return;
      }

      // Iconos dinámicos
      let folderIcon = '📁';
      if (currentSection === 'peliculas') folderIcon = '🎭';
      if (currentSection === 'videos') folderIcon = '📽️';
      if (currentSection === 'series') folderIcon = '👀';
      if (currentSection === 'anime') folderIcon = '🇯🇵';

      // Verificar si los datos tienen estructura de SAGAS (con el arreglo de peliculas dentro)
      const esEstructuraSagas = items.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        // --- VISTA DE SAGAS CON ACORDEONES ---
        items.forEach(saga => {
          if (!saga.peliculas || saga.peliculas.length === 0) return;

          const sagaSection = document.createElement('div');
          sagaSection.className = 'saga-section';

          const sagaHeader = document.createElement('div');
          sagaHeader.className = 'saga-header';
          sagaHeader.onclick = () => sagaSection.classList.toggle('collapsed');

          sagaHeader.innerHTML = `
            <div class="saga-title-content">
              <span class="folder-icon">${folderIcon}</span>
              <span>${saga.saga}</span>
            </div>
            <span class="arrow-icon">▼</span>
          `;

          sagaSection.appendChild(sagaHeader);

          const sagaContent = document.createElement('div');
          sagaContent.className = 'saga-content';

          const grid = document.createElement('div');
          grid.className = 'grid-container';

          saga.peliculas.forEach(peli => {
            grid.appendChild(createCardElement(peli));
          });

          sagaContent.appendChild(grid);
          sagaSection.appendChild(sagaContent);
          container.appendChild(sagaSection);
        });
      } else {
        // --- VISTA DIRECTA DE PELÍCULAS/VIDEOS SUELTOS EN PARRILLA ---
        const grid = document.createElement('div');
        grid.className = 'grid-container';

        items.forEach(item => {
          grid.appendChild(createCardElement(item));
        });

        container.appendChild(grid);
      }
    }

    // BUSCADOR INTELIGENTE
    function filterCatalog() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      if (!query) {
        renderCatalog(currentData);
        return;
      }

      const esEstructuraSagas = currentData.some(item => item.peliculas && Array.isArray(item.peliculas));

      if (esEstructuraSagas) {
        const filtered = currentData.map(saga => {
          const matchesSaga = saga.saga.toLowerCase().includes(query);
          const filteredPelis = saga.peliculas.filter(peli => {
            const matchesTitle = peli.titulo ? peli.titulo.toLowerCase().includes(query) : false;
            const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
            return matchesTitle || matchesYear || matchesSaga;
          });

          return { ...saga, peliculas: filteredPelis };
        }).filter(saga => saga.peliculas.length > 0);

        renderCatalog(filtered);
      } else {
        const filtered = currentData.filter(peli => {
          const matchesTitle = peli.titulo ? peli.titulo.toLowerCase().includes(query) : false;
          const matchesYear = peli.ano ? peli.ano.toString().includes(query) : false;
          return matchesTitle || matchesYear;
        });

        renderCatalog(filtered);
      }
    }

    // MODAL DETALLES
    function openModal(peli) {
      const formattedDur = formatDuration(peli.duracion);

      document.getElementById('modalImg').src = peli.portada || '';
      document.getElementById('modalTitle').innerText = peli.titulo || 'Sin título';
      document.getElementById('modalYear').innerHTML = `📅 ${peli.ano || 'S/A'}`;
      document.getElementById('modalDuration').innerHTML = `🕕 ${formattedDur || 'N/A'}`;
      document.getElementById('modalSinopsis').innerText = peli.sinopsis || 'Sin descripción disponible.';

      // Extraer enlace directo
      const videoSource = peli.url_video || peli.link || peli.iframe || peli.url;
      document.getElementById('modalPlayBtn').href = `?url=${encodeURIComponent(videoSource)}`;

      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal(event) {
      document.getElementById('movieModal').style.display = 'none';
    }
  </script>
</body>
</html>
